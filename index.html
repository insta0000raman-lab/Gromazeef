<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090f">
  <meta name="description" content="Gromazeef — Share moments, discover creators and connect with your community.">
  <meta name="color-scheme" content="dark">
  <title>Gromazeef — Connect. Create. Discover.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #09090f;
      --surface: #111119;
      --surface-2: #181823;
      --surface-3: #222232;
      --border: #29293b;
      --text: #f8f8fc;
      --muted: #9999ad;
      --accent: #a855f7;
      --accent-2: #ec4899;
      --success: #36d399;
      --danger: #fb7185;
      --warning: #fbbf24;
      --radius: 18px;
      --radius-small: 12px;
      --page-width: 1280px;
      --shadow: 0 12px 40px #0004;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    body,
    button,
    input,
    textarea,
    select {
      font-family: Inter, Arial, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font-size: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    input,
    textarea,
    select {
      color: var(--text);
    }

    input,
    textarea {
      min-width: 0;
    }

    textarea {
      resize: vertical;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img,
    video {
      max-width: 100%;
    }

    img {
      display: block;
    }

    ::selection {
      color: white;
      background: #a855f7;
    }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--surface-3);
      border-radius: 20px;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
    }

    .text-center {
      text-align: center;
    }

    .small-text {
      font-size: 12px;
    }

    .app-logo {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1.3px;
      line-height: 1.2;
      white-space: nowrap;
      background: linear-gradient(115deg, #c084fc, #a855f7 45%, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .app-logo-mark {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      color: white;
      font-size: 17px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 5px 20px #a855f733;
    }

    .primary-btn,
    .secondary-btn,
    .danger-btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: var(--radius-small);
      font-weight: 700;
      transition: transform .15s ease, opacity .15s ease, background .15s ease;
    }

    .primary-btn {
      background: linear-gradient(110deg, var(--accent), var(--accent-2));
      color: white;
    }

    .secondary-btn {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text);
    }

    .danger-btn {
      background: #fb71851a;
      border-color: #fb718544;
      color: var(--danger);
    }

    .primary-btn:hover,
    .secondary-btn:hover,
    .danger-btn:hover {
      transform: translateY(-1px);
    }

    .primary-btn:active,
    .secondary-btn:active,
    .danger-btn:active {
      transform: scale(.98);
    }

    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      font-size: 17px;
    }

    .icon-btn:hover {
      background: var(--surface-2);
      border-color: var(--border);
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 16px;
    }

    .field label {
      color: #d7d7e4;
      font-size: 13px;
      font-weight: 600;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      min-height: 46px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--surface-2);
      color: var(--text);
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .field textarea {
      min-height: 110px;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #a855f71c;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #77778b;
    }

    .field-help {
      font-size: 12px;
      color: var(--muted);
    }

    .avatar {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      object-fit: cover;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface-3);
    }

    .avatar-small {
      width: 34px;
      height: 34px;
      flex-basis: 34px;
    }

    .avatar-large {
      width: 100px;
      height: 100px;
      flex-basis: 100px;
    }

    .loading {
      display: flex;
      min-height: 100vh;
      min-height: 100dvh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-right-color: var(--accent-2);
      border-radius: 50%;
      animation: gromazeef-spin .8s linear infinite;
    }

    @keyframes gromazeef-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast-container {
      position: fixed;
      z-index: 10000;
      top: max(14px, env(safe-area-inset-top));
      right: 14px;
      display: grid;
      gap: 10px;
      width: min(360px, calc(100vw - 28px));
      pointer-events: none;
    }

    .toast {
      padding: 13px 15px;
      overflow-wrap: anywhere;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface-2);
      box-shadow: var(--shadow);
      animation: toast-in .2s ease-out;
    }

    .toast.error {
      border-color: #fb718566;
    }

    .toast.success {
      border-color: #36d39966;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(-7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .empty-state-icon {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      margin: 0 auto 16px;
      border-radius: 20px;
      background: var(--surface-2);
      color: #c084fc;
      font-size: 25px;
    }

    .empty-state h3 {
      margin: 0 0 8px;
    }

    .empty-state p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .divider {
      height: 1px;
      margin: 18px 0;
      background: var(--border);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 100px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .verified-badge {
      color: #60a5fa;
      border-color: #60a5fa44;
      background: #60a5fa12;
    }

    .online-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border: 2px solid var(--surface);
      border-radius: 50%;
      background: var(--success);
    }

    .card {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .card-body {
      padding: 16px;
    }

    #app {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .auth-screen {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(ellipse at 10% 10%, #a855f71a, transparent 42%),
        radial-gradient(ellipse at 90% 90%, #ec489915, transparent 40%),
        var(--bg);
    }

    .auth-card {
      width: min(100%, 440px);
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: #111119ee;
      box-shadow: 0 25px 100px #0005;
    }

    .auth-card .app-logo {
      margin-bottom: 25px;
    }

    .auth-card h1 {
      margin: 0 0 7px;
      font-size: 27px;
      letter-spacing: -1px;
    }

    .auth-card > p {
      margin-top: 0;
    }

    .auth-card .primary-btn {
      width: 100%;
    }

    .auth-footer {
      margin-top: 20px;
      color: var(--muted);
      text-align: center;
    }

    .auth-footer button {
      margin-left: 5px;
    }

    .topbar {
      position: sticky;
      z-index: 500;
      top: 0;
      border-bottom: 1px solid var(--border);
      background: #09090ff0;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: min(100%, var(--page-width));
      min-height: 72px;
      margin: 0 auto;
      padding: 12px 24px;
    }

    .global-search {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(360px, 35vw);
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface);
      color: var(--muted);
    }

    .global-search input {
      width: 100%;
      min-height: 42px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 230px minmax(0, 650px) 270px;
      align-items: start;
      gap: 25px;
      width: min(100%, var(--page-width));
      margin: 0 auto;
      padding: 26px 24px 60px;
    }

    .sidebar {
      position: sticky;
      top: 96px;
      display: grid;
      gap: 8px;
      align-self: start;
    }

    .sidebar-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 10px 20px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-profile-info {
      min-width: 0;
    }

    .sidebar-profile-name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-profile-username {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 47px;
      padding: 12px 15px;
      border: 1px solid transparent;
      border-radius: 13px;
      background: transparent;
      color: #b5b5c8;
      text-align: left;
      transition: background .15s ease, color .15s ease;
    }

    .nav-btn i {
      width: 22px;
      font-size: 18px;
      text-align: center;
    }

    .nav-btn span {
      font-size: 13px;
      font-weight: 600;
    }

    .nav-btn:hover,
    .nav-btn.active {
      border-color: var(--border);
      background: var(--surface-2);
      color: white;
    }

    .nav-btn.active i {
      color: #c084fc;
    }

    .sidebar-create {
      width: 100%;
      margin-top: 14px;
    }

    .page-content {
      min-width: 0;
    }

    .page-heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .page-heading {
      margin: 0;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -.8px;
    }

    .page-description {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .right-sidebar {
      position: sticky;
      top: 96px;
      display: grid;
      gap: 18px;
    }

    .right-panel {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .right-panel h3 {
      margin: 0 0 15px;
      font-size: 14px;
    }

    .right-panel p {
      color: var(--muted);
      font-size: 12px;
    }

    .mobile-nav {
      display: none;
    }

    @media (max-width: 1100px) {
      .app-layout {
        grid-template-columns: 205px minmax(0, 1fr);
      }

      .right-sidebar {
        display: none;
      }
    }

    @media (max-width: 720px) {
      body {
        font-size: 14px;
      }

      .topbar-inner {
        min-height: 62px;
        gap: 10px;
        padding: 10px 12px;
      }

      .app-logo {
        gap: 7px;
        font-size: 22px;
      }

      .app-logo-mark {
        width: 30px;
        height: 30px;
        font-size: 15px;
      }

      .global-search {
        width: auto;
        flex: 1;
        min-width: 0;
      }

      .global-search input {
        min-height: 38px;
        font-size: 12px;
      }

      .topbar-actions {
        gap: 3px;
      }

      .topbar-actions .icon-btn {
        width: 36px;
        height: 36px;
      }

      .topbar-actions .logout-label {
        display: none;
      }

      .app-layout {
        display: block;
        padding: 18px 12px calc(95px + env(safe-area-inset-bottom));
      }

      .sidebar,
      .right-sidebar {
        display: none;
      }

      .page-heading {
        font-size: 22px;
      }

      .mobile-nav {
        position: fixed;
        z-index: 900;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        justify-content: space-around;
        gap: 2px;
        padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--border);
        background: #111119f5;
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
      }

      .mobile-nav .nav-btn {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 54px;
        padding: 7px 3px;
        border-radius: 10px;
      }

      .mobile-nav .nav-btn i {
        width: auto;
        font-size: 19px;
      }

      .mobile-nav .nav-btn span {
        display: block;
        font-size: 9px;
        font-weight: 600;
      }

      .auth-card {
        padding: 24px 20px;
      }

      .avatar-large {
        width: 82px;
        height: 82px;
        flex-basis: 82px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

function $(selector, root = document) {
  return root.querySelector(selector);
}

function $$(selector, root = document) {
  return Array.from(root.querySelectorAll(selector));
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => {
    const entities = {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    };

    return entities[character];
  });
}

function safeURL(value) {
  if (!value) {
    return "";
  }

  try {
    const url = new URL(value, window.location.origin);

    if (
      url.protocol !== "https:" &&
      url.protocol !== "http:" &&
      url.protocol !== "blob:"
    ) {
      return "";
    }

    return url.href;
  } catch {
    return "";
  }
}

function showToast(message, type = "info", duration = 3500) {
  const container = $("#toast-container");

  if (!container) {
    console.log(message);
    return;
  }

  const toast = document.createElement("div");

  toast.className =
    "toast" +
    (type === "error" ? " error" : "") +
    (type === "success" ? " success" : "");

  toast.setAttribute("role", "status");
  toast.textContent = String(message ?? "");

  container.appendChild(toast);

  window.setTimeout(() => {
    toast.remove();
  }, duration);
}

function setAppContent(html) {
  const app = $("#app");

  if (!app) {
    console.error("Gromazeef app container is missing.");
    return;
  }

  app.innerHTML = html;
}

}

        </div>

        <h1>${escapeHTML(title)}</h1>
        <p class="muted">${escapeHTML(message)}</p>

        <button class="primary-btn" id="retry-app" type="button">

        </button>
      </div>

  const retryButton = $("#retry-app");

  if (retryButton) {
    retryButton.addEventListener("click", () => {
      window.location.reload();
    });
  }
}

function getDisplayName(profile = state.profile) {
  if (!profile) {
    return state.user?.email?.split("@")[0] || "Gromazeef User";
  }

  return (
    profile.display_name ||
    profile.full_name ||
    profile.name ||
    profile.username ||
    "Gromazeef User"
  );
}

function getUsername(profile = state.profile) {
  if (!profile?.username) {
    return "@user";
  }

  return "@" + String(profile.username).replace(/^@/, "");
}

function getAvatar(profile = state.profile) {
  return (
    profile?.avatar_url ||
    profile?.profile_picture ||
    profile?.photo_url ||
    DEFAULT_AVATAR
  );
}

function getUserId() {
  return state.user?.id || null;
}

function isOwnProfile(profile) {
  return Boolean(
    state.user &&
    profile &&
    profile.id === state.user.id
  );
}

function formatDate(value) {
  if (!value) {
    return "";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleDateString(undefined, {
    day: "numeric",
    month: "short",
    year: "numeric"
  });
}

function formatDateTime(value) {
  if (!value) {
    return "";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleString(undefined, {
    day: "numeric",
    month: "short",
    hour: "numeric",
    minute: "2-digit"
  });
}

function formatTime(value) {
  if (!value) {
    return "";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleTimeString(undefined, {
    hour: "numeric",
    minute: "2-digit"
  });
}

function timeAgo(value) {
  if (!value) {
    return "";
  }

  const date = new Date(value);
  const timestamp = date.getTime();

  if (Number.isNaN(timestamp)) {
    return "";
  }

  const seconds = Math.floor((Date.now() - timestamp) / 1000);

  if (seconds < 60) {
    return "Just now";
  }

  if (seconds < 3600) {
    return Math.floor(seconds / 60) + "m ago";
  }

  if (seconds < 86400) {
    return Math.floor(seconds / 3600) + "h ago";
  }

  if (seconds < 604800) {
    return Math.floor(seconds / 86400) + "d ago";
  }

  return formatDate(value);
}

function formatCount(value) {
  const number = Number(value) || 0;

  if (number >= 1000000) {
    return (number / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
  }

  if (number >= 1000) {
    return (number / 1000).toFixed(1).replace(/\.0$/, "") + "K";
  }

  return String(number);
}

function normalizeUsername(value) {
  return String(value ?? "")
    .trim()
    .toLowerCase()
    .replace(/^@/, "");
}

function validateUsername(value) {
  return /^[a-z0-9_.]{3,30}$/.test(normalizeUsername(value));
}

function getInitials(value) {
  const name = String(value ?? "").trim();

  if (!name) {
    return "G";
  }

  return name
    .split(/\s+/)
    .slice(0, 2)
    .map(part => part.charAt(0).toUpperCase())
    .join("");
}

function requireLogin() {
  if (!state.user) {
    showToast("Pehle login karo.", "error");
    renderAuth();
    return false;
  }

  return true;
}

function setLoading(isLoading) {
  state.loading = Boolean(isLoading);
}

function resetTransientState() {
  state.selectedFile = null;
  state.selectedMediaType = null;
  state.selectedPost = null;
  state.selectedProfile = null;
  state.searchQuery = "";
  state.searchResults = [];
  state.isEditingProfile = false;
  state.isSendingMessage = false;
}

function createClient() {
  if (
    !window.supabase ||
    typeof window.supabase.createClient !== "function"
  ) {
    throw new Error(
      "Supabase library load nahi hui. Internet connection check karo."
    );
  }

  if (
    !SUPABASE_URL.startsWith("https://") ||
    !SUPABASE_ANON_KEY ||
    SUPABASE_ANON_KEY.includes("PASTE_YOUR_SUPABASE")
  ) {
    throw new Error(
      "Supabase public key configuration mein add nahi ki gayi."
    );
  }

  return window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      },
      global: {
        headers: {
          "X-Client-Info": "gromazeef-web"
        }
      }
    }
  );
}

function getDatabaseErrorMessage(error) {
  if (!error) {
    return "Kuch galat ho gaya.";
  }

  const message = String(error.message || "");

  if (
    message.toLowerCase().includes("row-level security") ||
    message.toLowerCase().includes("permission denied")
  ) {
    return "Database permissions check karni hongi.";
  }

  if (
    message.toLowerCase().includes("failed to fetch") ||
    message.toLowerCase().includes("network")
  ) {
    return "Internet ya Supabase connection check karo.";
  }

  if (
    message.toLowerCase().includes("duplicate key") ||
    error.code === "23505"
  ) {
    return "Ye information pehle se use ho rahi hai.";
  }

  return message || "Request complete nahi ho payi.";
}

function handleError(error, context = "Gromazeef") {
  console.error(context + " error:", error);

  showToast(
    getDatabaseErrorMessage(error),
    "error",
    5000
  );
}

function stopRefresh() {
  if (state.refreshTimer) {
    window.clearInterval(state.refreshTimer);
    state.refreshTimer = null;
  }
}

function startRefresh() {
  stopRefresh();

  state.refreshTimer = window.setInterval(() => {
    if (!state.user || !state.client) {
      stopRefresh();
      return;
    }

    if (document.visibilityState !== "visible") {
      return;
    }

    if (state.currentPage === "home") {
      renderHome().catch(error => {
        console.error("Background feed refresh failed:", error);
      });
    }
  }, 60000);
}

window.addEventListener("online", () => {
  showToast("Internet connection restored.", "success");
});

window.addEventListener("offline", () => {
  showToast("Internet connection chala gaya.", "error", 5000);
});

  <script>
async function renderAuth() {
  setAppContent(`
    <section class="auth-screen">
      <div class="auth-card">
        <a href="#" class="app-logo">
          <span class="app-logo-mark">
            <i class="fa-solid fa-bolt"></i>
          </span>
          Gromazeef
        </a>

        <h1 id="auth-heading">Welcome back</h1>
        <p class="muted" id="auth-description">
          Apni community se connect karo.
        </p>

        <div id="auth-error" class="hidden" role="alert"></div>

        <form id="auth-form" novalidate>
          <div id="signup-fields" class="hidden">
            <div class="field">
              <label for="auth-name">Display name</label>
              <input
                id="auth-name"
                type="text"
                maxlength="60"
                autocomplete="name"
                placeholder="Your name"
              >
            </div>

            <div class="field">
              <label for="auth-username">Username</label>
              <input
                id="auth-username"
                type="text"
                minlength="3"
                maxlength="30"
                autocomplete="username"
                placeholder="your_username"
              >
              <span class="field-help">
                3–30 characters: letters, numbers, dots aur underscores.
              </span>
            </div>
          </div>

          <div class="field">
            <label for="auth-email">Email address</label>
            <input
              id="auth-email"
              type="email"
              required
              autocomplete="email"
              placeholder="you@example.com"
            >
          </div>

          <div class="field">
            <label for="auth-password">Password</label>
            <input
              id="auth-password"
              type="password"
              required
              minlength="6"
              autocomplete="current-password"
              placeholder="At least 6 characters"
            >
          </div>

          <button
            id="auth-submit"
            class="primary-btn"
            type="submit"
          >
            <i class="fa-solid fa-right-to-bracket"></i>
            Log in
          </button>
        </form>

        <div class="auth-footer">
          <span id="auth-switch-text">New to Gromazeef?</span>
          <button
            id="auth-switch"
            class="secondary-btn"
            type="button"
          >
            Create account
          </button>
        </div>

        <div style="margin-top:14px">
          <button
            id="auth-reset"
            class="secondary-btn"
            type="button"
            style="width:100%"
          >
            Forgot password?
          </button>
        </div>

        <p class="muted small-text text-center" style="margin-top:20px">
          By continuing, you agree to use Gromazeef respectfully.
        </p>
      </div>
    </section>
  `);

  let signupMode = false;

  const form = $("#auth-form");
  const signupFields = $("#signup-fields");
  const heading = $("#auth-heading");
  const description = $("#auth-description");
  const submitButton = $("#auth-submit");
  const switchButton = $("#auth-switch");
  const switchText = $("#auth-switch-text");
  const resetButton = $("#auth-reset");
  const passwordInput = $("#auth-password");
  const emailInput = $("#auth-email");
  const nameInput = $("#auth-name");
  const usernameInput = $("#auth-username");

  function showAuthError(message) {
    const box = $("#auth-error");

    if (!box) {
      showToast(message, "error");
      return;
    }

    box.className = "toast error";
    box.textContent = message;
  }

  function clearAuthError() {
    const box = $("#auth-error");

    if (box) {
      box.className = "hidden";
      box.textContent = "";
    }
  }

  function updateAuthMode() {
    signupFields.classList.toggle("hidden", !signupMode);

    heading.textContent = signupMode
      ? "Create your account"
      : "Welcome back";

    description.textContent = signupMode
      ? "Apni Gromazeef community banana shuru karo."
      : "Login karke apni community se connect karo.";

    submitButton.innerHTML = signupMode
      ? '<i class="fa-solid fa-user-plus"></i> Create account'
      : '<i class="fa-solid fa-right-to-bracket"></i> Log in';

    switchText.textContent = signupMode
      ? "Already have an account?"
      : "New to Gromazeef?";

    switchButton.textContent = signupMode
      ? "Log in"
      : "Create account";

    passwordInput.autocomplete = signupMode
      ? "new-password"
      : "current-password";

    nameInput.required = signupMode;
    usernameInput.required = signupMode;

    clearAuthError();
  }

  switchButton.addEventListener("click", () => {
    signupMode = !signupMode;
    updateAuthMode();
  });

  usernameInput.addEventListener("input", () => {
    usernameInput.value = normalizeUsername(
      usernameInput.value
    ).replace(/[^a-z0-9_.]/g, "");
  });

  form.addEventListener("submit", async event => {
    event.preventDefault();
    clearAuthError();

    if (!state.client) {
      showAuthError("Supabase connection available nahi hai.");
      return;
    }

    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const displayName = nameInput.value.trim();
    const username = normalizeUsername(usernameInput.value);

    if (!email || !password) {
      showAuthError("Email aur password dono bharo.");
      return;
    }

    if (password.length < 6) {
      showAuthError("Password kam se kam 6 characters ka rakho.");
      return;
    }

    if (signupMode && !displayName) {
      showAuthError("Apna display name bharo.");
      return;
    }

    if (signupMode && !validateUsername(username)) {
      showAuthError(
        "Username 3–30 characters ka ho: letters, numbers, dot ya underscore."
      );
      return;
    }

    submitButton.disabled = true;
    switchButton.disabled = true;
    resetButton.disabled = true;
    submitButton.textContent = "Please wait...";

    try {
      if (signupMode) {
        const { data, error } = await state.client.auth.signUp({
          email,
          password,
          options: {
            data: {
              display_name: displayName,
              username: username
            },
            emailRedirectTo: window.location.origin +
              window.location.pathname
          }
        });

        if (error) {
          throw error;
        }

        if (data.session && data.user) {
          state.user = data.user;

          await ensureProfile();
          state.initialized = true;
          state.currentPage = "home";

          await renderShell();
          await renderPage();

          startRefresh();
        } else {
          signupMode = false;
          updateAuthMode();

          showToast(
            "Account request ho gayi. Agar email verification enabled hai, inbox check karo."
          );
        }
      } else {
        const { data, error } =
          await state.client.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          throw error;
        }

        state.user = data.user;

        await ensureProfile();

        state.initialized = true;
        state.currentPage = "home";

        await renderShell();
        await renderPage();

        startRefresh();

        showToast("Welcome back!", "success");
      }
    } catch (error) {
      console.error("Authentication error:", error);

      showAuthError(
        getDatabaseErrorMessage(error)
      );
    } finally {
      submitButton.disabled = false;
      switchButton.disabled = false;
      resetButton.disabled = false;

      updateAuthMode();
    }
  });

  resetButton.addEventListener("click", async () => {
    clearAuthError();

    const email = emailInput.value.trim();

    if (!email) {
      showAuthError(
        "Password reset ke liye pehle apna email bharo."
      );
      emailInput.focus();
      return;
    }

    resetButton.disabled = true;
    resetButton.textContent = "Sending...";

    try {
      const { error } =
        await state.client.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin +
            window.location.pathname
        });

      if (error) {
        throw error;
      }

      showToast(
        "Agar account ke liye reset available hai, email check karo.",
        "success",
        5000
      );
    } catch (error) {
      console.error("Password reset error:", error);

      showAuthError(
        getDatabaseErrorMessage(error)
      );
    } finally {
      resetButton.disabled = false;
      resetButton.textContent = "Forgot password?";
    }
  });

  updateAuthMode();
}

async function ensureProfile() {
  if (!state.client || !state.user) {
    throw new Error("Profile setup ke liye login zaroori hai.");
  }

  const user = state.user;
  const metadata = user.user_metadata || {};

  const { data: existingProfile, error: lookupError } =
    await state.client
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();

  if (lookupError) {
    throw lookupError;
  }

  if (existingProfile) {
    state.profile = existingProfile;
    return existingProfile;
  }

  const proposedUsername = normalizeUsername(
    metadata.username ||
    (user.email ? user.email.split("@")[0] : "") ||
    ("user_" + user.id.slice(0, 8))
  ).replace(/[^a-z0-9_.]/g, "").slice(0, 30);

  const newProfile = {
    id: user.id,
    username: proposedUsername.length >= 3
      ? proposedUsername
      : "user_" + user.id.slice(0, 8),
    display_name:
      metadata.display_name ||
      (user.email ? user.email.split("@")[0] : "") ||
      "Gromazeef User"
  };

  const { data: createdProfile, error: insertError } =
    await state.client
      .from("profiles")
      .insert(newProfile)
      .select("*")
      .single();

  if (insertError) {
    throw insertError;
  }

  state.profile = createdProfile;

  return createdProfile;
}

function attachShellEvents() {
  const app = $("#app");

  if (!app) {
    return;
  }

  app.querySelectorAll("[data-page]").forEach(button => {
    button.addEventListener("click", async event => {
      event.preventDefault();

      const page = button.dataset.page;

      if (!page) {
        return;
      }

      if (!state.user) {
        await renderAuth();
        return;
      }

      state.previousPage = state.currentPage;
      state.currentPage = page;

      app.querySelectorAll(".nav-btn").forEach(navButton => {
        const active = navButton.dataset.page === page;

        navButton.classList.toggle("active", active);

        if (active) {
          navButton.setAttribute("aria-current", "page");
        } else {
          navButton.removeAttribute("aria-current");
        }
      });

      await renderPage();
    });
  });

  const searchInput = $("#global-search");

  if (searchInput) {
    searchInput.addEventListener("keydown", async event => {
      if (event.key !== "Enter") {
        return;
      }

      const query = searchInput.value.trim();

      if (!query) {
        showToast("Search karne ke liye naam ya username likho.");
        return;
      }

      state.searchQuery = query;
      state.previousPage = state.currentPage;
      state.currentPage = "explore";

      await renderPage();
    });
  }

  const logoutButton = $("#logout-btn");

  if (logoutButton) {
    logoutButton.addEventListener("click", async () => {
      const confirmed = window.confirm(
        "Kya tum Gromazeef se logout karna chahte ho?"
      );

      if (!confirmed) {
        return;
      }

      logoutButton.disabled = true;

      try {
        const { error } = await state.client.auth.signOut();

        if (error) {
          throw error;
        }

        stopRefresh();

        state.user = null;
        state.profile = null;
        state.posts = [];
        state.feed = [];
        state.profiles = [];
        state.comments = [];
        state.likes = [];
        state.followers = [];
        state.following = [];
        state.savedPosts = [];
        state.notifications = [];
        state.messages = [];
        state.conversations = [];

        state.currentPage = "home";
        state.initialized = false;

        resetTransientState();

        await renderAuth();

        showToast("Successfully logged out.", "success");
      } catch (error) {
        handleError(error, "Logout");
        logoutButton.disabled = false;
      }
    });
  }
}

async function renderPage() {
  if (!state.client) {
    showErrorPage(
      "Connection unavailable",
      "Supabase connection initialize nahi hui."
    );
    return;
  }

  if (!state.user) {
    await renderAuth();
    return;
  }

  const container = $("#page-content");

  if (!container) {
    console.error("Page content container is missing.");
    return;
  }

  try {
    switch (state.currentPage) {
      case "home":
        if (typeof renderHome === "function") {
          await renderHome();
        } else {
          renderComingSoon("Home");
        }
        break;

      case "explore":
        if (typeof renderExplore === "function") {
          await renderExplore();
        } else {
          renderComingSoon("Explore");
        }
        break;

      case "create":
        if (typeof renderCreatePost === "function") {
          await renderCreatePost();
        } else {
          renderComingSoon("Create Post");
        }
        break;

      case "reels":
        if (typeof renderReels === "function") {
          await renderReels();
        } else {
          renderComingSoon("Reels");
        }
        break;

      case "notifications":
        if (typeof renderNotifications === "function") {
          await renderNotifications();
        } else {
          renderComingSoon("Notifications");
        }
        break;

      case "messages":
        if (typeof renderMessages === "function") {
          await renderMessages();
        } else {
          renderComingSoon("Messages");
        }
        break;

      case "profile":
        if (typeof renderProfile === "function") {
          await renderProfile(state.user.id);
        } else {
          renderComingSoon("Profile");
        }
        break;

      case "saved":
        if (typeof renderSavedPosts === "function") {
          await renderSavedPosts();
        } else {
          renderComingSoon("Saved Posts");
        }
        break;

      case "settings":
        if (typeof renderSettings === "function") {
          await renderSettings();
        } else {
          renderComingSoon("Settings");
        }
        break;

      case "editProfile":
        if (typeof renderEditProfile === "function") {
          await renderEditProfile();
        } else {
          renderComingSoon("Edit Profile");
        }
        break;

      case "followers":
        if (typeof renderFollowers === "function") {
          await renderFollowers();
        } else {
          renderComingSoon("Followers");
        }
        break;

      case "following":
        if (typeof renderFollowing === "function") {
          await renderFollowing();
        } else {
          renderComingSoon("Following");
        }
        break;

      default:
        state.currentPage = "home";
        await renderHome();
        break;
    }
  } catch (error) {
    handleError(error, "Page rendering");

    container.innerHTML = `
      <section class="empty-state">
        <div class="empty-state-icon">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <h3>This page couldn't load</h3>

          type="button"
        >
          <i class="fa-solid fa-rotate-right"></i>
          Try again
        </button>
      </section>
    `;

    const retryButton = $("#page-retry", container);

    if (retryButton) {
      retryButton.addEventListener("click", renderPage);
    }
  }
}

<script>
const FEED_PAGE_SIZE = 10;

function getPostId(post) {
  return String(post?.id ?? "");
}

function getPostAuthorId(post) {
  return String(post?.user_id ?? post?.author_id ?? "");
}

function getPostCaption(post) {
  return String(
    post?.caption ??
    post?.content ??
    post?.text ??
    ""
  );
}

function getPostMediaURL(post) {
  return safeURL(
    post?.media_url ??
    post?.image_url ??
    post?.video_url ??
    post?.url ??
    ""
  );
}

function getPostMediaType(post) {
  const explicitType = String(
    post?.media_type ??
    post?.type ??
    ""
  ).toLowerCase();

  if (explicitType.includes("video")) {
    return "video";
  }

  if (explicitType.includes("image") || explicitType.includes("photo")) {
    return "image";
  }

  const url = getPostMediaURL(post).toLowerCase();

  if (/\.(mp4|webm|mov|m4v)(\?.*)?$/.test(url)) {
    return "video";
  }

  if (/\.(jpg|jpeg|png|gif|webp|avif)(\?.*)?$/.test(url)) {
    return "image";
  }

  return post?.video_url ? "video" : "image";
}

function getPostLikeCount(post) {
  const value = Number(
    post?.likes_count ??
    post?.like_count ??
    post?.likes ??
    0
  );

  return Number.isFinite(value) ? Math.max(0, value) : 0;
}

function getPostCommentCount(post) {
  const value = Number(
    post?.comments_count ??
    post?.comment_count ??
    0
  );

  return Number.isFinite(value) ? Math.max(0, value) : 0;
}

function getPostAuthor(post) {
  const authorId = getPostAuthorId(post);

  if (
    post?.profiles &&
    !Array.isArray(post.profiles)
  ) {
    return post.profiles;
  }

  if (Array.isArray(post?.profiles) && post.profiles.length) {
    return post.profiles[0];
  }

  if (post?.author && typeof post.author === "object") {
    return post.author;
  }

  if (state.profile && String(state.profile.id) === authorId) {
    return state.profile;
  }

  return state.profiles.find(profile =>
    String(profile.id) === authorId
  ) || {
    id: authorId,
    username: "user",
    display_name: "Gromazeef User"
  };
}

function getPostCreatedAt(post) {
  return post?.created_at || post?.inserted_at || null;
}

function getRelativePostTime(value) {
  if (!value) {
    return "Recently";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "Recently";
  }

  const seconds = Math.max(
    0,
    Math.floor((Date.now() - date.getTime()) / 1000)
  );

  if (seconds < 60) {
    return "Just now";
  }

  if (seconds < 3600) {
    return `${Math.floor(seconds / 60)}m ago`;
  }

  if (seconds < 86400) {
    return `${Math.floor(seconds / 3600)}h ago`;
  }

  if (seconds < 604800) {
    return `${Math.floor(seconds / 86400)}d ago`;
  }

  return date.toLocaleDateString();
}

function hasLikedPost(postId) {
  const id = String(postId);

  return state.likes.some(item =>
    String(item.post_id) === id &&
    String(item.user_id) === String(state.user?.id)
  );
}

function hasSavedPost(postId) {
  const id = String(postId);

  return state.savedPosts.some(item =>
    String(item.post_id) === id &&
    String(item.user_id) === String(state.user?.id)
  );
}

function renderPostMedia(post) {
  const url = getPostMediaURL(post);

  if (!url) {
    return "";
  }

  const safe = escapeHTML(url);
  const type = getPostMediaType(post);

  if (type === "video") {
    return `
      <video
        class="post-media-video"
        controls
        playsinline
        preload="metadata"
      >
        <source src="${safe}">
        Your browser does not support video playback.
      </video>
    `;
  }

  return `
    <img
      class="post-media"
      src="${safe}"
      alt="Post media"
      loading="lazy"
      onerror="this.style.display='none'"
    >
  `;
}

function renderPostCard(post) {

        <button

      ${caption ? `<div class="post-caption">${caption}</div>` : ""}

        </button>

        <button

        >

        </div>

}

async function loadFeedPosts(reset = true) {
  if (!state.client || !state.user) {
    return [];
  }

  if (reset) {
    state.feed = [];
    state.feedOffset = 0;
    state.feedHasMore = true;
  }

  if (!state.feedHasMore && !reset) {
    return state.feed;
  }

  const from = Number(state.feedOffset || 0);
  const to = from + FEED_PAGE_SIZE - 1;

  let query = state.client
    .from("posts")
    .select("*")
    .order("created_at", { ascending: false })
    .range(from, to);

  const { data, error } = await query;

  if (error) {
    throw error;
  }

  const newPosts = Array.isArray(data) ? data : [];

  const existingIds = new Set(
    state.feed.map(post => String(post.id))
  );

  const uniquePosts = newPosts.filter(post =>
    !existingIds.has(String(post.id))
  );

  state.feed = reset
    ? newPosts
    : [...state.feed, ...uniquePosts];

  state.posts = state.feed;

  state.feedOffset = from + newPosts.length;
  state.feedHasMore = newPosts.length === FEED_PAGE_SIZE;

  await loadFeedProfiles(state.feed);

  await loadFeedLikeState(state.feed);

  return state.feed;
}

async function loadFeedProfiles(posts) {
  if (!state.client || !Array.isArray(posts) || !posts.length) {
    return;
  }

  const ids = [
    ...new Set(
      posts
        .map(getPostAuthorId)
        .filter(Boolean)
    )
  ];

  if (!ids.length) {
    return;
  }

  const missingIds = ids.filter(id =>
    String(id) !== String(state.user?.id) &&
    !state.profiles.some(profile =>
      String(profile.id) === String(id)
    )
  );

  if (!missingIds.length) {
    return;
  }

  const { data, error } = await state.client
    .from("profiles")
    .select("*")
    .in("id", missingIds);

  if (error) {
    console.warn("Profile lookup:", error.message);
    return;
  }

  state.profiles = [
    ...state.profiles,
    ...(data || [])
  ];
}

async function loadFeedLikeState(posts) {
  if (!state.client || !state.user || !posts.length) {
    return;
  }

  const ids = posts.map(getPostId).filter(Boolean);

  if (!ids.length) {
    return;
  }

  const { data, error } = await state.client
    .from("likes")
    .select("post_id,user_id")
    .eq("user_id", state.user.id)
    .in("post_id", ids);

  if (error) {
    console.warn("Like lookup:", error.message);
    return;
  }

  const unrelatedLikes = state.likes.filter(item =>
    !ids.includes(String(item.post_id))
  );

  state.likes = [
    ...unrelatedLikes,
    ...(data || [])
  ];
}

        hidden
      >
        Load more posts
      </button>
    </div>
  `;

  const list = $("#feed-post-list");

  try {
    const posts = await loadFeedPosts(true);

    if (!list) {
      return;
    }

    if (!posts.length) {
      list.innerHTML = `
        <section class="empty-state">
          <div class="empty-state-icon">
            <i class="fa-regular fa-images"></i>
          </div>

          <h3>Your feed is waiting</h3>

          <p>
            Abhi koi post nahi hai. Pehli post create karo
            ya baad mein dobara check karo.
          </p>

          <button
            class="primary-btn"
            type="button"
            data-page="create"
          >
            <i class="fa-solid fa-plus"></i>
            Create your first post
          </button>
        </section>
      `;
    } else {
      list.innerHTML = posts
        .map(renderPostCard)
        .join("");
    }

    const moreButton = $("#load-more-posts");

    if (moreButton) {
      moreButton.hidden = !state.feedHasMore;
    }

    attachFeedEvents();
  } catch (error) {
    if (list) {
      list.innerHTML = `
        <section class="empty-state">
          <div class="empty-state-icon">
            <i class="fa-solid fa-triangle-exclamation"></i>
          </div>

          <h3>Feed load nahi hui</h3>

          <p>${escapeHTML(getDatabaseErrorMessage(error))}</p>

          <button
            id="retry-feed"
            class="secondary-btn"
            type="button"
          >
            <i class="fa-solid fa-rotate-right"></i>
            Try again
          </button>
        </section>
      `;

      $("#retry-feed")?.addEventListener("click", renderHome);
    }

    console.error("Feed loading failed:", error);
  }

  $("#refresh-feed")?.addEventListener("click", async event => {
    const button = event.currentTarget;

    button.disabled = true;

    try {
      await renderHome();
    } finally {
      button.disabled = false;
    }
  });

  $("#load-more-posts")?.addEventListener("click", async event => {
    const button = event.currentTarget;

    button.disabled = true;
    button.textContent = "Loading...";

    try {
      const posts = await loadFeedPosts(false);

      if (posts.length) {
        const currentList = $("#feed-post-list");

        if (currentList) {
          currentList.innerHTML = posts
             .map(renderPostCard)
            .join("");
        }

        attachFeedEvents();
      }

      button.hidden = !state.feedHasMore;
    } catch (error) {
      handleError(error, "Load more posts");
      button.textContent = "Try again";
    } finally {
      button.disabled = false;

      if (!button.hidden && button.textContent === "Loading...") {
        button.textContent = "Load more posts";
      }
    }
  });
}

function attachFeedEvents() {
  const container = $("#page-content");

  if (!container) return;

  container.querySelectorAll("[data-like-post]").forEach(button => {
    button.addEventListener("click", async () => {
      await togglePostLike(button.dataset.likePost, button);
    });
  });

  container.querySelectorAll("[data-save-post]").forEach(button => {
    button.addEventListener("click", async () => {
      await toggleSavePost(button.dataset.savePost, button);
    });
  });

  container.querySelectorAll("[data-toggle-comments]").forEach(button => {
    button.addEventListener("click", async () => {
      const postId = button.dataset.toggleComments;
      const section = $(`#comments-${CSS.escape(postId)}`);

      if (!section) return;

      section.hidden = !section.hidden;

      if (!section.hidden) {
        await loadPostComments(postId);
        section.querySelector("input")?.focus();
      }
    });
  });

  container.querySelectorAll("[data-comment-form]").forEach(form => {
    form.addEventListener("submit", async event => {
      event.preventDefault();

      const postId = form.dataset.commentForm;
      const input = form.querySelector('input[name="comment"]');
      const submitButton = form.querySelector('button[type="submit"]');
      const comment = input?.value.trim();

      if (!comment) return;

      submitButton.disabled = true;

      try {
        const { error } = await state.client
          .from("comments")
          .insert({
            post_id: postId,
            user_id: state.user.id,
            content: comment
          });

        if (error) throw error;

        input.value = "";
        showToast("Comment added.", "success");

        await loadPostComments(postId);
        await refreshPostCommentCount(postId);
      } catch (error) {
        handleError(error, "Add comment");
      } finally {
        submitButton.disabled = false;
      }
    });
  });

  container.querySelectorAll("[data-delete-post]").forEach(button => {
    button.addEventListener("click", async () => {
      await deletePost(button.dataset.deletePost);
    });
  });

  container.querySelectorAll("[data-post-menu]").forEach(button => {
    button.addEventListener("click", async () => {
      const postId = button.dataset.postMenu;
      const post = state.feed.find(item =>
        String(item.id) === String(postId)
      );

      if (!post) return;

      if (String(getPostAuthorId(post)) === String(state.user.id)) {
        await deletePost(postId);
      } else {
        showToast("Post options will be available here.");
      }
    });
  });

  container.querySelectorAll("[data-open-profile]").forEach(button => {
    button.addEventListener("click", async () => {
      state.viewingProfileId = button.dataset.openProfile;
      state.previousPage = state.currentPage;
      state.currentPage = "profile";

      await renderPage();
    });
  });

  container.querySelectorAll("[data-page]").forEach(button => {
    button.addEventListener("click", async event => {
      event.preventDefault();

      const page = button.dataset.page;
      if (!page || !state.user) return;

      state.previousPage = state.currentPage;
      state.currentPage = page;

      await renderShell();
      await renderPage();
    });
  });
}

async function togglePostLike(postId, button) {
  if (!state.user || !state.client) return;

  const id = String(postId);
  const post = state.feed.find(item => String(item.id) === id);

  if (!post) return;

  button.disabled = true;

  const alreadyLiked = hasLikedPost(id);
  const originalCount = getPostLikeCount(post);

  try {
    if (alreadyLiked) {
      const { error } = await state.client
        .from("likes")
        .delete()
        .eq("post_id", id)
        .eq("user_id", state.user.id);

      if (error) throw error;

      state.likes = state.likes.filter(item =>
        !(String(item.post_id) === id &&
          String(item.user_id) === String(state.user.id))
      );

      post.likes_count = Math.max(0, originalCount - 1);
    } else {
      const { error } = await state.client
        .from("likes")
        .insert({
          post_id: id,
          user_id: state.user.id
        });

      if (error) throw error;

      state.likes.push({
        post_id: id,
        user_id: state.user.id
      });

      post.likes_count = originalCount + 1;
    }

    const card = button.closest(".post-card");
    const count = card?.querySelector(
      `[data-like-count="${CSS.escape(id)}"]`
    );

    if (count) {
      count.textContent = `${formatCount(post.likes_count)} likes`;
    }

    const liked = !alreadyLiked;

    button.classList.toggle("liked", liked);
    button.setAttribute("aria-pressed", String(liked));

    const icon = button.querySelector("i");

    if (icon) {
      icon.className = `${liked ? "fa-solid" : "fa-regular"} fa-heart`;
    }
  } catch (error) {
    handleError(error, "Like post");
  } finally {
    button.disabled = false;
  }
}

async function toggleSavePost(postId, button) {
  if (!state.user || !state.client) return;

  const id = String(postId);
  const alreadySaved = hasSavedPost(id);

  button.disabled = true;

  try {
    if (alreadySaved) {
      const { error } = await state.client
        .from("saved_posts")
        .delete()
        .eq("post_id", id)
        .eq("user_id", state.user.id);

      if (error) throw error;

      state.savedPosts = state.savedPosts.filter(item =>
        !(String(item.post_id) === id &&
          String(item.user_id) === String(state.user.id))
      );
    } else {
      const { error } = await state.client
        .from("saved_posts")
        .insert({
          post_id: id,
          user_id: state.user.id
        });

      if (error) throw error;

      state.savedPosts.push({
        post_id: id,
        user_id: state.user.id
      });
    }

    const saved = !alreadySaved;

    button.classList.toggle("saved", saved);
    button.setAttribute("aria-pressed", String(saved));

    const icon = button.querySelector("i");
    const label = button.querySelector("span");

    if (icon) {
      icon.className = `${saved ? "fa-solid" : "fa-regular"} fa-bookmark`;
    }

    if (label) {
      label.textContent = saved ? "Saved" : "Save";
    }

    showToast(saved ? "Post saved." : "Post unsaved.", "success");
  } catch (error) {
    handleError(error, "Save post");
  } finally {
    button.disabled = false;
  }
}

async function loadPostComments(postId) {
  const list = $(
    `[data-comments-list="${CSS.escape(String(postId))}"]`
  );

  if (!list || !state.client) return;

  list.innerHTML = "Loading comments...";

  try {
    const { data, error } = await state.client
      .from("comments")
      .select("*")
      .eq("post_id", postId)
      .order("created_at", { ascending: true })
      .limit(100);

    if (error) throw error;

    const comments = data || [];

    if (!comments.length) {
      list.innerHTML = `
        <span class="muted small-text">
          No comments yet. Be the first to comment.
        </span>
      `;
      return;
    }

    const userIds = [...new Set(
      comments.map(comment => String(comment.user_id))
    )];

    const { data: profiles, error: profileError } = await state.client
      .from("profiles")
      .select("id,username,display_name,avatar_url")
      .in("id", userIds);

    if (profileError) throw profileError;

    const profileMap = new Map(
      (profiles || []).map(profile => [String(profile.id), profile])
    );

    list.innerHTML = comments.map(comment => {
      const profile = profileMap.get(String(comment.user_id)) || {};
      const name = escapeHTML(
        profile.display_name || profile.username || "User"
      );

      const avatar = safeURL(profile.avatar_url || DEFAULT_AVATAR);

      return `
        <div class="comment-row">
          <img
            class="avatar avatar-small"
            src="${escapeHTML(avatar)}"
            alt=""
            onerror="this.onerror=null;this.src='${DEFAULT_AVATAR}'"
          >
          <div class="comment-content">
            <div class="comment-author">${name}</div>
            <div class="comment-text">${escapeHTML(
              comment.content || comment.text || ""
            )}</div>
          </div>
        </div>
      `;
    }).join("");
  } catch (error) {
    list.innerHTML = `
      <span class="muted small-text">
        Comments load nahi hue. Dobara try karo.
      </span>
    `;

    console.error("Comments:", error);
  }
}

async function refreshPostCommentCount(postId) {
  const { count, error } = await state.client
    .from("comments")
    .select("id", { count: "exact", head: true })
    .eq("post_id", postId);

  if (error) {
    console.warn(error.message);
    return;
  }

  const post = state.feed.find(item =>
    String(item.id) === String(postId)
  );

  if (post) {
    post.comments_count = count || 0;
  }

  const card = document.querySelector(
    `.post-card[data-post-id="${CSS.escape(String(postId))}"]`
  );

  const button = card?.querySelector(
    `[data-toggle-comments="${CSS.escape(String(postId))}"]`
  );

  if (button) {
    button.textContent = `${formatCount(count || 0)} comments`;
  }
}

async function deletePost(postId) {
  if (!state.user || !state.client) return;

  const post = state.feed.find(item =>
    String(item.id) === String(postId)
  );

  if (!post || String(getPostAuthorId(post)) !== String(state.user.id)) {
    showToast("Sirf apni post delete kar sakte ho.");
    return;
  }

  if (!window.confirm("Kya tum ye post delete karna chahte ho?")) {
    return;
  }

  try {
    const { error } = await state.client
      .from("posts")
      .delete()
      .eq("id", postId)
      .eq("user_id", state.user.id);

    if (error) throw error;

    state.feed = state.feed.filter(item =>
      String(item.id) !== String(postId)
    );

    state.posts = state.feed;

    showToast("Post deleted.", "success");
    await renderHome();
  } catch (error) {
    handleError(error, "Delete post");
  }
}

<script>
let createPostPreviewURL = null;

function getProfileById(userId) {
  const id = String(userId || "");

  if (String(state.profile?.id) === id) {
    return state.profile;
  }

  return state.profiles.find(profile =>
    String(profile.id) === id
  ) || null;
}

async function fetchProfileById(userId) {
  if (!state.client || !userId) {
    return null;
  }

  const cached = getProfileById(userId);

  if (cached) {
    return cached;
  }

  const { data, error } = await state.client
    .from("profiles")
    .select("*")
    .eq("id", userId)
    .maybeSingle();

  if (error) {
    throw error;
  }

  if (data) {
    state.profiles.push(data);
  }

  return data;
}

async function renderCreatePost() {
  const container = $("#page-content");

  if (!container) return;

  container.innerHTML = `
    <div class="feed-container">
      <div class="page-heading-row">
        <div>
          <h1 class="page-heading">Create Post</h1>
          <p class="page-description">
            Share a moment with your community.
          </p>
        </div>
      </div>

      <section class="create-post-card">
        <form id="create-post-form" class="create-post-form">

          <label>
            Caption
            <textarea
              id="new-post-caption"
              maxlength="5000"
              placeholder="What's on your mind?"
            ></textarea>
          </label>

          <label class="upload-dropzone" for="new-post-file">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <strong>Select a photo or video</strong>
            <span>Choose a file from your device.</span>
            <span>Maximum size: 100 MB</span>
          </label>

          <input
            id="new-post-file"
            type="file"
            accept="image/*,video/mp4,video/webm,video/quicktime"
            hidden
          >

          <div id="new-post-preview-container" hidden>
            <img
              id="new-post-image-preview"
              class="upload-preview"
              alt="Selected media preview"
              hidden
            >

            <video
              id="new-post-video-preview"
              class="upload-preview"
              controls
              playsinline
              hidden
            ></video>

            <button
              id="remove-post-media"
              class="secondary-btn"
              type="button"
            >
              <i class="fa-solid fa-xmark"></i>
              Remove media
            </button>
          </div>

          <p class="muted small-text">
            Photo/video upload ke liye Supabase Storage mein
            public <code>post-media</code> bucket aur sahi upload policies
            configured honi chahiye.
          </p>

          <button
            id="publish-post-btn"
            class="primary-btn"
            type="submit"
          >
            <i class="fa-solid fa-paper-plane"></i>
            Publish Post
          </button>

        </form>
      </section>
    </div>
  `;

  const form = $("#create-post-form");
  const fileInput = $("#new-post-file");
  const previewContainer = $("#new-post-preview-container");
  const imagePreview = $("#new-post-image-preview");
  const videoPreview = $("#new-post-video-preview");

  function clearPreview() {
    if (createPostPreviewURL) {
      URL.revokeObjectURL(createPostPreviewURL);
      createPostPreviewURL = null;
    }

    fileInput.value = "";
    previewContainer.hidden = true;
    imagePreview.hidden = true;
    videoPreview.hidden = true;
    imagePreview.removeAttribute("src");
    videoPreview.removeAttribute("src");
    videoPreview.load();
  }

  fileInput.addEventListener("change", () => {
    clearPreview();

    const file = fileInput.files?.[0];

    if (!file) return;

    if (file.size > 100 * 1024 * 1024) {
      showToast("File 100 MB se chhoti honi chahiye.");
      fileInput.value = "";
      return;
    }

    if (
      !file.type.startsWith("image/") &&
      !file.type.startsWith("video/")
    ) {
      showToast("Sirf image ya video select karo.");
      fileInput.value = "";
      return;
    }

    createPostPreviewURL = URL.createObjectURL(file);

    previewContainer.hidden = false;

    if (file.type.startsWith("video/")) {
      videoPreview.src = createPostPreviewURL;
      videoPreview.hidden = false;
      imagePreview.hidden = true;
    } else {
      imagePreview.src = createPostPreviewURL;
      imagePreview.hidden = false;
      videoPreview.hidden = true;
    }
  });

  $("#remove-post-media").addEventListener("click", clearPreview);

  form.addEventListener("submit", async event => {
    event.preventDefault();

    const button = $("#publish-post-btn");
    const caption = $("#new-post-caption").value.trim();
    const file = fileInput.files?.[0];

    if (!caption && !file) {
      showToast("Caption ya photo/video add karo.");
      return;
    }

    if (file && file.size > 100 * 1024 * 1024) {
      showToast("File 100 MB se chhoti honi chahiye.");
      return;
    }

    button.disabled = true;
    button.innerHTML = `
      <i class="fa-solid fa-spinner fa-spin"></i>
      Publishing...
    `;

    try {
      let mediaURL = null;
      let mediaType = null;

      if (file) {
        const extension = (
          file.name.split(".").pop() || "bin"
        ).toLowerCase().replace(/[^a-z0-9]/g, "");

        const safeExtension = extension || "bin";

        const storagePath =
          `${state.user.id}/${Date.now()}-${crypto.randomUUID()}.${safeExtension}`;

        const { error: uploadError } = await state.client
          .storage
          .from("post-media")
          .upload(storagePath, file, {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type
          });

        if (uploadError) {
          throw new Error(
            "Media upload failed. Supabase ka post-media bucket aur upload policy check karo. " +
            uploadError.message
          );
        }

        const { data } = state.client
          .storage
          .from("post-media")
          .getPublicUrl(storagePath);

        mediaURL = data?.publicUrl || null;
        mediaType = file.type.startsWith("video/")
          ? "video"
          : "image";

        if (!mediaURL) {
          throw new Error("Uploaded media ka URL nahi mila.");
        }
      }

      const postData = {
        user_id: state.user.id,
        caption: caption,
        media_url: mediaURL,
        media_type: mediaType
      };

      const { error: insertError } = await state.client
        .from("posts")
        .insert(postData);

      if (insertError) {
        throw insertError;
      }

      if (createPostPreviewURL) {
        URL.revokeObjectURL(createPostPreviewURL);
        createPostPreviewURL = null;
      }

      state.currentPage = "home";
      showToast("Post published successfully!", "success");

      await renderShell();
      await renderPage();
    } catch (error) {
      handleError(error, "Publish post");

      button.disabled = false;
      button.innerHTML = `
        <i class="fa-solid fa-paper-plane"></i>
        Publish Post
      `;
    }
  });
}

async function renderProfile(userId = null) {
  const container = $("#page-content");

  if (!container || !state.user) return;

  const targetId = String(
    userId ||
    state.viewingProfileId ||
    state.user.id
  );

  container.innerHTML = `
    <div class="feed-container">
      <div class="loading">
        <div class="spinner"></div>
        <span>Loading profile...</span>
      </div>
    </div>
  `;

  try {
    const profile = await fetchProfileById(targetId);

    if (!profile) {
      container.innerHTML = `
        <section class="empty-state">
          <h3>Profile not found</h3>
          <p>Ye profile available nahi hai.</p>
        </section>
      `;
      return;
    }

    const isOwn = String(state.user.id) === targetId;

    const avatar = safeURL(
      profile.avatar_url ||
      profile.avatar ||
      DEFAULT_AVATAR
    );

    const cover = safeURL(
      profile.cover_url ||
      profile.cover_image ||
      ""
    );

    const name = escapeHTML(
      profile.display_name ||
      profile.full_name ||
      profile.username ||
      "Gromazeef User"
    );

    const username = escapeHTML(profile.username || "user");
    const bio = escapeHTML(profile.bio || "");

    const { data: posts, error: postsError } = await state.client
      .from("posts")
      .select("*")
      .eq("user_id", targetId)
      .order("created_at", { ascending: false })
      .limit(60);

    if (postsError) throw postsError;

    const { count: followersCount, error: followersError } =
      await state.client
        .from("follows")
        .select("id", { count: "exact", head: true })
        .eq("following_id", targetId);

    if (followersError) {
      console.warn("Followers count:", followersError.message);
    }

    const { count: followingCount, error: followingError } =
      await state.client
        .from("follows")
        .select("id", { count: "exact", head: true })
        .eq("follower_id", targetId);

    if (followingError) {
      console.warn("Following count:", followingError.message);
    }

    const { data: followRow, error: followError } = isOwn
      ? { data: null, error: null }
      : await state.client
          .from("follows")
          .select("id")
          .eq("follower_id", state.user.id)
          .eq("following_id", targetId)
          .maybeSingle();

    if (followError) {
      console.warn("Follow status:", followError.message);
    }

    container.innerHTML = `
      <div class="feed-container">

        <section class="profile-card">
          <div class="profile-cover">
            ${cover ? `
              <img
                src="${escapeHTML(cover)}"
                alt="Profile cover"
                onerror="this.style.display='none'"
              >
            ` : ""}
          </div>

          <div class="profile-header">
            <img
              class="avatar"
              src="${escapeHTML(avatar)}"
              alt=""
              onerror="this.onerror=null;this.src='${DEFAULT_AVATAR}'"
            >

            <div style="margin-left:auto">
              ${isOwn ? `
                <button
                  class="secondary-btn"
                  id="edit-profile-button"
                  type="button"
                >
                  <i class="fa-solid fa-pen"></i>
                  Edit profile
                </button>
              ` : `
                <button
                  class="primary-btn"
                  id="follow-profile-button"
                  type="button"
                >
                  <i class="fa-solid fa-user-plus"></i>
                  ${followRow ? "Following" : "Follow"}
                </button>
              `}
            </div>
          </div>

          <div class="profile-details">
            <div class="profile-name">${name}</div>
            <div class="profile-username">@${username}</div>

            ${bio ? `<div class="profile-bio">${bio}</div>` : ""}

            <div class="profile-stats">
              <div class="profile-stat">
                <strong>${formatCount(posts?.length || 0)}</strong>
                <span>Posts</span>
              </div>

              <button class="text-button profile-stat" id="profile-followers">
                <strong>${formatCount(followersCount || 0)}</strong>
                <span>Followers</span>
              </button>

              <button class="text-button profile-stat" id="profile-following">
                <strong>${formatCount(followingCount || 0)}</strong>
                <span>Following</span>
              </button>
            </div>
          </div>
        </section>

        <h2 class="page-heading" style="margin:20px 0">
          Posts
        </h2>

        <div class="profile-post-grid">
          ${(posts || []).map(post => {
            const mediaURL = safeURL(
              post.media_url ||
              post.image_url ||
              post.video_url ||
              ""
            );

            if (!mediaURL) return "";

            if (getPostMediaType(post) === "video") {
              return `
                <video
                  src="${escapeHTML(mediaURL)}"
                  controls
                  preload="metadata"
                  playsinline
                ></video>
              `;
            }

            return `
              <img
                src="${escapeHTML(mediaURL)}"
                alt="Post"
                loading="lazy"
              >
            `;
          }).join("")}
        </div>

        ${!(posts || []).length ? `
          <section class="empty-state">
            <h3>No posts yet</h3>
            <p>Jab posts publish hongi, yahan dikhengi.</p>
          </section>
        ` : ""}
      </div>
    `;

    $("#edit-profile-button")?.addEventListener("click", async () => {
      state.currentPage = "editProfile";
      await renderPage();
    });

    $("#follow-profile-button")?.addEventListener("click", async event => {
      await toggleFollow(targetId, event.currentTarget);
    });

    $("#profile-followers")?.addEventListener("click", async () => {
      state.viewingProfileId = targetId;
      state.currentPage = "followers";
      await renderPage();
    });

    $("#profile-following")?.addEventListener("click", async () => {
      state.viewingProfileId = targetId;
      state.currentPage = "following";
      await renderPage();
    });

  } catch (error) {
    handleError(error, "Load profile");

    container.innerHTML = `
      <section class="empty-state">
        <h3>Profile load nahi hui</h3>
        <p>${escapeHTML(getDatabaseErrorMessage(error))}</p>
      </section>
    `;
  }
}

async function toggleFollow(targetId, button) {
  if (!state.user || !state.client) return;

  if (String(targetId) === String(state.user.id)) {
    showToast("Apne aap ko follow nahi kar sakte.");
    return;
  }

  button.disabled = true;

  try {
    const { data: existing, error: lookupError } = await state.client
      .from("follows")
      .select("id")
      .eq("follower_id", state.user.id)
      .eq("following_id", targetId)
      .maybeSingle();

    if (lookupError) throw lookupError;

    if (existing) {
      const { error } = await state.client
        .from("follows")
        .delete()
        .eq("id", existing.id);

      if (error) throw error;

      showToast("Unfollowed.", "success");
    } else {
      const { error } = await state.client
        .from("follows")
        .insert({
          follower_id: state.user.id,
          following_id: targetId
        });

      if (error) throw error;

      showToast("Following successfully.", "success");
    }

    await renderProfile(targetId);
  } catch (error) {
    handleError(error, "Follow user");
  } finally {
    button.disabled = false;
  }
}

async function renderExplore() {
  const container = $("#page-content");

  if (!container || !state.client) return;

  const query = String(state.searchQuery || "").trim();

  container.innerHTML = `
    <div class="feed-container">
      <div class="page-heading-row">
        <div>
          <h1 class="page-heading">Explore</h1>
          <p class="page-description">
            Discover people on Gromazeef.
          </p>
        </div>
      </div>

      <section class="explore-card">
        <form id="explore-search-form" class="comment-form">
          <input
            id="explore-search-input"
            type="search"
            placeholder="Search by username or name..."
            value="${escapeHTML(query)}"
            aria-label="Search profiles"
          >
          <button type="submit" aria-label="Search">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </form>
      </section>

      <div id="explore-results" class="people-list">
        <div class="loading">
          <div class="spinner"></div>
          <span>Finding people...</span>
        </div>
      </div>
    </div>
  `;

  $("#explore-search-form").addEventListener("submit", async event => {
    event.preventDefault();

    state.searchQuery = $("#explore-search-input").value.trim();

    await renderExplore();
  });

  const results = $("#explore-results");

  try {
    let request = state.client
      .from("profiles")
      .select("id,username,display_name,avatar_url,bio")
      .neq("id", state.user.id)
      .limit(50);

    if (query) {
      const escapedQuery = query.replace(/[%_(),]/g, "");

      request = request.or(
        `username.ilike.%${escapedQuery}%,display_name.ilike.%${escapedQuery}%`
      );
    }

    const { data, error } = await request;

    if (error) throw error;

    state.profiles = [
      ...state.profiles.filter(
        (profile) => !data.some((item) => item.id === profile.id)
      ),
      ...(data || [])
    ];

    return state.profiles;
  } catch (error) {
    console.error("Profile search error:", error);
    showToast("Profiles load nahi ho paaye.", "error");
    return [];
  }
}

<script>
async function renderEditProfile() {
  if (!state.user) {
    renderAuth();
    return;
  }

  const profile = state.profile || {};

  setAppContent(`
    <section class="page">
      <h2>Edit Profile</h2>
      <form id="edit-profile-form" class="settings-form">
        <label>
          Username
          <input id="edit-username" maxlength="30"
            value="${escapeHTML(profile.username || "")}" required>
        </label>
        <label>
          Display Name
          <input id="edit-display-name" maxlength="60"
            value="${escapeHTML(profile.display_name || "")}">
        </label>
        <label>
          Bio
          <textarea id="edit-bio" maxlength="160"
            placeholder="Apne baare mein likho...">${escapeHTML(profile.bio || "")}</textarea>
        </label>
        <button class="btn btn-primary" type="submit">
          Save Changes
        </button>
      </form>
    </section>
  `);

  $("#edit-profile-form").addEventListener("submit", async event => {
    event.preventDefault();

    const username = normalizeUsername($("#edit-username").value);
    const displayName = $("#edit-display-name").value.trim();
    const bio = $("#edit-bio").value.trim();

    if (!validateUsername(username)) {
      showToast("Username sahi format mein likho.", "error");
      return;
    }

    const button = event.submitter;
    setLoading(button, true);

    try {
      const { data: existing, error: checkError } = await state.client
        .from("profiles")
        .select("id")
        .eq("username", username)
        .neq("id", state.user.id)
        .limit(1);

      if (checkError) throw checkError;

      if (existing?.length) {
        showToast("Ye username pehle se use ho raha hai.", "error");
        return;
      }

      const { data, error } = await state.client
        .from("profiles")
        .update({
          username,
          display_name: displayName,
          bio
        })
        .eq("id", state.user.id)
        .select()
        .single();

      if (error) throw error;

      state.profile = data;
      showToast("Profile update ho gayi!");
      await renderShell();
      await renderPage();

    } catch (error) {
      console.error("Profile update error:", error);
      showToast(getDatabaseErrorMessage(error), "error");
    } finally {
      setLoading(button, false);
    }
  });
}

async function renderSettings() {
  if (!state.user) {
    renderAuth();
    return;
  }

  setAppContent(`
    <section class="page">
      <h2>Settings</h2>
      <div class="settings-form">
        <button class="btn btn-primary" id="settings-edit-profile">
          Edit Profile
        </button>
        <button class="btn btn-secondary" id="settings-signout">
          Log Out
        </button>

  $("#settings-edit-profile").addEventListener("click", renderEditProfile);

  $("#settings-signout").addEventListener("click", async () => {
    const button = $("#settings-signout");

    try {
      const { error } = await state.client.auth.signOut();
      if (error) throw error;
    } catch (error) {
      console.error("Sign out error:", error);
      showToast("Log out nahi ho paya.", "error");
    } finally {
      setLoading(button, false);
    }
  });
}
</script>
<script>
async function startGromazeef() {
  try {
    state.client = createClient();

    if (!state.client) {
      throw new Error("Supabase client create nahi hua.");
    }

    const { data, error } = await state.client.auth.getSession();

    if (error) throw error;

    state.user = data.session?.user || null;

    if (state.user) {
      await ensureProfile();
    }

    await renderShell();
    await renderPage();

    state.client.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_IN" || event === "SIGNED_OUT") {
        setTimeout(async () => {
          try {
            state.user = session?.user || null;
            state.profile = null;

            if (state.user) {
              await ensureProfile();
            }

            await renderShell();
            await renderPage();
          } catch (error) {
            console.error("Authentication update error:", error);
            showToast("Account load karne mein dikkat hui.", "error");
          }
        }, 0);
      }
    });

    console.log("Gromazeef successfully started!");

  } catch (error) {
    console.error("Gromazeef startup error:", error);

    showErrorPage(
      "Gromazeef start nahi ho paaya. Supabase URL aur public key check karo."
    );
  }
}

document.addEventListener("DOMContentLoaded", startGromazeef);
</script>
