<!-- PART 1/7 — GROMAZEEF -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b12">
<meta name="description" content="Gromazeef — Your people. Your universe.">
<title>Gromazeef</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0b0b12;
  --surface:#12121c;
  --surface2:#191926;
  --surface3:#222232;
  --border:#29293b;
  --text:#f5f5ff;
  --muted:#9696ad;
  --primary:#8b5cf6;
  --primary2:#a78bfa;
  --pink:#ec4899;
  --blue:#38bdf8;
  --green:#34d399;
  --red:#fb7185;
  --yellow:#fbbf24;
  --radius:18px;
  --shadow:0 20px 60px rgba(0,0,0,.3);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
  background:var(--bg);
}

body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 15% 0%,rgba(139,92,246,.08),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:"DM Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

a{
  color:inherit;
  text-decoration:none;
}

img,video{
  max-width:100%;
}

img{
  display:block;
}

button,input,textarea,select{
  outline:none;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible{
  outline:2px solid var(--primary2);
  outline-offset:3px;
}

::selection{
  background:rgba(139,92,246,.4);
  color:white;
}

::-webkit-scrollbar{
  width:7px;
  height:7px;
}

::-webkit-scrollbar-thumb{
  background:#36364b;
  border-radius:20px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

.hidden{
  display:none!important;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

.center{
  text-align:center;
}

.flex{
  display:flex;
  align-items:center;
}

.gap-8{
  gap:8px;
}

.gap-12{
  gap:12px;
}

.mt-12{
  margin-top:12px;
}

.mt-20{
  margin-top:20px;
}

.w-full{
  width:100%;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
}

.gradient-text{
  background:linear-gradient(110deg,#c4b5fd,#f0abfc,#f9a8d4);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-mark{
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  flex-shrink:0;
  border-radius:13px;
  color:white;
  font-family:"Space Grotesk",sans-serif;
  font-weight:700;
  font-size:24px;
  background:linear-gradient(135deg,#8b5cf6,#ec4899);
  box-shadow:0 5px 22px rgba(139,92,246,.3);
}

.brand-name{
  font-family:"Space Grotesk",sans-serif;
  font-weight:700;
  font-size:21px;
  letter-spacing:-.8px;
}

.brand-name span{
  color:var(--primary2);
}

.btn{
  min-height:42px;
  padding:10px 16px;
  border:1px solid var(--border);
  border-radius:12px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--surface2);
  color:var(--text);
  font-weight:700;
  transition:transform .15s,background .15s,border-color .15s;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:#555573;
}

.btn.primary{
  border:0;
  color:white;
  background:linear-gradient(110deg,#7c3aed,#a855f7);
  box-shadow:0 7px 20px rgba(124,58,237,.18);
}

.btn.primary:hover{
  background:linear-gradient(110deg,#8b5cf6,#c084fc);
}

.btn.danger{
  color:#fecdd3;
  background:rgba(251,113,133,.09);
  border-color:rgba(251,113,133,.25);
}

.btn.ghost{
  background:transparent;
}

.btn.small-btn{
  min-height:33px;
  padding:6px 11px;
  font-size:12px;
  border-radius:10px;
}

.icon-btn{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border:1px solid transparent;
  border-radius:12px;
  color:var(--text);
  background:transparent;
  font-size:19px;
}

.icon-btn:hover{
  background:var(--surface2);
  border-color:var(--border);
}

.field{
  display:block;
  width:100%;
  min-height:45px;
  padding:12px 14px;
  color:var(--text);
  background:#0d0d16;
  border:1px solid var(--border);
  border-radius:12px;
  transition:border-color .15s;
}

.field::placeholder{
  color:#68687e;
}

.field:focus{
  border-color:var(--primary);
}

textarea.field{
  resize:vertical;
  min-height:95px;
}

select.field{
  cursor:pointer;
}

.label{
  display:block;
  margin-bottom:7px;
  color:#d8d8e8;
  font-size:13px;
  font-weight:700;
}

.form-group{
  margin-bottom:17px;
}

.text-button{
  border:0;
  background:transparent;
  color:var(--primary2);
  font-weight:700;
}

.text-button:hover{
  color:#d8b4fe;
  text-decoration:underline;
}

.divider{
  height:1px;
  background:var(--border);
  margin:20px 0;
}

.avatar{
  width:44px;
  height:44px;
  flex-shrink:0;
  border-radius:50%;
  object-fit:cover;
  background:linear-gradient(135deg,#7c3aed,#ec4899);
  border:1px solid rgba(255,255,255,.08);
}

.avatar.sm{
  width:32px;
  height:32px;
}

.avatar.lg{
  width:76px;
  height:76px;
}

.avatar.xl{
  width:112px;
  height:112px;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  color:#d8b4fe;
  background:rgba(139,92,246,.12);
  border:1px solid rgba(139,92,246,.2);
  border-radius:30px;
  font-size:12px;
  font-weight:700;
}

.badge{
  display:inline-grid;
  place-items:center;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#38bdf8;
  color:#08111b;
  font-size:12px;
  font-weight:900;
}

.empty-state{
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
}

.empty-state .empty-icon{
  font-size:36px;
  margin-bottom:10px;
}

.empty-state h3{
  color:var(--text);
  margin-bottom:6px;
}

.loading{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  padding:25px;
  color:var(--muted);
}

.spinner{
  width:19px;
  height:19px;
  border:2px solid #343448;
  border-top-color:var(--primary2);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}

.fade-in{
  animation:fadeIn .2s ease both;
}

.toast-container{
  position:fixed;
  z-index:10000;
  top:18px;
  right:18px;
  width:min(360px,calc(100vw - 36px));
  display:grid;
  gap:10px;
  pointer-events:none;
}

.toast{
  padding:13px 16px;
  background:#1a1a29;
  border:1px solid var(--border);
  border-left:4px solid var(--primary);
  border-radius:13px;
  box-shadow:var(--shadow);
  color:var(--text);
  animation:fadeIn .2s ease both;
  overflow-wrap:anywhere;
}

.toast.success{
  border-left-color:var(--green);
}

.toast.error{
  border-left-color:var(--red);
}

.toast.warning{
  border-left-color:var(--yellow);
}

/* Authentication */

.auth-screen{
  min-height:100vh;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(360px,.8fr);
  align-items:stretch;
  gap:35px;
  padding:35px;
}

.auth-art{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:45px;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(167,139,250,.13);
  border-radius:28px;
  background:
    radial-gradient(ellipse at 20% 20%,rgba(139,92,246,.23),transparent 45%),
    radial-gradient(ellipse at 90% 85%,rgba(236,72,153,.13),transparent 40%),
    #10101a;
}

.auth-art::after{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  right:-100px;
  top:-100px;
  border:1px solid rgba(196,181,253,.12);
  border-radius:50%;
  box-shadow:
    0 0 0 35px rgba(196,181,253,.025),
    0 0 0 70px rgba(196,181,253,.02);
  pointer-events:none;
}

.auth-art h1{
  position:relative;
  z-index:1;
  max-width:600px;
  margin:55px 0 18px;
  font-family:"Space Grotesk",sans-serif;
  font-size:clamp(42px,5vw,76px);
  line-height:1.06;
  letter-spacing:-3px;
}

.auth-art>p{
  position:relative;
  z-index:1;
  max-width:490px;
  color:#aaaac2;
  font-size:16px;
  line-height:1.8;
}

.feature-pills{
  position:relative;
  z-index:1;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:28px;
}

.auth-card-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  padding:10px;
}

.auth-card{
  width:100%;
  max-width:470px;
  padding:30px;
  background:rgba(18,18,28,.96);
  box-shadow:var(--shadow);
}

.auth-card h2{
  margin:20px 0 7px;
  font-family:"Space Grotesk",sans-serif;
  font-size:28px;
  letter-spacing:-1px;
}

.auth-card>p{
  color:var(--muted);
  margin-bottom:23px;
}

.auth-form{
  display:grid;
  gap:17px;
}

.auth-form .btn{
  width:100%;
  margin-top:3px;
}

.auth-extra-actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:12px;
  margin-top:18px;
}

.auth-toggle{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid var(--border);
  color:var(--muted);
  text-align:center;
}

.auth-toggle button{
  margin-left:5px;
  color:var(--primary2);
  background:transparent;
  border:0;
  font-weight:700;
}

.auth-toggle button:hover{
  text-decoration:underline;
}

.auth-message{
  padding:11px 13px;
  border-radius:10px;
  background:rgba(139,92,246,.1);
  border:1px solid rgba(139,92,246,.22);
  color:#ddd6fe;
  margin-bottom:14px;
  overflow-wrap:anywhere;
}

.saved-accounts{
  display:grid;
  align-content:center;
  gap:12px;
  min-width:0;
}

.saved-account{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface);
}

.saved-account:hover{
  border-color:var(--primary);
}

.saved-account-info{
  min-width:0;
  flex:1;
}

.saved-account-info strong,
.saved-account-info span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.saved-account-info span{
  color:var(--muted);
  font-size:12px;
}

@media(max-width:950px){
  .auth-screen{
    grid-template-columns:1fr;
    gap:20px;
    padding:18px;
  }

  .auth-art{
    min-height:300px;
    padding:28px;
  }

  .auth-art h1{
    margin:35px 0 15px;
    font-size:clamp(39px,8vw,62px);
  }

  .auth-card-wrap{
    padding:0;
  }

  .saved-accounts{
    max-width:600px;
    width:100%;
    margin:auto;
  }
}

@media(max-width:480px){
  .auth-screen{
    padding:10px;
    gap:13px;
  }

  .auth-art{
    min-height:260px;
    padding:21px;
    border-radius:20px;
  }

  .auth-art h1{
    font-size:39px;
    letter-spacing:-1.8px;
    margin:28px 0 12px;
  }

  .auth-art>p{
    font-size:13px;
  }

  .auth-card{
    padding:22px 17px;
  }

  .auth-card h2{
    font-size:24px;
  }

  .brand-name{
    font-size:19px;
  }
}
</style>
</head>
<body>
<div id="toast-container" class="toast-container"></div>
<div id="app">
  <div class="loading">
    <div class="spinner"></div>
    <span>Gromazeef is starting...</span>
  </div>
  </div>

<style>
/* Main application layout */
.app-layout{
  min-height:100vh;
}

.topbar{
  height:72px;
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  gap:24px;
  padding:0 30px;
  background:rgba(11,11,18,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:14px;
  flex-shrink:0;
}

.top-search{
  flex:1;
  max-width:470px;
  margin:auto;
  position:relative;
}

.top-search input{
  padding-left:42px;
  border-radius:25px;
  background:var(--surface2);
}

.top-search-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  pointer-events:none;
}

.topbar-actions{
  display:flex;
  align-items:center;
  gap:9px;
  flex-shrink:0;
}

.app-body{
  max-width:1500px;
  margin:0 auto;
  padding:25px 28px;
  display:grid;
  grid-template-columns:230px minmax(0,680px) 280px;
  justify-content:center;
  gap:26px;
}

.sidebar{
  position:sticky;
  top:95px;
  align-self:start;
  max-height:calc(100vh - 115px);
  overflow-y:auto;
  padding-bottom:15px;
}

.sidebar-brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 8px 23px;
  cursor:pointer;
}

.sidebar-nav{
  display:grid;
  gap:5px;
}

.nav-button{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  min-height:48px;
  padding:11px 14px;
  border:1px solid transparent;
  border-radius:13px;
  background:transparent;
  color:#b5b5ca;
  text-align:left;
  font-weight:600;
  transition:background .15s,color .15s;
}

.nav-button:hover{
  background:var(--surface2);
  color:white;
}

.nav-button.active{
  color:white;
  background:rgba(139,92,246,.14);
  border-color:rgba(139,92,246,.2);
}

.nav-icon{
  width:25px;
  text-align:center;
  font-size:20px;
}

.nav-label{
  flex:1;
}

.nav-count{
  min-width:19px;
  height:19px;
  display:grid;
  place-items:center;
  padding:0 5px;
  background:var(--pink);
  border-radius:20px;
  color:white;
  font-size:10px;
  font-weight:800;
}

.sidebar-divider{
  height:1px;
  background:var(--border);
  margin:17px 4px;
}

.sidebar-heading{
  padding:0 14px 10px;
  color:#76768e;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.4px;
  text-transform:uppercase;
}

.sidebar-profile{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:18px;
  padding:12px 9px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface);
  cursor:pointer;
}

.sidebar-profile-info{
  flex:1;
  min-width:0;
}

.sidebar-profile-info strong,
.sidebar-profile-info span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.sidebar-profile-info strong{
  font-size:12px;
}

.sidebar-profile-info span{
  color:var(--muted);
  font-size:11px;
}

.page-column{
  min-width:0;
}

.right-sidebar{
  position:sticky;
  top:95px;
  align-self:start;
  display:grid;
  gap:18px;
  min-width:0;
}

.panel{
  padding:18px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
}

.panel-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.panel-header h3{
  font-family:"Space Grotesk",sans-serif;
  font-size:15px;
}

.panel-header button{
  border:0;
  background:transparent;
  color:var(--primary2);
  font-size:12px;
  font-weight:700;
}

.page-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:22px;
}

.page-heading h1{
  font-family:"Space Grotesk",sans-serif;
  font-size:26px;
  letter-spacing:-1px;
}

.page-heading p{
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
}

.section-title{
  margin:24px 0 14px;
  font-family:"Space Grotesk",sans-serif;
  font-size:18px;
}

.stack{
  display:grid;
  gap:15px;
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.row-between{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.grow{
  flex:1;
  min-width:0;
}

.user-name{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-weight:700;
  overflow-wrap:anywhere;
}

.user-handle{
  color:var(--muted);
  font-size:12px;
  overflow-wrap:anywhere;
}

.user-name:hover{
  text-decoration:underline;
}

.truncate{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.text-link{
  color:var(--primary2);
  font-weight:700;
}

.text-link:hover{
  text-decoration:underline;
}

.mini-user{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 0;
  min-width:0;
}

.mini-user .grow{
  overflow:hidden;
}

.mini-user .btn{
  flex-shrink:0;
}

.mobile-nav{
  display:none;
}

/* Feed and post cards */
.feed-list{
  display:grid;
  gap:20px;
}

.post-card{
  min-width:0;
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  animation:fadeIn .2s ease both;
}

.post-header{
  display:flex;
  align-items:center;
  gap:11px;
  padding:15px 16px;
}

.post-header-info{
  flex:1;
  min-width:0;
}

.post-header-info .user-name{
  font-size:13px;
}

.post-menu-wrap{
  position:relative;
}

.post-menu{
  position:absolute;
  z-index:20;
  top:42px;
  right:0;
  width:180px;
  padding:6px;
  background:#202032;
  border:1px solid var(--border);
  border-radius:13px;
  box-shadow:var(--shadow);
}

.post-menu button{
  width:100%;
  display:block;
  padding:10px;
  color:var(--text);
  background:transparent;
  border:0;
  border-radius:8px;
  text-align:left;
}

.post-menu button:hover{
  background:var(--surface3);
}

.post-media{
  position:relative;
  width:100%;
  background:#08080d;
  overflow:hidden;
}

.post-media img,
.post-media video{
  display:block;
  width:100%;
  max-height:760px;
  object-fit:contain;
  background:#08080d;
}

.post-media video{
  min-height:150px;
}

.post-media .media-cover{
  aspect-ratio:4/5;
  object-fit:cover;
}

const $ = selector => document.querySelector(selector);

const $$ = selector => Array.from(document.querySelectorAll(selector));

const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[char]));

const safeText = value => escapeHTML(value);

const safeURL = value => {
  if (!value) return "";
  try {
    const url = new URL(String(value), location.origin);
    if (["http:", "https:"].includes(url.protocol)) return url.href;
  } catch (_) {}
  return "";
};

const formatCount = value => {
  const count = Number(value) || 0;
  if (count >= 1000000) return (count / 1000000).toFixed(1) + "M";
  if (count >= 1000) return (count / 1000).toFixed(1) + "K";
  return String(count);
};

const formatDate = value => {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  return date.toLocaleDateString(undefined, {
    month: "short",
    day: "numeric",
    year: "numeric"
  });
};

const timeAgo = value => {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  const seconds = Math.floor((Date.now() - date.getTime()) / 1000);

  if (seconds < 60) return "Just now";
  if (seconds < 3600) return Math.floor(seconds / 60) + "m ago";
  if (seconds < 86400) return Math.floor(seconds / 3600) + "h ago";
  if (seconds < 604800) return Math.floor(seconds / 86400) + "d ago";

  return formatDate(value);
};

function friendlyError(error) {
  const message = String(
    error?.message ||
    error?.error_description ||
    error?.details ||
    error ||
    "Something went wrong."
  );

  if (/invalid login credentials/i.test(message)) {
    return "Username/email ya password galat hai.";
  }

  if (/email not confirmed/i.test(message)) {
    return "Pehle apna email verify karo.";
  }

  if (/user already registered/i.test(message)) {
    return "Is email se account pehle se bana hua hai.";
  }

  if (/duplicate key|unique constraint/i.test(message)) {
    return "Ye username pehle se use ho raha hai.";
  }

  if (/password should be at least/i.test(message)) {
    return "Password aur strong rakho.";
  }

  if (/network|fetch failed|failed to fetch/i.test(message)) {

  if (/row-level security|permission denied/i.test(message)) {
    return "Is action ki permission nahi hai. Supabase policies check karni hongi.";

  if (/jwt|invalid token/i.test(message)) {

  return message.slice(0, 240);

/* ================================
   TOAST NOTIFICATIONS
================================ */

function toast(message, type = "info", duration = 3500) {
  const container = $("#toast-container");
  if (!container) return;

  const item = document.createElement("div");
  item.className = "toast " + (
    ["success", "error", "warning"].includes(type) ? type : ""
  );

  item.textContent = String(message || "Done");
  container.appendChild(item);

  window.setTimeout(() => {
    item.style.opacity = "0";
    item.style.transform = "translateY(-5px)";

    window.setTimeout(() => item.remove(), 250);
  }, duration);
}

/* ================================
   BUTTON LOADING STATE
================================ */

function setButtonLoading(button, loading, loadingText = "Please wait...") {
  if (!button) return;

  if (loading) {
    if (!button.dataset.originalHTML) {
      button.dataset.originalHTML = button.innerHTML;
    }

    button.disabled = true;
    button.innerHTML =
      '<span class="spinner" aria-hidden="true"></span>' +
      '<span>' + escapeHTML(loadingText) + "</span>";
  } else {
    button.disabled = false;

    if (button.dataset.originalHTML) {
      button.innerHTML = button.dataset.originalHTML;
      delete button.dataset.originalHTML;
    }
  }
}

/* ================================
   SAVED ACCOUNTS
================================ */

function getSavedAccounts() {
  try {
    const raw = localStorage.getItem(SAVED_ACCOUNTS_KEY);
    const accounts = JSON.parse(raw || "[]");
    return Array.isArray(accounts) ? accounts : [];
  } catch (_) {
    return [];
  }
}

function saveCurrentAccount() {
  if (!state.user || !state.profile) return;

  try {
    const accounts = getSavedAccounts();

    const account = {
      id: state.user.id,
      username: state.profile.username || "",
      full_name: state.profile.full_name || "",
      avatar_url: state.profile.avatar_url || "",
      saved_at: new Date().toISOString()
    };

    if (!account.username) return;

    const updated = [
      account,
      ...accounts.filter(item => item.id !== account.id)
    ].slice(0, MAX_SAVED_ACCOUNTS);

    localStorage.setItem(
      SAVED_ACCOUNTS_KEY,
      JSON.stringify(updated)
    );
  } catch (error) {
    console.warn("Saved account details could not be stored.");
  }
}

function removeSavedAccount(accountId) {
  try {
    const updated = getSavedAccounts().filter(
      account => account.id !== accountId
    );

    localStorage.setItem(
      SAVED_ACCOUNTS_KEY,
      JSON.stringify(updated)
    );

    toast("Saved account removed.", "success");

    if (!state.user) renderAuth();
  } catch (_) {
    toast("Account remove nahi hua.", "error");
  }
}

function renderSavedAccounts() {
  const accounts = getSavedAccounts();

  if (!accounts.length) return "";

  return `
    <section class="saved-accounts">
      <h3>Saved accounts</h3>
      <p class="muted small">Accounts saved on this device</p>

      ${accounts.map(account => {
        const avatar = safeURL(account.avatar_url) || DEFAULT_AVATAR;

        return `

/* ================================

function createClient() {
  if (
  !SUPABASE_URL.startsWith("https://") ||
  !SUPABASE_ANON_KEY
) {
    console.error("Supabase URL or publishable/anon key is missing.");

/* ================================
   SAFE PROFILE FETCH
================================ */

async function fetchProfile(userId) {
  if (!state.client || !userId) return null;

  const { data, error } = await state.client
    .from("profiles")
    .select("*")
    .eq("id", userId)
    .maybeSingle();

  if (error) {
    console.warn("Profile fetch failed:", error.message);
    return null;
  }

  return data || null;
}

async function ensureProfile() {
  if (!state.client || !state.user) {
    state.profile = null;
    return null;
  }

  let profile = await fetchProfile(state.user.id);

  if (!profile) {
    const metadata = state.user.user_metadata || {};

    const fallbackUsername =
      metadata.username ||
      (state.user.email
        ? state.user.email.split("@")[0]
        : "user") +
      "_" +
      state.user.id.slice(0, 5);

    const newProfile = {
      id: state.user.id,
      username: String(fallbackUsername)
        .toLowerCase()
        .replace(/[^a-z0-9_.]/g, "")
        .slice(0, 24),
      full_name: metadata.full_name || fallbackUsername,
      avatar_url: metadata.avatar_url || null
    };

    const { data, error } = await state.client
      .from("profiles")
      .upsert(newProfile, { onConflict: "id" })
      .select("*")
      .maybeSingle();

    if (error) {
      console.warn("Profile creation failed:", error.message);
      state.profile = null;
      return null;
    }

    profile = data;
  }

  state.profile = profile;
  saveCurrentAccount();

  return profile;
}

/* ================================

function isLoggedIn() {

function requireLogin() {

function isOwnProfile(profile) {

  );

/* ================================
   AUTH INPUT HELPERS
================================ */

function normalizeUsername(value) {
  return String(value || "")
    .trim()
    .replace(/^@/, "")
    .toLowerCase();
}

function validUsername(value) {
  return /^[a-zA-Z0-9_.]{3,24}$/.test(String(value || ""));
}

function validPassword(value) {
  return typeof value === "string" && value.length >= 6;
}

function setAuthMessage(message, type = "info") {
  let node = $("#auth-message");

  if (!message) {
    node?.remove();
    return;
  }

  if (!node) {
    node = document.createElement("div");
    node.id = "auth-message";
    node.className = "auth-message";

    const form = $("#auth-form");
    if (form) form.before(node);
  }

  node.textContent = message;
  node.dataset.type = type;
}

/* ================================
   USERNAME AVAILABILITY
================================ */

async function checkUsernameAvailable(username) {
  if (!state.client) {
    return {
      available: false,
      message: "Connection unavailable."
    };
  }

  const clean = normalizeUsername(username);

  if (!validUsername(clean)) {
    return {
      available: false,
      message: "3–24 characters: letters, numbers, _ or ."
    };
  }

  try {
    const { data, error } = await state.client.rpc(
      "is_username_available",
      {
        username_to_check: clean
      }
    );

    if (error) {
      console.warn("Username availability check failed:", error.message);

      return {
        available: null,
        message: "Username submit karne par verify hoga."
      };
    }

    const available = data === true;

    return {
      available,
      message: available
        ? "✓ Username available"
        : "This username is already taken."
    };
  } catch (error) {
    console.warn(error);

    return {
      available: null,
      message: "Username submit karne par verify hoga."
    };
  }
}

/* ================================
   AUTH MODE RESET
================================ */

function resetAuthForm() {
  state.loading = false;

  const form = $("#auth-form");
  if (form) form.reset();

  setAuthMessage("");
}

/* ================================
   USERNAME LIVE CHECK
================================ */

let usernameCheckTimer = null;

function handleUsernameInput(event) {
  const input = event.target;
  const status = $("#username-status");

  if (!input || !status) return;

  const username = normalizeUsername(input.value);
  input.value = input.value.replace(/^@/, "");

  clearTimeout(usernameCheckTimer);

  if (!username) {
    status.textContent = "";
    return;
  }

  if (!validUsername(username)) {
    status.textContent =
      "Use 3–24 letters, numbers, underscores or dots.";
    status.style.color = "var(--red)";
    return;
  }

  status.textContent = "Checking username...";
  status.style.color = "var(--muted)";

  usernameCheckTimer = setTimeout(async () => {
    const result = await checkUsernameAvailable(username);

    if ($("#auth-username")?.value.trim().toLowerCase() !== username) {
      return;
    }

    status.textContent = result.message;

    status.style.color = result.available === true
      ? "var(--green)"
      : result.available === false
        ? "var(--red)"
        : "var(--muted)";
  }, 500);
}

async function checkUsernameOnBlur() {
  const input = $("#auth-username");
  const status = $("#username-status");

  if (!input || !status || state.authMode !== "signup") return;

  const username = normalizeUsername(input.value);

  if (!validUsername(username)) return;

  const result = await checkUsernameAvailable(username);

  status.textContent = result.message;

  status.style.color = result.available === true
    ? "var(--green)"
    : result.available === false
      ? "var(--red)"
      : "var(--muted)";
}

/* ================================
   AUTH SUBMIT
================================ */

async function handleAuth(event) {
  event.preventDefault();

  if (!state.client) {
    toast("Supabase configuration check karo.", "error");
    return;
  }

  if (state.loading) return;

  const form = event.currentTarget;
  const formData = new FormData(form);
  const signup = state.authMode === "signup";

  const password = String(formData.get("password") || "");
  const button = $("#auth-submit");

  if (!validPassword(password)) {
    toast("Password kam se kam 6 characters ka hona chahiye.", "warning");
    return;
  }

  state.loading = true;
  setButtonLoading(button, true, signup ? "Creating account..." : "Signing in...");

  try {
    if (signup) {
      const email = String(formData.get("email") || "").trim();
      const fullName = String(formData.get("full_name") || "").trim();
      const username = normalizeUsername(formData.get("username"));

      if (!email || !fullName || !validUsername(username)) {
        throw new Error("Name, valid email aur username check karo.");
      }

      const availability = await checkUsernameAvailable(username);

      if (availability.available === false) {
        throw new Error("Ye username pehle se use ho raha hai.");
      }

      /*
        Authentication is handled by Supabase Auth.
        Profile creation happens after the session is established.
      */
      const { data, error } = await state.client.auth.signUp({
        email,
        password,
        options: {
          data: {
            username,
            full_name: fullName
          }
        }
      });

      if (error) throw error;

      if (data?.user && data?.session) {
        state.session = data.session;
        state.user = data.user;

        const { error: profileError } = await state.client
          .from("profiles")
          .upsert({
            id: data.user.id,
            username,
            full_name: fullName
          }, { onConflict: "id" });

        if (profileError) {
          console.warn("Profile creation:", profileError.message);
        }

        await ensureProfile();
        renderShell();
        startRefresh();

        toast("Welcome to Gromazeef!", "success");
      } else {
        setAuthMessage(
          "Account request received. Email inbox check karo aur verification link open karo.",
          "success"
        );

        toast("Email verification required.", "success");
      }
    } else {
      const username = String(formData.get("username") || "").trim();

      if (!username) {
        throw new Error("Username enter karo.");
      }

      /*
        The quick-responder Edge Function must implement this
        exact request contract for username-based sign-in.
      */
      const { data, error } = await state.client.functions.invoke(
        "quick-responder",
        {
          body: {
            action: "login",
            username: normalizeUsername(username),
            password
          }
        }
      );

      if (error) throw error;

      if (data?.error) {
        throw new Error(data.error);
      }

      if (data?.access_token && data?.refresh_token) {
        const { data: sessionData, error: sessionError } =
          await state.client.auth.setSession({
            access_token: data.access_token,
            refresh_token: data.refresh_token
          });

        if (sessionError) throw sessionError;

        state.session = sessionData.session;
        state.user = sessionData.user;

        await ensureProfile();
        renderShell();
        startRefresh();

        toast("Welcome back!", "success");
      } else {
        throw new Error(
          "Login response incomplete. Check the quick-responder function."
        );
      }
    }
  } catch (error) {
    console.error("Authentication error:", error);

    const message = friendlyError(error);

    setAuthMessage(message, "error");
    toast(message, "error", 5000);
  } finally {
    state.loading = false;

    const currentButton = $("#auth-submit");
    if (currentButton) {
      setButtonLoading(currentButton, false);
    }
  }
}

/* ================================
   PASSWORD RESET
================================ */

async function requestPasswordReset() {
  if (!state.client) {
    toast("Supabase configuration check karo.", "error");
    return;
  }

  const username = $("#auth-username")?.value.trim() || "";

  if (!username) {
    toast("Username enter karo, phir Forgot password dabao.", "warning");
    $("#auth-username")?.focus();
    return;
  }

  const email = prompt(
    "Password reset ke liye apne account ka registered email enter karo:"
  );

  if (!email || !email.includes("@")) {
    toast("Valid registered email enter karo.", "warning");
    return;
  }

  try {
    const { data, error } = await state.client.functions.invoke(
      "username-password-reset",
      {
        body: {
          username: normalizeUsername(username),
          email: email.trim()
        }
      }
    );

    if (error) throw error;
    if (data?.error) throw new Error(data.error);

    toast(
      "Agar details match karti hain, reset instructions email par aa jayengi.",
      "success",
      5000
    );
  } catch (error) {
    console.error("Password reset error:", error);
    toast(friendlyError(error), "error", 5000);
  }
}

/* ================================
   EMAIL OTP / MAGIC LINK
================================ */

async function requestEmailOTP() {
  if (!state.client) {
    toast("Supabase configuration check karo.", "error");
    return;
  }

  const email = prompt("Registered email address enter karo:");

  if (!email || !email.includes("@")) {
    toast("Valid email enter karo.", "warning");
    return;
  }

  try {
    const { error } = await state.client.auth.signInWithOtp({
      email: email.trim(),
      options: {
        emailRedirectTo: location.origin + location.pathname
      }
    });

    if (error) throw error;

    toast(
      "Sign-in link email par bhej diya gaya, inbox check karo.",
      "success",
      5000
    );
  } catch (error) {
    console.error("Email sign-in error:", error);
    toast(friendlyError(error), "error", 5000);
  }
}

/* ================================

================================ */

async function fetchFeed(limit = 30) {
  if (!state.client) return [];

  const { data, error } = await state.client
    .from("posts")
    .select("*")
    .order("created_at", { ascending: false })
    .limit(limit);

  if (error) {
    console.warn("Feed fetch failed:", error.message);
    return [];
  }

  const posts = data || [];
  const userIds = [...new Set(posts.map(post => post.user_id).filter(Boolean))];

  if (!userIds.length) return posts.map(post => ({
    ...post,
    profile: null
  }));

  const { data: profiles, error: profileError } = await state.client
    .from("profiles")
    .select("id,username,full_name,avatar_url,is_verified")
    .in("id", userIds);

  if (profileError) {
    console.warn("Post profiles unavailable:", profileError.message);
  }

  const profileMap = new Map(
    (profiles || []).map(profile => [profile.id, profile])
  );

  return posts.map(post => ({
    ...post,
    profile: profileMap.get(post.user_id) || null
  }));
}

function postHTML(post) {
  const profile = post.profile || {};
  const mediaURL = safeURL(post.media_url || post.image_url || "");
  const type = String(post.media_type || "").toLowerCase();
  const caption = post.caption || post.content || "";

  const likes = Number(post.likes_count || 0);
  const comments = Number(post.comments_count || 0);

  const liked = state.likedPostIds.has(post.id);
  const saved = state.savedPostIds.has(post.id);

  let mediaHTML = "";

  if (mediaURL) {
    if (type.includes("video")) {
      mediaHTML = `
        <video controls playsinline preload="metadata">
          <source src="${escapeHTML(mediaURL)}">
          Your browser cannot play this video.
        </video>
      `;
    } else {
      mediaHTML = `
        <img src="${escapeHTML(mediaURL)}"
          alt="Post media"
          loading="lazy"
          onerror="this.parentElement.innerHTML='<div class=&quot;post-media-empty&quot;>Media unavailable</div>'">
      `;
    }
  }

  return `
    <article class="post-card" data-post-id="${escapeHTML(post.id)}">
      <header class="post-header">
        <a href="${userLink(profile.id)}" data-profile-id="${escapeHTML(profile.id || "")}">
          ${avatarHTML(profile)}
        </a>

        <div class="post-header-info">
          <a class="user-name"
            href="${userLink(profile.id)}"
            data-profile-id="${escapeHTML(profile.id || "")}">
            ${safeText(getDisplayName(profile))}
            ${profile.is_verified ? '<span class="badge">✓</span>' : ""}
          </a>

          <div class="user-handle">
            ${safeText(getUsername(profile))}
            · ${escapeHTML(timeAgo(post.created_at))}
          </div>
        </div>

        <div class="post-menu-wrap">
          <button class="icon-btn" data-post-menu="${escapeHTML(post.id)}"
            aria-label="Post options">···</button>
        </div>
      </header>

      ${mediaHTML ? `<div class="post-media">${mediaHTML}</div>` : ""}

      ${caption ? `
        <div class="post-caption">
          <span class="user-name">${safeText(profile.username || "user")}</span>
          ${safeText(caption)}
        </div>
      ` : ""}

      <div class="post-actions">
        <button class="post-action ${liked ? "liked" : ""}"
          data-like-post="${escapeHTML(post.id)}">
          <span class="action-icon">${liked ? "♥" : "♡"}</span>
          <span>${formatCount(likes + (liked ? 1 : 0))}</span>
        </button>

        <button class="post-action"
          data-comment-post="${escapeHTML(post.id)}">
          <span class="action-icon">♧</span>
          <span>${formatCount(comments)}</span>
        </button>

        <button class="post-action"
          data-share-post="${escapeHTML(post.id)}">
          <span class="action-icon">↗</span>
        </button>

        <button class="post-action ${saved ? "saved" : ""}"
          data-save-post="${escapeHTML(post.id)}">
          <span class="action-icon">${saved ? "▣" : "♢"}</span>
        </button>
      </div>

      <div class="post-time">
        ${escapeHTML(formatDate(post.created_at))}
      </div>
    </article>
  `;
}

/* ================================
   POST ACTION BINDINGS
================================ */

function bindPostActions(root = document) {
  root.querySelectorAll("[data-profile-id]").forEach(link => {
    link.addEventListener("click", event => {
      event.preventDefault();
      openProfile(link.dataset.profileId);
    });
  });

  root.querySelectorAll("[data-like-post]").forEach(button => {
    button.addEventListener("click", async () => {
      await toggleLike(button.dataset.likePost);
    });
  });

  root.querySelectorAll("[data-save-post]").forEach(button => {
    button.addEventListener("click", async () => {
      await toggleSave(button.dataset.savePost);
    });
  });

  root.querySelectorAll("[data-comment-post]").forEach(button => {
    button.addEventListener("click", () => {
      openComments(button.dataset.commentPost);
    });
  });

  root.querySelectorAll("[data-share-post]").forEach(button => {
    button.addEventListener("click", async () => {
      await sharePost(button.dataset.sharePost);
    });
  });

  root.querySelectorAll("[data-post-menu]").forEach(button => {
    button.addEventListener("click", () => {
      openPostMenu(button.dataset.postMenu);
    });
  });
}

/* ================================
   END PART 5
================================ */
</script>
<!-- PART 6/7 — POST ACTIONS, COMMENTS, EXPLORE & PROFILE -->

<script>
/* ================================
   LIKE / UNLIKE POSTS
================================ */

async function toggleLike(postId) {
  if (!requireLogin()) return;

  if (!postId || !state.client) return;

  const wasLiked = state.likedPostIds.has(postId);

  try {
    if (wasLiked) {
      const { error } = await state.client
        .from("likes")
        .delete()
        .eq("post_id", postId)
        .eq("user_id", state.user.id);

      if (error) throw error;

      state.likedPostIds.delete(postId);
    } else {
      const { error } = await state.client
        .from("likes")
        .insert({
          post_id: postId,
          user_id: state.user.id
        });

      if (error) throw error;

      state.likedPostIds.add(postId);
    }

    await renderPage();
  } catch (error) {
    console.error("Like operation failed:", error);
    toast(friendlyError(error), "error");
  }
}

/* ================================
   SAVE / UNSAVE POSTS
================================ */

async function toggleSave(postId) {
  if (!requireLogin()) return;

  const wasSaved = state.savedPostIds.has(postId);

  try {
    if (wasSaved) {
      const { error } = await state.client
        .from("saved_posts")
        .delete()
        .eq("post_id", postId)
        .eq("user_id", state.user.id);

      if (error) throw error;

      state.savedPostIds.delete(postId);
      toast("Removed from saved posts.", "success");
    } else {
      const { error } = await state.client
        .from("saved_posts")
        .insert({
          post_id: postId,
          user_id: state.user.id
        });

      if (error) throw error;

      state.savedPostIds.add(postId);
      toast("Post saved.", "success");
    }

    await renderPage();
  } catch (error) {
    console.error("Save operation failed:", error);
    toast(friendlyError(error), "error");
  }
}

/* ================================
   SHARE POSTS
================================ */

async function sharePost(postId) {
  const url = location.origin +
    location.pathname +
    "#post-" +
    encodeURIComponent(postId);

  try {
    if (navigator.share) {
      await navigator.share({
        title: "Gromazeef post",
        text: "Check out this post on Gromazeef.",
        url
      });
    } else if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(url);
      toast("Post link copied.", "success");
    } else {
      prompt("Copy this post link:", url);
    }
  } catch (error) {
    if (error?.name !== "AbortError") {
      prompt("Copy this post link:", url);
    }
  }
}

/* ================================
   POST MENU
================================ */

async function openPostMenu(postId) {
  const post = state.feed.find(item => String(item.id) === String(postId))
    || state.explorePosts.find(item => String(item.id) === String(postId));

  if (!post) {
    toast("Post unavailable.", "warning");
    return;
  }

  const ownPost = post.user_id === state.user?.id;

  const content = `
    <div class="modal-header">
      <h2>Post options</h2>
      <button class="icon-btn" data-close-modal>×</button>
    </div>

    <div class="stack">
      <button class="btn w-full" id="menu-share-post">↗ Share post</button>
      <button class="btn w-full" id="menu-save-post">▣ Save post</button>
      ${ownPost ? `
        <button class="btn w-full" id="menu-edit-post">✎ Edit caption</button>
        <button class="btn danger w-full" id="menu-delete-post">Delete post</button>
      ` : `
        <button class="btn danger w-full" id="menu-report-post">Report post</button>
      `}
    </div>
  `;

  openModal(content);

  $("#menu-share-post")?.addEventListener("click", async () => {
    closeModal();
    await sharePost(postId);
  });

  $("#menu-save-post")?.addEventListener("click", async () => {
    closeModal();
    await toggleSave(postId);
  });

  $("#menu-edit-post")?.addEventListener("click", () => {
    closeModal();
    editPost(post);
  });

  $("#menu-delete-post")?.addEventListener("click", async () => {
    closeModal();
    await deletePost(postId);
  });

  $("#menu-report-post")?.addEventListener("click", async () => {
    closeModal();
    await reportPost(postId);
  });
}

/* ================================
   DELETE POST
================================ */

async function deletePost(postId) {
  if (!confirm("Are you sure you want to delete this post?")) return;

  try {
    const { error } = await state.client
      .from("posts")
      .delete()
      .eq("id", postId)
      .eq("user_id", state.user.id);

    if (error) throw error;

    state.feed = state.feed.filter(post => post.id !== postId);

    toast("Post deleted.", "success");
    await renderPage();
  } catch (error) {
    console.error("Delete post failed:", error);
    toast(friendlyError(error), "error");
  }
}

/* ================================
   EDIT POST CAPTION
================================ */

function editPost(post) {
  const content = `
    <div class="modal-header">
      <h2>Edit caption</h2>
      <button class="icon-btn" data-close-modal>×</button>
    </div>

    <form id="edit-post-form" class="stack">
      <textarea id="edit-post-caption" class="field"
        maxlength="2200" placeholder="Write a caption...">${safeText(post.caption || "")}</textarea>

      <button class="btn primary" type="submit">Save changes</button>
    </form>
  `;

  openModal(content);

  $("#edit-post-form")?.addEventListener("submit", async event => {
    event.preventDefault();

    const caption = $("#edit-post-caption")?.value.trim() || "";

    try {
      const { error } = await state.client
        .from("posts")
        .update({ caption })
        .eq("id", post.id)
        .eq("user_id", state.user.id);

      if (error) throw error;

      closeModal();
      toast("Caption updated.", "success");
      await renderPage();
    } catch (error) {
      toast(friendlyError(error), "error");
    }
  });
}

/* ================================
   REPORT POST
================================ */

async function reportPost(postId) {
  const reason = prompt(
    "Report reason enter karo (spam, harassment, harmful content):"
  );

  if (!reason?.trim()) return;

  try {
    const { error } = await state.client
      .from("reports")
      .insert({
        reporter_id: state.user.id,
        target_type: "post",
        target_id: postId,
        reason: reason.trim().slice(0, 500)
      });

    if (error) throw error;

    toast("Report submitted.", "success");
  } catch (error) {
    console.error("Report failed:", error);
    toast(friendlyError(error), "error");
  }
}

/* ================================
   COMMENTS
================================ */

async function fetchComments(postId) {
  const { data, error } = await state.client
    .from("comments")
    .select("*")
    .eq("post_id", postId)
    .order("created_at", { ascending: true })
    .limit(100);

  if (error) {
    console.error("Comments fetch failed:", error);
    return [];
  }

  return data || [];
}

async function openComments(postId) {
  if (!requireLogin()) return;

  const comments = await fetchComments(postId);

  const content = `
    <div class="modal-header">
      <h2>Comments</h2>
      <button class="icon-btn" data-close-modal>×</button>
    </div>

    <div id="comments-list" class="stack">
      ${comments.length ? comments.map(comment => `
        <div class="row" style="align-items:flex-start">
          <div class="grow">
            <strong>${safeText(comment.user_id === state.user.id
              ? state.profile?.username || "You"
              : "User")}</strong>

            <p>${safeText(comment.content || comment.body || "")}</p>

            <small class="muted">${escapeHTML(timeAgo(comment.created_at))}</small>
          </div>
        </div>
      `).join("") : `
        <div class="empty-state">
          <p>No comments yet. Start the conversation.</p>
        </div>
      `}
    </div>

    <form id="comment-form" class="stack mt-20">
      <textarea id="comment-text" class="field"
        maxlength="1000" placeholder="Write a comment..." required></textarea>
      <button class="btn primary" type="submit">Post comment</button>
    </form>
  `;

  openModal(content);

  $("#comment-form")?.addEventListener("submit", async event => {
    event.preventDefault();

    const input = $("#comment-text");
    const text = input?.value.trim();

    if (!text) return;

    try {
      const { error } = await state.client
        .from("comments")
        .insert({
          post_id: postId,
          user_id: state.user.id,
          content: text
        });

      if (error) throw error;

      closeModal();
      toast("Comment added.", "success");
      await renderPage();
    } catch (error) {
      console.error("Comment submit failed:", error);
      toast(friendlyError(error), "error");
    }
  });
}

/* ================================
   EXPLORE
================================ */

async function renderExplore(root) {
  const posts = await fetchFeed(50);
  state.explorePosts = posts;

  const query = state.searchQuery.toLowerCase();

  const filtered = query
    ? posts.filter(post => {
        const caption = String(post.caption || post.content || "").toLowerCase();
        const username = String(post.profile?.username || "").toLowerCase();
        const fullName = String(post.profile?.full_name || "").toLowerCase();

        return caption.includes(query) ||
          username.includes(query) ||
          fullName.includes(query);
      })
    : posts;

  root.innerHTML = `
    <div class="page-heading">
      <div>
        <h1>Explore</h1>
        <p>Discover people and posts.</p>
      </div>
    </div>

    <form id="explore-search-form" class="row mb-12">
      <input id="explore-search" class="field"
        placeholder="Search username, name or caption..."
        value="${escapeHTML(state.searchQuery)}">
      <button class="btn primary" type="submit">Search</button>
    </form>

    <div class="feed-list" id="explore-posts">
      ${filtered.length
        ? filtered.map(postHTML).join("")
        : `
          <div class="card empty-state">
            <div class="empty-icon">⌕</div>
            <h3>No matching posts</h3>
            <p>Try another search.</p>
          </div>
        `
      }
    </div>
  `;

  $("#explore-search-form")?.addEventListener("submit", event => {
    event.preventDefault();
    state.searchQuery = $("#explore-search")?.value.trim() || "";
    renderExplore($("#page-root"));
  });

  bindPostActions(root);
}

/* ================================
   PROFILE OPENING
================================ */

function openProfile(userId) {
  if (!userId) return;

  if (userId === state.user?.id) {
    state.activeProfileId = null;
    navigate("profile");
    return;
  }

  state.activeProfileId = userId;
  navigate("profile");
}

/* ================================
   END PART 6
================================ */
</script>
<!-- PART 7/7 — PROFILE, MESSAGES, NOTIFICATIONS, SETTINGS & STARTUP -->

<script>
/* =====================================
   PROFILE PAGE
===================================== */

async function renderProfile(root) {
  if (!state.user) {
    renderAuth();
    return;
  }

  const viewingOwnProfile = !state.activeProfileId ||
    state.activeProfileId === state.user.id;

  let profile = viewingOwnProfile
    ? state.profile
    : await fetchProfile(state.activeProfileId);

  if (!profile) {
    root.innerHTML = `
      <div class="card empty-state">
        <h2>Profile unavailable</h2>
        <button class="btn" onclick="navigate('home')">Go home</button>
      </div>
    `;
    return;
  }

  const userId = profile.id || profile.user_id || state.user.id;

  const [{ count: postsCount }, { count: followersCount }, { count: followingCount }] =
    await Promise.all([
      state.client.from("posts").select("id", { count: "exact", head: true }).eq("user_id", userId),
      state.client.from("follows").select("id", { count: "exact", head: true }).eq("following_id", userId),
      state.client.from("follows").select("id", { count: "exact", head: true }).eq("follower_id", userId)
    ]);

  let following = false;

  if (!viewingOwnProfile) {
    const { data } = await state.client
      .from("follows")
      .select("id")
      .eq("follower_id", state.user.id)
      .eq("following_id", userId)
      .maybeSingle();

    following = !!data;
  }

  const { data: posts } = await state.client
    .from("posts")
    .select("*")
    .eq("user_id", userId)
    .order("created_at", { ascending: false })
    .limit(50);

  root.innerHTML = `
    <div class="profile-header card">
      <div class="profile-cover"></div>

      <div class="profile-details">
        <div class="avatar avatar-xl">
          ${profile.avatar_url
            ? `<img src="${escapeHTML(profile.avatar_url)}" alt="">`
            : escapeHTML((profile.username || "G").charAt(0).toUpperCase())}
        </div>

        <div class="profile-main">
          <h1>${safeText(profile.full_name || profile.username || "Gromazeef user")}</h1>
          <p class="muted">@${safeText(profile.username || "user")}</p>
          <p>${safeText(profile.bio || "")}</p>

          <div class="profile-stats">
            <span><strong>${postsCount || 0}</strong> posts</span>
            <span><strong>${followersCount || 0}</strong> followers</span>
            <span><strong>${followingCount || 0}</strong> following</span>
          </div>

          <div class="row mt-12">
            ${viewingOwnProfile
              ? `<button class="btn primary" id="edit-profile-btn">Edit profile</button>`
              : `
                <button class="btn primary" id="follow-profile-btn">
                  ${following ? "Following" : "Follow"}
                </button>
                <button class="btn" id="message-profile-btn">Message</button>
              `
            }
          </div>
        </div>
      </div>
    </div>

    <div class="page-heading mt-20">
      <h2>Posts</h2>
    </div>

    <div class="feed-list">
      ${posts?.length
        ? posts.map(post => postHTML({ ...post, profile })).join("")
        : `<div class="card empty-state"><h3>No posts yet</h3><p>Posts will appear here.</p></div>`
      }
    </div>
  `;

  $("#edit-profile-btn")?.addEventListener("click", openEditProfile);

  $("#follow-profile-btn")?.addEventListener("click", async () => {
    await toggleFollow(userId, following);
  });

  $("#message-profile-btn")?.addEventListener("click", () => {
    state.activeChatUserId = userId;
    navigate("messages");
  });

  bindPostActions(root);
}

/* =====================================
   EDIT PROFILE
===================================== */

function openEditProfile() {
  const profile = state.profile || {};

  openModal(`
    <div class="modal-header">
      <h2>Edit profile</h2>
      <button class="icon-btn" data-close-modal>×</button>
    </div>

    <form id="edit-profile-form" class="stack">
      <label>Full name
        <input class="field" id="profile-full-name" maxlength="80"
          value="${escapeHTML(profile.full_name || "")}">
      </label>

      <label>Username
        <input class="field" id="profile-username" maxlength="30"
          value="${escapeHTML(profile.username || "")}" disabled>
      </label>

      <label>Profile photo URL
        <input class="field" id="profile-avatar" type="url"
          value="${escapeHTML(profile.avatar_url || "")}"
          placeholder="https://example.com/photo.jpg">
      </label>

      <label>Bio
        <textarea class="field" id="profile-bio" maxlength="250"
          placeholder="Write something about yourself...">${safeText(profile.bio || "")}</textarea>
      </label>

      <button class="btn primary" type="submit">Save profile</button>
    </form>
  `);

  $("#edit-profile-form")?.addEventListener("submit", async event => {
    event.preventDefault();

    const updated = {
      full_name: $("#profile-full-name").value.trim(),
      avatar_url: $("#profile-avatar").value.trim() || null,
      bio: $("#profile-bio").value.trim()
    };

    try {
      const { error } = await state.client
        .from("profiles")
        .update(updated)
        .eq("id", state.user.id);

      if (error) throw error;

      state.profile = { ...state.profile, ...updated };

      closeModal();
      toast("Profile updated.", "success");
      await renderPage();
    } catch (error) {
      toast(friendlyError(error), "error");
    }
  });
}

/* =====================================
   FOLLOW / UNFOLLOW
===================================== */

async function toggleFollow(targetId, currentlyFollowing) {
  if (!requireLogin()) return;

  if (targetId === state.user.id) return;

  try {
    if (currentlyFollowing) {
      const { error } = await state.client
        .from("follows")
        .delete()
        .eq("follower_id", state.user.id)
        .eq("following_id", targetId);

      if (error) throw error;
    } else {
      const { error } = await state.client
        .from("follows")
        .insert({
          follower_id: state.user.id,
          following_id: targetId
        });

      if (error) throw error;
    }

    toast(currentlyFollowing ? "Unfollowed." : "Following.", "success");
    await renderPage();
  } catch (error) {
    console.error("Follow operation failed:", error);
    toast(friendlyError(error), "error");
  }
}

/* =====================================
   NOTIFICATIONS
===================================== */

async function renderNotifications(root) {
  const { data, error } = await state.client
    .from("notifications")
    .select("*")
    .eq("user_id", state.user.id)
    .order("created_at", { ascending: false })
    .limit(50);

  if (error) {
    root.innerHTML = `
      <div class="card empty-state">
        <h2>Notifications</h2>
        <p>Notifications are not available yet. Check your database setup.</p>
      </div>
    `;
    return;
  }

  root.innerHTML = `
    <div class="page-heading">
      <h1>Notifications</h1>
      <button class="btn" id="mark-notifications-read">Mark all read</button>
    </div>

    <div class="stack">
      ${data?.length
        ? data.map(item => `
          <div class="card notification-item">
            <div class="row">
              <div class="grow">
                <p>${safeText(item.message || item.type || "New notification")}</p>
                <small class="muted">${escapeHTML(timeAgo(item.created_at))}</small>
              </div>
              ${item.is_read ? "" : `<span class="badge">New</span>`}
            </div>
          </div>
        `).join("")
        : `<div class="card empty-state"><h3>You're all caught up</h3><p>No notifications yet.</p></div>`
      }
    </div>
  `;

  $("#mark-notifications-read")?.addEventListener("click", async () => {
    const { error: updateError } = await state.client
      .from("notifications")
      .update({ is_read: true })
      .eq("user_id", state.user.id);

    if (updateError) {
      toast(friendlyError(updateError), "error");
      return;
    }

    toast("Notifications marked as read.", "success");
    await renderNotifications(root);
  });
}

/* =====================================
   SAVED POSTS
===================================== */

async function renderSaved(root) {
  const { data: saved, error } = await state.client
    .from("saved_posts")
    .select("post_id, created_at")
    .eq("user_id", state.user.id)
    .order("created_at", { ascending: false })
    .limit(50);

  if (error) {
    root.innerHTML = `
      <div class="card empty-state">
        <h2>Saved posts</h2>
        <p>Saved posts are not available yet. Check your database setup.</p>
      </div>
    `;
    return;
  }

  const ids = (saved || []).map(item => item.post_id);

  if (!ids.length) {
    root.innerHTML = `
      <div class="page-heading"><h1>Saved posts</h1></div>
      <div class="card empty-state">
        <div class="empty-icon">▣</div>
        <h3>No saved posts</h3>
        <p>Save posts to find them here later.</p>
      </div>
    `;
    return;
  }

  const { data: posts, error: postsError } = await state.client
    .from("posts")
    .select("*")
    .in("id", ids);

  if (postsError) {
    root.innerHTML = `<div class="card empty-state"><p>Could not load saved posts.</p></div>`;
    return;
  }

  const orderedPosts = ids
    .map(id => posts.find(post => String(post.id) === String(id)))
    .filter(Boolean);

  root.innerHTML = `
    <div class="page-heading"><h1>Saved posts</h1></div>
    <div class="feed-list">${orderedPosts.map(postHTML).join("")}</div>
  `;

  bindPostActions(root);
}

/* =====================================
   CREATE POST
===================================== */

function openCreatePost() {
  if (!requireLogin()) return;

  openModal(`
    <div class="modal-header">
      <h2>Create post</h2>
      <button class="icon-btn" data-close-modal>×</button>
    </div>

    <form id="create-post-form" class="stack">
      <label>Media URL
        <input class="field" type="url" id="new-post-media"
          placeholder="https://example.com/image.jpg">
      </label>

      <label>Caption
        <textarea class="field" id="new-post-caption" maxlength="2200"
          placeholder="What would you like to share?"></textarea>
      </label>

      <button class="btn primary" type="submit">Publish post</button>
    </form>
  `);

  $("#create-post-form")?.addEventListener("submit", async event => {
    event.preventDefault();

    const mediaUrl = $("#new-post-media").value.trim();
    const caption = $("#new-post-caption").value.trim();

    if (!mediaUrl && !caption) {
      toast("Add a caption or media URL.", "warning");
      return;
    }

    try {
      const { error } = await state.client
        .from("posts")
        .insert({
          user_id: state.user.id,
          media_url: mediaUrl || null,
          caption
        });

      if (error) throw error;

      closeModal();
      toast("Post published.", "success");
      navigate("home");
    } catch (error) {
      console.error("Create post failed:", error);
      toast(friendlyError(error), "error");
    }
  });
}

/* =====================================
   REQUIRE LOGIN
===================================== */

function requireLogin() {
  if (state.user && state.client) return true;

  toast("Please log in first.", "warning");
  renderAuth();
  return false;
}

/* =====================================
   LOG OUT
===================================== */

async function logout() {
  if (!confirm("Log out of Gromazeef?")) return;

  try {
    if (state.client) {
      await state.client.auth.signOut();
    }
  } catch (error) {
    console.warn("Sign-out warning:", error);
  }

  state.user = null;
  state.profile = null;
  state.feed = [];
  state.likedPostIds = new Set();
  state.savedPostIds = new Set();
  state.activeProfileId = null;

  closeModal();
  renderAuth();
  toast("Logged out.", "success");
}

/* =====================================
   REFRESH / MODAL HELPERS
===================================== */

function startRefresh() {
  if (state.refreshTimer) {
    clearInterval(state.refreshTimer);
  }

  state.refreshTimer = setInterval(() => {
    if (state.user && document.visibilityState === "visible") {
      renderPage().catch(error => console.warn("Refresh failed:", error));
    }
  }, 60000);
}

function openModal(html) {
  closeModal();

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "active-modal";

  overlay.innerHTML = `
    <div class="modal-panel" role="dialog" aria-modal="true">
      ${html}
    </div>
  `;

  overlay.addEventListener("click", event => {
    if (event.target === overlay || event.target.closest("[data-close-modal]")) {
      closeModal();
    }
  });

  document.body.appendChild(overlay);
}

function closeModal() {
  document.getElementById("active-modal")?.remove();
}

/* =====================================
   FRIENDLY ERROR HELPERS
===================================== */

function friendlyError(error) {
  const message = String(error?.message || "");

  if (/duplicate key|already exists/i.test(message)) {
    return "This item already exists.";
  }

  if (/row-level security|permission denied|not allowed/i.test(message)) {
    return "Database permission issue. Check Supabase access policies.";
  }

  if (/network|fetch/i.test(message)) {
    return "Network problem. Check your internet and try again.";
  }

  return message || "Something went wrong. Please try again.";
}

function safeText(value) {
  return escapeHTML(String(value ?? ""));
}

function timeAgo(dateValue) {
  if (!dateValue) return "Recently";

  const date = new Date(dateValue);
  if (Number.isNaN(date.getTime())) return "Recently";

  const seconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));

  if (seconds < 60) return "Just now";
  if (seconds < 3600) return Math.floor(seconds / 60) + "m ago";
  if (seconds < 86400) return Math.floor(seconds / 3600) + "h ago";
  if (seconds < 604800) return Math.floor(seconds / 86400) + "d ago";

  return date.toLocaleDateString();
}

/* =====================================
   STARTUP
===================================== */

async function bootstrap() {
  const app = document.getElementById("app");
  console.log("GROMAZEEF BOOTSTRAP STARTED");
  if (!app) {
    console.error("Gromazeef app container is missing.");
    return;
  }

  if (typeof SUPABASE_ANON_KEY === "undefined" ||
      !SUPABASE_ANON_KEY ||
      SUPABASE_ANON_KEY.includes("sb_publishable_Y2J7myGmTRSrRGN5PxnbYg_m07KlrmB")) {
    app.innerHTML = `
      <div class="auth-screen">
        <div class="auth-card">
          <h1>Gromazeef setup</h1>
          <p>Supabase public anon/publishable key is missing.</p>
          <p>Open the JavaScript core section and replace the placeholder with your project's public key.</p>
          <p class="muted">Never put your Supabase service_role key in a public website.</p>
        </div>
      </div>
    `;
    return;
  }

  try {
    state.client = createClient();

    if (!state.client) {
      throw new Error("Supabase client could not be initialized.");
    }
app.innerHTML = `
  <div class="auth-screen">
    <div class="auth-card">
      <h1>Gromazeef</h1>
      <p>Supabase connected. Checking login session...</p>
    </div>
  </div>
`;
    const { data } = await state.client.auth.getSession();

    if (data?.session?.user) {
      state.user = data.session.user;
      await ensureProfile();
      await renderShell();
      await renderPage();
      startRefresh();
    } else {
      renderAuth();
    }

    state.client.auth.onAuthStateChange(async (_event, session) => {
      if (session?.user && !state.user) {
        state.user = session.user;

        try {
          await ensureProfile();
          await renderShell();
          await renderPage();
          startRefresh();
        } catch (error) {
          console.error("Session initialization failed:", error);
          toast("Could not load your account.", "error");
        }
      } else if (!session?.user && state.user) {
        state.user = null;
        state.profile = null;
        renderAuth();
      }
    });
  } catch (error) {
    console.error("Gromazeef startup failed:", error);

    app.innerHTML = `
      <div class="auth-screen">
        <div class="auth-card">
          <h1>Gromazeef</h1>
          <p>Unable to connect to Supabase.</p>
          <p class="muted">${safeText(error.message)}</p>
          <button class="btn primary" onclick="location.reload()">Try again</button>
        </div>
      </div>
    `;
  }
}

document.addEventListener("DOMContentLoaded", () => {
  bootstrap().catch(error => {
    console.error("Unexpected startup error:", error);
  });
});
