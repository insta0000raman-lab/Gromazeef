<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c0b12">
<meta name="description" content="Gromozeef — Share your world.">
<title>Gromozeef</title>

<style>
:root {
    --bg: #0c0b12;
    --panel: #15141d;
    --panel2: #1c1a26;
    --text: #f8f7ff;
    --muted: #9995aa;
    --purple: #9b6bff;
    --pink: #ff5ca8;
    --blue: #6ca8ff;
    --border: rgba(255,255,255,.09);
    --radius: 18px;
    --bottom-height: 65px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
    overflow-x: hidden;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    color: inherit;
    cursor: pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
    outline: 2px solid var(--purple);
    outline-offset: 3px;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

input,
textarea,
select {
    color: var(--text);
}

a {
    color: inherit;
    text-decoration: none;
}

img,
video {
    max-width: 100%;
}

.hidden {
    display: none !important;
}

.muted {
    color: var(--muted);
}

.small {
    font-size: 12px;
}

.primary-button {
    width: 100%;
    min-height: 47px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(110deg, #8858ff, #bc58e9);
    color: white;
    font-weight: 750;
    transition: filter .2s, transform .2s;
}

.primary-button:hover {
    filter: brightness(1.12);
}

.primary-button:active {
    transform: scale(.985);
}

.secondary-button {
    min-height: 42px;
    padding: 0 15px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel2);
}

.text-button {
    border: none;
    background: transparent;
    color: var(--purple);
    font-weight: 650;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
}

.field label {
    color: #d9d5e7;
    font-size: 13px;
    font-weight: 650;
}

.field input,
.field textarea,
.field select {
    width: 100%;
    min-height: 49px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #100f17;
    outline: none;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
    border-color: var(--purple);
}

.field textarea {
    min-height: 100px;
    resize: vertical;
}

.field input::placeholder,
.field textarea::placeholder {
    color: #777286;
}

.brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 25px;
    font-weight: 900;
    letter-spacing: -1.2px;
}

.brand-mark {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 13px;
    background: linear-gradient(135deg, #8858ff, #fa58b2);
    box-shadow: 0 5px 25px rgba(155,107,255,.23);
    color: white;
    font-size: 22px;
}

.brand-name {
    background: linear-gradient(100deg, #fff, #bd9cff 65%, #ff8dc9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.language-control {
    position: relative;
}

.language-button {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 40px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    font-size: 13px;
}

.language-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 100;
    width: 155px;
    padding: 6px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: #201d2c;
    box-shadow: 0 15px 40px #0008;
}

.language-option {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 9px;
    background: transparent;
    text-align: left;
}

.language-option:hover,
.language-option.active {
    background: #353047;
}

#authScreen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.auth-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 22px clamp(18px, 5vw, 70px);
}

.auth-main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 24px 18px 55px;
}

.auth-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(300px, 420px);
    align-items: center;
    gap: clamp(35px, 7vw, 100px);
    width: min(100%, 950px);
}

.auth-intro {
    padding: 20px 0;
}

.intro-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 22px;
    padding: 9px 13px;
    border: 1px solid #9b6bff44;
    border-radius: 30px;
    background: #9b6bff12;
    color: #c8adff;
    font-size: 12px;
    font-weight: 700;
}

.auth-intro h1 {
    max-width: 480px;
    margin-bottom: 18px;
    font-size: clamp(36px, 5vw, 61px);
    line-height: 1.08;
    letter-spacing: -2.5px;
}

.gradient-text {
    background: linear-gradient(100deg, #a98aff, #ff81c0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.auth-intro p {
    max-width: 410px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.8;
}

.intro-points {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 25px;
}

.intro-point {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff05;
    color: #d9d3ed;
    font-size: 12px;
}

.auth-card {
    width: 100%;
    padding: clamp(22px, 4vw, 34px);
    border: 1px solid var(--border);
    border-radius: 23px;
    background: linear-gradient(145deg, #191722, #121119);
    box-shadow: 0 25px 90px #0004;
}

.auth-card h2 {
    margin-bottom: 8px;
    font-size: 26px;
    letter-spacing: -.7px;
}

.auth-description {
    margin-bottom: 25px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
}

.auth-links {
    display: flex;
    justify-content: flex-end;
    margin: -3px 0 20px;
    font-size: 13px;
}

.auth-switch {
    margin-top: 23px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    text-align: center;
}

.auth-switch button {
    margin-left: 4px;
}

.auth-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--muted);
    font-size: 11px;
}

.auth-divider::before,
.auth-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
}

.google-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    min-height: 46px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: transparent;
    font-weight: 650;
}

.google-symbol {
    font-size: 19px;
    font-weight: 900;
    color: #8eb4ff;
}

.auth-footer {
    padding: 20px;
    color: #777286;
    font-size: 11px;
    text-align: center;
}

.step-indicator {
    display: flex;
    gap: 6px;
    margin: 18px 0 25px;
}

.step-indicator span {
    flex: 1;
    height: 4px;
    border-radius: 10px;
    background: #302d3c;
}

.step-indicator span.active {
    background: linear-gradient(90deg, #8858ff, #e66bcb);
}

.account-avatar {
    display: grid;
    place-items: center;
    width: 70px;
    height: 70px;
    margin: 0 auto 15px;
    border: 2px solid #b18aff;
    border-radius: 50%;
    background: #282139;
    font-size: 28px;
}

#appScreen {
    min-height: 100vh;
}

.app-header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    min-height: 66px;
    padding: 10px clamp(14px, 4vw, 48px);
    border-bottom: 1px solid var(--border);
    background: #0c0b12ee;
    backdrop-filter: blur(20px);
}

.app-header .brand {
    font-size: 21px;
}

.app-header .brand-mark {
    width: 33px;
    height: 33px;
    font-size: 19px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 9px;
}

.icon-button {
    position: relative;
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border: 1px solid transparent;
    border-radius: 14px;
    background: transparent;
    font-size: 21px;
}

.icon-button:hover {
    background: var(--panel2);
}

.notification-dot {
    position: absolute;
    top: 7px;
    right: 7px;
    width: 8px;
    height: 8px;
    border: 2px solid var(--bg);
    border-radius: 50%;
    background: var(--pink);
}

.app-layout {
    display: grid;
    grid-template-columns: 235px minmax(0, 650px) 280px;
    justify-content: center;
    gap: 25px;
    max-width: 1240px;
    margin: 0 auto;
    padding: 25px 20px 90px;
}

.left-sidebar {
    position: sticky;
    top: 90px;
    align-self: start;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.sidebar-link {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    min-height: 48px;
    padding: 0 13px;
    border: none;
    border-radius: 13px;
    background: transparent;
    color: #c7c2d5;
    text-align: left;
}

.sidebar-link.active,
.sidebar-link:hover {
    background: #a77aff15;
    color: white;
}

.sidebar-link.active {
    font-weight: 750;
}

.sidebar-icon {
    display: grid;
    place-items: center;
    width: 27px;
    font-size: 20px;
}

.sidebar-divider {
    height: 1px;
    margin: 13px 0;
    background: var(--border);
}

.sidebar-caption {
    padding: 0 13px 8px;
    color: #777286;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.main-feed {
    min-width: 0;
}

.stories-card {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding: 17px 15px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--panel);
    scrollbar-width: none;
}

.stories-card::-webkit-scrollbar {
    display: none;
}

.story-item {
    display: flex;
    flex: 0 0 65px;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    border: none;
    background: transparent;
}

.story-ring {
    display: grid;
    place-items: center;
    width: 61px;
    height: 61px;
    padding: 3px;
    border-radius: 50%;
    background: linear-gradient(135deg, #9b6bff, #ff5ca8, #ffbc6c);
}

.story-ring.seen {
    background: #4b4758;
}

.story-avatar {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    border: 3px solid var(--panel);
    border-radius: 50%;
    background: linear-gradient(135deg, #302443, #22243a);
    font-size: 23px;
}

.story-name {
    width: 72px;
    overflow: hidden;
    color: #d4d0e1;
    font-size: 10px;
    text-align: center;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.feed-tabs {
    display: flex;
    gap: 23px;
    margin: 20px 0 15px;
    padding: 0 5px;
    border-bottom: 1px solid var(--border);
}

.feed-tab {
    position: relative;
    padding: 0 0 13px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 650;
}

.feed-tab.active {
    color: white;
}

.feed-tab.active::after {
    position: absolute;
    right: 0;
    bottom: -1px;
    left: 0;
    height: 2px;
    border-radius: 5px;
    background: var(--purple);
    content: "";
}

.content-card {
    overflow: hidden;
    margin-bottom: 22px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--panel);
}

.content-header {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 14px;
}

.content-user-avatar {
    display: grid;
    flex-shrink: 0;
    place-items: center;
    width: 42px;
    height: 42px;
    border: 1px solid #a77aff70;
    border-radius: 50%;
    background: linear-gradient(135deg, #302443, #342343);
    font-size: 20px;
}

.content-user-info {
    flex: 1;
    min-width: 0;
}

.content-user-name {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
    font-size: 13px;
    font-weight: 800;
}

.verified-badge {
    color: #83adff;
    font-size: 12px;
}

.content-subtitle {
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
}

.follow-button {
    padding: 7px 12px;
    border: 1px solid #9b6bff66;
    border-radius: 10px;
    background: #9b6bff14;
    color: #c5aaff;
    font-size: 11px;
    font-weight: 750;
}

.follow-button.following {
    border-color: var(--border);
    background: var(--panel2);
    color: #d7d1e6;
}

.content-media {
    position: relative;
    display: grid;
    place-items: center;
    overflow: hidden;
    min-height: 260px;
    aspect-ratio: 4 / 4.4;
    background:
        radial-gradient(ellipse at 20% 25%, #7352ad88, transparent 45%),
        radial-gradient(ellipse at 80% 75%, #c04d8b55, transparent 40%),
        linear-gradient(140deg, #21192e, #151724 60%, #30203a);
}

.content-media.landscape {
    aspect-ratio: 4 / 3;
}

.content-media img,
.content-media video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.media-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 30px;
    text-align: center;
}

.media-placeholder-icon {
    font-size: 55px;
}

.media-placeholder strong {
    font-size: 20px;
}

.media-placeholder p {
    max-width: 270px;
    color: #c1b8d6;
    font-size: 12px;
    line-height: 1.7;
}

.content-actions {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 10px 10px 3px;
}

.content-action {
    display: grid;
    place-items: center;
    min-width: 38px;
    min-height: 38px;
    padding: 5px;
    border: none;
    border-radius: 10px;
    background: transparent;
    font-size: 22px;
}

.content-action:hover {
    background: #ffffff08;
}

.content-action.liked {
    color: #ff5b91;
}

.content-action.saved {
    color: #bb9aff;
}

.content-action.push-right {
    margin-left: auto;
}

.content-description {
    padding: 5px 14px 16px;
    font-size: 12px;
    line-height: 1.7;
}

.content-description strong {
    margin-right: 5px;
}

.growtag {
    color: #b799ff;
}

.content-meta {
    margin-top: 9px;
    color: var(--muted);
    font-size: 10px;
}

.right-sidebar {
    position: sticky;
    top: 90px;
    align-self: start;
}

.mini-profile {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 0 22px;
}

.mini-profile .content-user-avatar {
    width: 48px;
    height: 48px;
}

.mini-profile-info {
    flex: 1;
    min-width: 0;
}

.mini-profile-info strong {
    font-size: 12px;
}

.mini-profile-info p {
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
}

.section-card {
    margin-bottom: 17px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 17px;
    background: var(--panel);
}

.section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
    font-size: 13px;
    font-weight: 800;
}

.section-heading button {
    border: none;
    background: transparent;
    color: #b799ff;
    font-size: 11px;
}

.suggested-user {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 15px;
}

.suggested-user:last-child {
    margin-bottom: 0;
}

.suggested-user .content-user-avatar {
    width: 37px;
    height: 37px;
    font-size: 17px;
}

.suggested-info {
    flex: 1;
    min-width: 0;
}

.suggested-info strong {
    display: block;
    overflow: hidden;
    font-size: 11px;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.suggested-info span {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 10px;
}

.right-footer {
    padding: 10px 3px;
    color: #716c81;
    font-size: 10px;
    line-height: 2;
}

.bottom-nav {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 70;
    display: none;
    align-items: center;
    justify-content: space-around;
    min-height: var(--bottom-height);
    padding: 6px 7px env(safe-area-inset-bottom);
    border-top: 1px solid var(--border);
    background: #111019f5;
    backdrop-filter: blur(20px);
}

.bottom-nav button {
    display: flex;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 49px;
    border: none;
    border-radius: 11px;
    background: transparent;
    color: #a8a2b8;
    font-size: 19px;
}

.bottom-nav button.active {
    color: #c6aaff;
}

.bottom-nav small {
    font-size: 9px;
}

.upload-nav-button span {
    display: grid;
    place-items: center;
    width: 34px;
    height: 30px;
    border-radius: 10px;
    background: linear-gradient(120deg, #8858ff, #e45bc5);
    color: white;
    font-size: 23px;
}

.page-container {
    min-width: 0;
}

.page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 20px;
}

.page-header h1 {
    font-size: 25px;
    letter-spacing: -.7px;
}

.page-header p {
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
}

.empty-state {
    padding: 45px 20px;
    border: 1px dashed #454052;
    border-radius: 17px;
    color: var(--muted);
    text-align: center;
}

.empty-state .empty-icon {
    margin-bottom: 12px;
    font-size: 38px;
}

.empty-state h3 {
    margin-bottom: 8px;
    color: var(--text);
}

.empty-state p {
    font-size: 12px;
    line-height: 1.7;
}

.toast-root {
    position: fixed;
    right: 16px;
    bottom: 85px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.toast {
    max-width: min(340px, calc(100vw - 32px));
    padding: 13px 16px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: #242031;
    box-shadow: 0 10px 35px #0006;
    font-size: 12px;
    animation: toast-in .2s ease-out;
}

@keyframes toast-in {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 1050px) {
    .app-layout {
        grid-template-columns: 190px minmax(0, 650px);
    }

    .right-sidebar {
        display: none;
    }
}

@media (max-width: 700px) {
    .auth-topbar {
        padding: 17px;
    }

    .brand {
        font-size: 22px;
    }

    .auth-layout {
        display: block;
        width: min(100%, 420px);
    }

    .auth-intro {
        display: none;
    }

    .auth-main {
        align-items: start;
        padding: 30px 16px 45px;
    }

    .auth-card {
        padding: 25px 20px;
    }

    .app-header {
        min-height: 59px;
        padding: 8px 13px;
    }

    .app-header .brand {
        font-size: 19px;
    }

    .app-header .brand-mark {
        width: 30px;
        height: 30px;
    }

    .header-actions {
        gap: 1px;
    }

    .header-actions .icon-button {
        width: 37px;
        height: 37px;
        font-size: 20px;
    }

    .app-layout {
        display: block;
        padding: 12px 0 85px;
    }

    .left-sidebar,
    .right-sidebar {
        display: none;
    }

const GROMOZEEF_STORAGE = {
    read(key, fallback = []) {
        try {
            const value = localStorage.getItem(key);
            return value === null ? fallback : JSON.parse(value);
        } catch (error) {
            return fallback;
        }
    },

    write(key, value) {
        try {
            localStorage.setItem(key, JSON.stringify(value));
            return true;
        } catch (error) {
            return false;
        }
    },

    remove(key) {
        try {
            localStorage.removeItem(key);
        } catch (error) {
            console.warn("Storage unavailable");
        }
    }
};

GROMOZEEF_APP.renderSignupStep = function () {
    const root = GROMOZEEF_UTILS.select("#authContent");
    const step = this.signupStep;

    const steps = [
        "Choose username",
        "Create password",
        "Verify email",
        "Profile photo"
    ];

    root.replaceChildren();

    const heading = GROMOZEEF_UTILS.create(
        "h2",
        "",
        steps[step - 1] || "Create account"
    );

    const description = GROMOZEEF_UTILS.create(
        "p",
        "auth-description",
        "Create your Gromozeef account step by step."
    );

    root.appendChild(heading);
    root.appendChild(description);

    const indicator = GROMOZEEF_UTILS.create(
        "div",
        "step-indicator"
    );

    for (let index = 1; index <= 4; index++) {
        const bar = GROMOZEEF_UTILS.create("span");

        if (index <= step) {
            bar.classList.add("active");
        }

        indicator.appendChild(bar);
    }

    root.appendChild(indicator);

    const form = GROMOZEEF_UTILS.create("form");
    form.id = "signupStepForm";

    if (step === 1) {
        const usernameField = this.createField(
            "signupUsername",
            "Username",
            "Choose a unique username",
            "text"
        );

        usernameField.input.autocomplete = "username";
        usernameField.input.minLength = 3;
        usernameField.input.maxLength = 30;
        usernameField.input.pattern = "[A-Za-z0-9_.]+";
        usernameField.input.value =
            GROMOZEEF_STATE.signup.username;

        const status = GROMOZEEF_UTILS.create(
            "p",
            "small muted",
            "Use 3–30 letters, numbers, dots or underscores."
        );

        status.id = "usernameAvailability";

        form.appendChild(usernameField.wrapper);
        form.appendChild(status);

        let checkTimer;

        usernameField.input.addEventListener("input", () => {
            const username = usernameField.input.value
                .trim()
                .toLowerCase();

            GROMOZEEF_STATE.signup.username = username;

            status.textContent = "Checking username...";
            status.style.color = "var(--muted)";

            clearTimeout(checkTimer);

            checkTimer = setTimeout(() => {
                if (!/^[a-z0-9_.]{3,30}$/.test(username)) {
                    status.textContent =
                        "Username must contain 3–30 valid characters.";
                    status.style.color = "#ff829c";
                    return;
                }

                const exists = this.demoAccounts.some(account =>
                    account.username === username
                );

                if (exists) {
                    status.textContent =
                        "Username is already used in this demo.";
                    status.style.color = "#ff829c";
                } else {
                    status.textContent =
                        "Username is available in this demo.";
                    status.style.color = "#79e5b1";
                }
            }, 350);
        });
    }

    if (step === 2) {
        const passwordField = this.createField(
            "signupPassword",
            "Password",
            "Create a strong password",
            "password"
        );

        passwordField.input.autocomplete = "new-password";
        passwordField.input.minLength = 8;
        passwordField.input.required = true;

        const confirmField = this.createField(
            "signupConfirmPassword",
            "Confirm password",
            "Enter the same password again",
            "password"
        );

        confirmField.input.autocomplete = "new-password";
        confirmField.input.required = true;

        form.appendChild(passwordField.wrapper);
        form.appendChild(confirmField.wrapper);

        const hint = GROMOZEEF_UTILS.create(
            "p",
            "small muted",
            "Use at least 8 characters. Avoid reusing passwords."
        );

        form.appendChild(hint);

        passwordField.input.addEventListener("input", () => {
            GROMOZEEF_STATE.signup.password =
                passwordField.input.value;
        });

        form.addEventListener("submit", event => {
            event.preventDefault();

            const password = passwordField.input.value;
            const confirm = confirmField.input.value;

            if (password.length < 8) {
                this.toast(
                    "Password mein kam se kam 8 characters hone chahiye."
                );
                return;
            }

            if (password !== confirm) {
                this.toast("Dono passwords match nahi karte.");
                return;
            }

            GROMOZEEF_STATE.signup.password = password;
            this.signupStep = 3;
            this.renderSignupStep();
        }, { once: true });
    }

    if (step === 3) {
        const emailField = this.createField(
            "signupEmail",
            "Email address",
            "you@example.com",
            "email"
        );

        emailField.input.autocomplete = "email";
        emailField.input.required = true;
        emailField.input.value =
            GROMOZEEF_STATE.signup.email;

        form.appendChild(emailField.wrapper);

        const explanation = GROMOZEEF_UTILS.create(
            "p",
            "small muted",
            "A real verification email requires a connected authentication backend."
        );

        explanation.style.lineHeight = "1.7";
        explanation.style.marginBottom = "15px";

        form.appendChild(explanation);

        const emailActions = GROMOZEEF_UTILS.create("div");

        emailActions.style.display = "grid";
        emailActions.style.gap = "12px";

        const sendButton = GROMOZEEF_UTILS.create(
            "button",
            "primary-button",
            "Continue with email"
        );

        sendButton.type = "submit";

        emailActions.appendChild(sendButton);
        form.appendChild(emailActions);

        form.addEventListener("submit", event => {
            event.preventDefault();

            const email = emailField.input.value
                .trim()
                .toLowerCase();

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                this.toast("Valid email address enter karo.");
                return;
            }

            const exists = this.demoAccounts.some(account =>
                account.email === email
            );

            if (exists) {
                this.toast(
                    "Ye email is demo mein pehle se use ho rahi hai."
                );
                return;
            }

            GROMOZEEF_STATE.signup.email = email;

            this.renderEmailVerification();
        }, { once: true });
    }

    if (step === 4) {
        const avatarLabel = GROMOZEEF_UTILS.create(
            "p",
            "muted small",
            "Choose a profile photo or skip for now."
        );

        avatarLabel.style.marginBottom = "15px";

        const avatarPreview = GROMOZEEF_UTILS.create(
            "div",
            "account-avatar",
            GROMOZEEF_STATE.signup.avatar || "👤"
        );

        avatarPreview.id = "signupAvatarPreview";

        const avatarInput = GROMOZEEF_UTILS.create("input");

        avatarInput.type = "file";
        avatarInput.accept = "image/*";
        avatarInput.id = "signupAvatarInput";
        avatarInput.hidden = true;

        const chooseAvatar = GROMOZEEF_UTILS.create(
            "button",
            "secondary-button",
            "Choose profile photo"
        );

        chooseAvatar.type = "button";
        chooseAvatar.style.width = "100%";

        chooseAvatar.addEventListener("click", () => {
            avatarInput.click();
        });

        avatarInput.addEventListener("change", () => {
            const file = avatarInput.files[0];

            if (!file) {
                return;
            }

            if (!file.type.startsWith("image/")) {
                this.toast("Image file select karo.");
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                this.toast("Demo mein photo maximum 5 MB ho sakti hai.");
                return;
            }

            const reader = new FileReader();

            reader.onload = () => {
                GROMOZEEF_STATE.signup.avatar =
                    String(reader.result);

                avatarPreview.textContent = "";

                const image = document.createElement("img");

                image.src = reader.result;
                image.alt = "Profile preview";
                image.style.width = "100%";
                image.style.height = "100%";
                image.style.objectFit = "cover";
                image.style.borderRadius = "50%";

                avatarPreview.appendChild(image);
            };

            reader.readAsDataURL(file);
        });

        const skipButton = GROMOZEEF_UTILS.create(
            "button",
            "text-button",
            "Skip for now"
        );

        skipButton.type = "button";
        skipButton.style.width = "100%";
        skipButton.style.marginTop = "14px";

        skipButton.addEventListener("click", () => {
            GROMOZEEF_STATE.signup.avatar = "";
            this.finishSignup();
        });

        form.appendChild(avatarLabel);
        form.appendChild(avatarPreview);
        form.appendChild(avatarInput);
        form.appendChild(chooseAvatar);
        form.appendChild(skipButton);
    }

    if (step !== 2 && step !== 3 && step !== 4) {
        form.addEventListener("submit", event => {
            event.preventDefault();

            if (step === 1) {
                const username =
                    GROMOZEEF_STATE.signup.username;

                if (!/^[a-z0-9_.]{3,30}$/.test(username)) {
                    this.toast("Valid username choose karo.");
                    return;
                }

                if (this.demoAccounts.some(account =>
                    account.username === username
                )) {
                    this.toast("Username already used hai.");
                    return;
                }

                this.signupStep = 2;
                this.renderSignupStep();
            }
        }, { once: true });
    }

    if (step !== 4) {
        const nextButton = GROMOZEEF_UTILS.create(
            "button",
            "primary-button",
            step === 3 ? "Continue" : "Next"
        );

        nextButton.type = "submit";
        nextButton.style.marginTop = "20px";

        form.appendChild(nextButton);
    } else {
        const finishButton = GROMOZEEF_UTILS.create(
            "button",
            "primary-button",
            "Finish setup"
        );

        finishButton.type = "button";
        finishButton.style.marginTop = "20px";

        finishButton.addEventListener("click", () => {
            this.finishSignup();
        });

        form.appendChild(finishButton);
    }

    root.appendChild(form);

    const switchRow = GROMOZEEF_UTILS.create("div", "auth-switch");

    switchRow.appendChild(
        document.createTextNode("Already have an account? ")
    );

    const loginButton = GROMOZEEF_UTILS.create(
        "button",
        "text-button",
        "Log in"
    );

    loginButton.type = "button";

    loginButton.addEventListener("click", () => {
        this.showLoginForm();
    });

    switchRow.appendChild(loginButton);
    root.appendChild(switchRow);
};

GROMOZEEF_APP.finishSignup = function () {
    const signup = GROMOZEEF_STATE.signup;

    if (!signup.username || !signup.password || !signup.email) {
        this.toast("Signup details incomplete hain.");
        return;
    }

    if (this.demoAccounts.some(account =>
        account.username === signup.username
    )) {
        this.toast("Username already used hai.");
        this.signupStep = 1;
        this.renderSignupStep();
        return;
    }

    const account = {
        id: GROMOZEEF_UTILS.makeId("user"),
        username: signup.username,
        password: signup.password,
        email: signup.email,
        displayName: signup.username,
        bio: "Sharing ideas, moments and creativity.",
        avatar: signup.avatar || "👤",
        createdAt: new Date().toISOString(),
        emailVerified: false,
        accountType: "personal"
    };

    this.demoAccounts.push(account);

    if (!this.saveAccounts()) {
        this.demoAccounts.pop();

        this.toast(
            "Browser storage unavailable. Account save nahi hua."
        );

        return;
    }

    this.setActiveAccount(account);

    this.toast(
        "Demo account created. Email abhi verify nahi hui."
    );
};

GROMOZEEF_APP.createPostCard = function (post) {
    const card = GROMOZEEF_UTILS.create(
        "article",
        "post-card"
    );

    card.dataset.postId = post.id;

    const header = GROMOZEEF_UTILS.create(
        "div",
        "post-header"
    );

    const avatar = GROMOZEEF_UTILS.create(
        "div",
        "post-avatar",
        post.avatar || "👤"
    );

    const identity = GROMOZEEF_UTILS.create(
        "div",
        "post-identity"
    );

    const username = GROMOZEEF_UTILS.create(
        "strong",
        "",
        "@" + post.username
    );

    const subtitle = GROMOZEEF_UTILS.create(
        "span",
        "muted small",
        post.type === "zeef" ? "ZEEF" : "GROM"
    );

    identity.appendChild(username);
    identity.appendChild(subtitle);

    const menu = GROMOZEEF_UTILS.create(
        "button",
        "icon-button",
        "⋯"
    );

    menu.type = "button";
    menu.dataset.action = "post-menu";
    menu.dataset.postId = post.id;
    menu.setAttribute("aria-label", "Post options");

    header.appendChild(avatar);
    header.appendChild(identity);
    header.appendChild(menu);

    const media = GROMOZEEF_UTILS.create(
        "div",
        "post-media"
    );

    if (post.media) {
        const isVideo =
            post.mediaType === "video" ||
            /\.(mp4|webm|mov)(\?|$)/i.test(post.media);

        const mediaElement = document.createElement(
            isVideo ? "video" : "img"
        );

        mediaElement.src = post.media;

        if (isVideo) {
            mediaElement.controls = true;
            mediaElement.playsInline = true;
        } else {
            mediaElement.alt = post.caption || "Gromozeef post";
            mediaElement.loading = "lazy";
        }

        media.appendChild(mediaElement);
    } else {
        const placeholder = GROMOZEEF_UTILS.create(
            "div",
            "demo-media-placeholder"
        );

        placeholder.textContent =
            post.type === "zeef" ? "▶ ZEEF" : "◈ GROM";

        media.appendChild(placeholder);
    }

    const caption = GROMOZEEF_UTILS.create(
        "p",
        "post-caption"
    );

    const captionUser = GROMOZEEF_UTILS.create(
        "strong",
        "",
        "@" + post.username + " "
    );

    const captionText = GROMOZEEF_UTILS.create(
        "span",
        "",
        post.caption || ""
    );

    caption.appendChild(captionUser);
    caption.appendChild(captionText);

    const actions = GROMOZEEF_UTILS.create(
        "div",
        "post-actions"
    );

    const likeButton = GROMOZEEF_UTILS.create(
        "button",
        "icon-button",
        post.liked ? "♥" : "♡"
    );

    likeButton.type = "button";
    likeButton.dataset.action = "like-post";
    likeButton.dataset.postId = post.id;

    if (post.liked) {
        likeButton.classList.add("liked");
    }

    const commentButton = GROMOZEEF_UTILS.create(
        "button",
        "icon-button",
        "▢"
    );

    commentButton.type = "button";
    commentButton.dataset.action = "open-comments";
    commentButton.dataset.postId = post.id;

    const shareButton = GROMOZEEF_UTILS.create(
        "button",
        "icon-button",
        "↗"
    );

    shareButton.type = "button";
    shareButton.dataset.action = "share-post";
    shareButton.dataset.postId = post.id;

    const saveButton = GROMOZEEF_UTILS.create(
        "button",
        "icon-button",
        post.saved ? "▣" : "▢"
    );

    saveButton.type = "button";
    saveButton.dataset.action = "save-post";
    saveButton.dataset.postId = post.id;

    actions.appendChild(likeButton);
    actions.appendChild(commentButton);
    actions.appendChild(shareButton);
    actions.appendChild(saveButton);

    const likes = GROMOZEEF_UTILS.create(
        "strong",
        "post-likes",
        `${post.likes || 0} likes`
    );

    const commentCount = GROMOZEEF_UTILS.create(
        "button",
        "text-button small",
        `View comments (${(post.comments || []).length})`
    );

    commentCount.type = "button";
    commentCount.dataset.action = "open-comments";
    commentCount.dataset.postId = post.id;

    const commentForm = GROMOZEEF_UTILS.create(
        "form",
        "inline-comment-form"
    );

    const commentInput = GROMOZEEF_UTILS.create("input");

    commentInput.type = "text";
    commentInput.placeholder = "Add a comment...";
    commentInput.maxLength = 500;
    commentInput.name = "comment";

    const commentSubmit = GROMOZEEF_UTILS.create(
        "button",
        "text-button",
        "Post"
    );

    commentSubmit.type = "submit";

    commentForm.appendChild(commentInput);
    commentForm.appendChild(commentSubmit);

    commentForm.addEventListener("submit", event => {
        event.preventDefault();

        const text = commentInput.value.trim();

        if (!text) return;

        this.addComment(post.id, text);

        commentInput.value = "";
    });

    card.appendChild(header);
    card.appendChild(media);
    card.appendChild(actions);
    card.appendChild(likes);
    card.appendChild(caption);
    card.appendChild(commentCount);
    card.appendChild(commentForm);

    return card;

GROMOZEEF_APP.renderFeed = function (filter = "for-you") {
    const root = document.querySelector("#homeFeedList");

    if (!root) return;

    root.replaceChildren();

    let posts = this.getCombinedPosts();

    if (filter === "following") {
        posts = posts.filter(post =>
            this.followingUsers.has(post.username) ||
            post.username === this.getCurrentUsername()
        );
    }

    if (filter === "latest") {
        posts = [...posts].sort((a, b) =>
            (b.createdAt || 0) - (a.createdAt || 0)
        );
    }

    if (!posts.length) {
        root.appendChild(
            GROMOZEEF_UTILS.create(
                "p",
                "empty-state",
                "No posts yet. Upload your first GROM or ZEEF!"
            )
        );

        return;
    }

    posts.forEach(post => {
        root.appendChild(this.createPostCard(post));
    });
};

GROMOZEEF_APP.toggleLike = function (postId) {
    const posts = this.getAllPosts();

    const storedPost = posts.find(post =>
        post.id === postId
    );

    if (storedPost) {
        storedPost.liked = !storedPost.liked;

        storedPost.likes = Math.max(
            0,
            (storedPost.likes || 0) +
            (storedPost.liked ? 1 : -1)
        );

        this.saveAllPosts(posts);
    } else {
        const demoPost = this.demoPosts.find(post =>
            post.id === postId
        );

        if (!demoPost) return;

        demoPost.liked = !demoPost.liked;

        demoPost.likes = Math.max(
            0,
            (demoPost.likes || 0) +
            (demoPost.liked ? 1 : -1)
        );
    }

    this.renderFeed(
        this.currentFeedFilter || "for-you"
    );
};

GROMOZEEF_APP.toggleSave = function (postId) {
    const posts = this.getAllPosts();

    const post = posts.find(item =>
        item.id === postId
    );

    if (!post) {
        this.toast(
            "Demo post save nahi hui. Apni uploaded post save karke dekho."
        );

        return;
    }

    post.saved = !post.saved;

    if (post.saved) {
        this.savedPostIds.add(postId);
    } else {
        this.savedPostIds.delete(postId);
    }

    this.saveAllPosts(posts);

    this.renderFeed(
        this.currentFeedFilter || "for-you"
    );

    this.toast(
        post.saved ? "Post saved." : "Post unsaved."
    );
};

GROMOZEEF_APP.addComment = function (postId, text) {
    const posts = this.getAllPosts();

    const post = posts.find(item =>
        item.id === postId
    );

    if (!post) {
        const demoPost = this.demoPosts.find(item =>
            item.id === postId
        );

        if (!demoPost) return;

        demoPost.comments = demoPost.comments || [];

        demoPost.comments.push({
            username: this.getCurrentUsername() || "guest",
            text: GROMOZEEF_UTILS.safeText(text, 500)
        });

        this.toast("Demo comment added.");
        this.renderFeed(
            this.currentFeedFilter || "for-you"
        );

        return;
    }

    post.comments = post.comments || [];

    post.comments.push({
        username: this.getCurrentUsername() || "guest",
        text: GROMOZEEF_UTILS.safeText(text, 500)
    });

    this.saveAllPosts(posts);

    this.toast("Comment added.");
    this.renderFeed(
        this.currentFeedFilter || "for-you"
    );
};

GROMOZEEF_APP.followUser = function (username) {
    if (!username) return;

    if (username === this.getCurrentUsername()) {
        this.toast("You can't follow yourself.");
        return;
    }

    if (this.followingUsers.has(username)) {
        this.followingUsers.delete(username);
        this.toast("Unfollowed @" + username);
    } else {
        this.followingUsers.add(username);
        this.toast("Following @" + username);
    }

    this.renderFeed(
        this.currentFeedFilter || "for-you"
    );
};

GROMOZEEF_APP.bindFeedActions = function () {
    if (this.feedActionsBound) return;

    this.feedActionsBound = true;

    document.addEventListener("click", event => {
        const button = event.target.closest("[data-action]");

        if (!button) return;

        const action = button.dataset.action;
        const postId = button.dataset.postId;

        if (action === "close-modal") {
            this.closeModal();
            return;
        }

        if (action === "like-post") {
            this.toggleLike(postId);
            return;
        }

        if (action === "save-post") {
            this.toggleSave(postId);
            return;
        }

        if (action === "open-comments") {
            this.showComments(postId);
            return;
        }

        if (action === "post-menu") {
            this.openPostMenu(postId);
            return;
        }

        if (action === "report-post") {
            this.toast("Demo report recorded.");
            this.closeModal();
            return;
        }

        if (action === "feed-filter") {
            this.currentFeedFilter = button.dataset.filter;

            document.querySelectorAll(".feed-tab")
                .forEach(tab => {
                    tab.classList.toggle(
                        "active",
                        tab.dataset.filter === this.currentFeedFilter
                    );
                });

            this.renderFeed(this.currentFeedFilter);
        }
    });
};

      GROMOZEEF_APP.uploadState = {
    file: null,
    type: "grom",
    previewURL: null
};

GROMOZEEF_APP.openUpload = function () {
    const modalHTML = `
        <div class="upload-panel">
            <p class="muted">
                Apni gallery se photo ya video select kar.
            </p>

            <div class="upload-type-options">
                <button type="button"
                    class="secondary-button"
                    data-upload-type="grom">
                    ◈ GROM — Photo
                </button>

                <button type="button"
                    class="secondary-button"
                    data-upload-type="zeef">
                    ▶ ZEEF — Video
                </button>
            </div>

            <label for="gromozeefMediaInput">
                Choose media
            </label>

            <input
                id="gromozeefMediaInput"
                type="file"
                accept="image/*,video/*">

            <div id="gromozeefMediaPreview"></div>

            <label for="gromozeefCaption">
                Caption
            </label>

            <textarea
                id="gromozeefCaption"
                maxlength="2200"
                rows="4"
                placeholder="Write a caption..."></textarea>

            <label for="gromozeefVisibility">
                Audience
            </label>

            <select id="gromozeefVisibility">
                <option value="public">Public</option>
                <option value="private">Private</option>
            </select>

            <button
                id="gromozeefPublishButton"
                type="button"
                class="primary-button">
                Publish post
            </button>
        </div>
    `;

    this.showModal("Create a post", modalHTML);

    const input = document.querySelector(
        "#gromozeefMediaInput"
    );

    input.addEventListener("change", event => {
        const file = event.target.files?.[0];

        if (!file) return;

        const isImage = file.type.startsWith("image/");
        const isVideo = file.type.startsWith("video/");

        if (!isImage && !isVideo) {
            this.toast("Please choose a photo or video.");
            input.value = "";
            return;
        }

        if (file.size > 100 * 1024 * 1024) {
            this.toast("Maximum file size is 100 MB.");
            input.value = "";
            return;
        }

        this.clearUploadPreview();

        this.uploadState.file = file;
        this.uploadState.type = isVideo ? "zeef" : "grom";
        this.uploadState.previewURL = URL.createObjectURL(file);

        const preview = document.querySelector(
            "#gromozeefMediaPreview"
        );

        if (isImage) {
            const image = document.createElement("img");

            image.src = this.uploadState.previewURL;
            image.alt = "Selected photo";
            image.className = "upload-preview-media";

            preview.appendChild(image);
        } else {
            const video = document.createElement("video");

            video.src = this.uploadState.previewURL;
            video.controls = true;
            video.playsInline = true;
            video.className = "upload-preview-media";

            preview.appendChild(video);
        }

        this.toast(
            isVideo ? "ZEEF video selected." : "GROM photo selected."
        );
    });

    document.querySelectorAll("[data-upload-type]")
        .forEach(button => {
            button.addEventListener("click", () => {
                const type = button.dataset.uploadType;

                this.uploadState.type = type;

                input.accept = type === "zeef"
                    ? "video/*"
                    : "image/*";

                input.value = "";

                this.clearUploadPreview();

                this.uploadState.file = null;

                this.toast(
                    type === "zeef"
                        ? "Select a video for your ZEEF."
                        : "Select a photo for your GROM."
                );
            });
        });

    document.querySelector(
        "#gromozeefPublishButton"
    ).addEventListener("click", () => {
        this.publishUpload();
    });
};

GROMOZEEF_APP.clearUploadPreview = function () {
    const preview = document.querySelector(
        "#gromozeefMediaPreview"
    );

    if (preview) {
        preview.replaceChildren();
    }

    if (this.uploadState.previewURL) {
        URL.revokeObjectURL(this.uploadState.previewURL);
    }

    this.uploadState.previewURL = null;
};

GROMOZEEF_APP.publishUpload = function () {
    const file = this.uploadState.file;

    if (!file) {
        this.toast("Pehle gallery se media select kar.");
        return;
    }

    const account = this.activeAccount || this.currentUser;

    if (!account || !account.username) {
        this.toast("Post publish karne ke liye login karo.");
        return;
    }

    const caption = document.querySelector(
        "#gromozeefCaption"
    ).value.trim();

    const visibility = document.querySelector(
        "#gromozeefVisibility"
    ).value;

    const isVideo = file.type.startsWith("video/");
    const isImage = file.type.startsWith("image/");

    if (this.uploadState.type === "zeef" && !isVideo) {
        this.toast("ZEEF ke liye video select kar.");
        return;
    }

    if (this.uploadState.type === "grom" && !isImage) {
        this.toast("GROM ke liye photo select kar.");
        return;
    }

    /*
      Browser demo:
      Media is previewed locally. Real cloud publishing
      requires a server and media storage.
    */

    const reader = new FileReader();

    reader.onload = () => {
        const posts = this.getAllPosts();

        const post = {
            id: "post-" + Date.now(),
            type: this.uploadState.type,
            username: account.username,
            displayName: account.displayName || account.username,
            avatar: account.avatar || "👤",
            caption,
            media: reader.result,
            mediaType: isVideo ? "video" : "image",
            visibility,
            likes: 0,
            comments: [],
            liked: false,
            saved: false,
            createdAt: Date.now()
        };

        posts.unshift(post);

        try {
            this.saveAllPosts(posts);

            this.clearUploadPreview();
            this.uploadState.file = null;

            this.closeModal();

            this.toast(
                "Post is saved in this browser's demo storage."
            );

            this.navigate("home");
            this.renderHome();
        } catch (error) {
            this.toast(
                "Browser storage full ho sakti hai. Real uploads ke liye cloud storage chahiye."
            );
        }
    };

    reader.onerror = () => {
        this.toast("Media read nahi ho paya.");
    };

    reader.readAsDataURL(file);
};

GROMOZEEF_APP.renderSearch = function () {
    const root =
        document.querySelector("#page-search") ||
        document.querySelector("#page-discover");

    if (!root) {
        this.toast("Search page ka HTML section nahi mila.");

        )
    );

    );

    const searchInput = GROMOZEEF_UTILS.create("input");

    searchInput.type = "search";

        "feed-tabs"
    );

    [
        ["All", "all"],
        ["Accounts", "accounts"],
        ["ZEEFs", "zeefs"],
        ["GROMs", "groms"]
    ].forEach(([label, value]) => {
        const button = GROMOZEEF_UTILS.create(
            "button",
            "feed-tab" + (
                value === this.searchState.filter
                    ? " active"
                    : ""
            ),
            label
        );

        button.type = "button";

        button.addEventListener("click", () => {
            this.searchState.filter = value;

            filters.querySelectorAll("button")
                .forEach(item => {
                    item.classList.toggle(
                        "active",
                        item === button
                    );
                });

            renderResults();
        });

        filters.appendChild(button);
    });

    root.appendChild(filters);

    const results = GROMOZEEF_UTILS.create(
        "div",
        "search-results"
    );

    root.appendChild(results);

    const getAccounts = () => {
        const accounts = GROMOZEEF_STORAGE.read(
            "gromozeef_accounts",
            []
        );

        const combined = [
            ...(Array.isArray(accounts) ? accounts : []),
            ...(this.demoAccounts || [])
        ];

        if (this.activeAccount) {
            combined.unshift(this.activeAccount);
        }

        const unique = new Map();

        combined.forEach(account => {
            if (account?.username) {
                unique.set(
                    account.username.toLowerCase(),
                    account
                );
            }
        });

        return [...unique.values()];
    };

    const renderResults = () => {
        const query = searchInput.value
            .trim()
            .toLowerCase()
            .replace(/^@/, "");

        results.replaceChildren();

        if (!query) {
            results.appendChild(
                GROMOZEEF_UTILS.create(
                    "p",
                    "empty-state",
                    "Search karne ke liye username ya keyword likh."
                )
            );

            return;
        }

        const filter = this.searchState.filter;

        if (filter === "all" || filter === "accounts") {
            const heading = GROMOZEEF_UTILS.create(
                "h3",
                "",
                "Accounts"
            );

            results.appendChild(heading);

            const matchingAccounts = getAccounts().filter(
                account =>
                    account.username
                        .toLowerCase()
                        .includes(query) ||
                    (account.displayName || "")
                        .toLowerCase()
                        .includes(query)
            );

            if (!matchingAccounts.length) {
                results.appendChild(
                    GROMOZEEF_UTILS.create(
                        "p",
                        "muted small",
                        "Matching account nahi mila."
                    )
                );
            }

            matchingAccounts.forEach(account => {
                const row = GROMOZEEF_UTILS.create(
                    "div",
                    "account-result"
                );

                row.appendChild(
                    GROMOZEEF_UTILS.create(
                        "div",
                        "post-avatar",
                        account.avatar || "👤"
                    )
                );

                const info = GROMOZEEF_UTILS.create("div");

                info.appendChild(
                    GROMOZEEF_UTILS.create(
                        "strong",
                        "",
                        "@" + account.username
                    )
                );

                info.appendChild(
                    GROMOZEEF_UTILS.create(
                        "p",
                        "muted small",
                        account.displayName || account.username
                    )
                );

                row.appendChild(info);
                results.appendChild(row);
            });
        }

        if (
            filter === "all" ||
            filter === "zeefs" ||
            filter === "groms"
        ) {
            const matchingPosts = this.getCombinedPosts()
                .filter(post => {
                    if (
                        filter === "zeefs" &&
                        post.type !== "zeef"
                    ) {
                        return false;
                    }

                    if (
                        filter === "groms" &&
                        post.type !== "grom"
                    ) {
                        return false;
                    }

                    const searchableText = [
                        post.username,
                        post.displayName,
                        post.caption
                    ].join(" ").toLowerCase();

                    return searchableText.includes(query);
                });

            results.appendChild(
                GROMOZEEF_UTILS.create(
                    "h3",
                    "",
                    filter === "zeefs"
                        ? "ZEEFs"
                        : filter === "groms"
                            ? "GROMs"
                            : "Matching posts"
                )
            );

            if (!matchingPosts.length) {
                results.appendChild(
                    GROMOZEEF_UTILS.create(
                        "p",
                        "muted small",
                        "Matching posts nahi mili."
                    )
                );
            }

            matchingPosts.forEach(post => {
                results.appendChild(
                    this.createPostCard(post)
                );
            });
        }
    };

    searchInput.addEventListener(
        "input",
        renderResults
    );

    renderResults();

    searchInput.focus();
};

GROMOZEEF_APP.storyState = {
    items: [],
    maxDurationMs: 24 * 60 * 60 * 1000
};

GROMOZEEF_APP.loadStories = function () {
    const stories = GROMOZEEF_STORAGE.read(
        "gromozeef_stories",
        []
    );

    this.storyState.items = Array.isArray(stories)
        ? stories.filter(story =>
            Date.now() - story.createdAt <
            this.storyState.maxDurationMs
        )
        : [];

    return this.storyState.items;
};

GROMOZEEF_APP.saveStories = function () {
    GROMOZEEF_STORAGE.write(
        "gromozeef_stories",

    );
};

GROMOZEEF_APP.addStory = function (file) {
    if (!file) {
        this.toast("Pehle photo ya video select kar.");
        return;
    }

    if (!file.type.startsWith("image/") &&
        !file.type.startsWith("video/")) {
        this.toast("Sirf photo ya video select kar.");
        return;
    }

    if (file.size > 20 * 1024 * 1024) {
        this.toast("Demo STRIP ki maximum size 20 MB hai.");
        return;
    }

    const account = this.activeAccount || this.currentUser;

    if (!account?.username) {
        this.toast("STRIP post karne ke liye login karo.");
        return;
    }

    const reader = new FileReader();

    reader.onload = () => {
        const story = {
            id: "strip-" + Date.now(),
            username: account.username,
            displayName: account.displayName || account.username,
            avatar: account.avatar || "👤",
            media: reader.result,
            mediaType: file.type.startsWith("video/")
                ? "video"
                : "image",
            createdAt: Date.now(),
            views: []
        };

        this.loadStories();
        this.storyState.items.unshift(story);

        try {
            this.saveStories();
            this.toast("STRIP browser demo mein save ho gayi.");
            this.renderStories();
            this.closeModal();
        } catch (error) {
            this.toast("Storage full ho sakti hai. Chhoti file try kar.");
        }
    };

    reader.onerror = () => {
        this.toast("File read nahi ho paayi.");
    };

    reader.readAsDataURL(file);
};

GROMOZEEF_APP.openStoryPicker = function () {
    this.showModal(
        "Create STRIP",
        `
            <p class="muted">
                Photo ya short video choose kar.
            </p>

            <input
                type="file"
                id="stripFileInput"
                accept="image/*,video/*">

            <button
                type="button"
                id="publishStripButton"
                class="primary-button">
                Share STRIP
            </button>
        `
    );

    document.querySelector("#publishStripButton")
        ?.addEventListener("click", () => {
            const file = document.querySelector(
                "#stripFileInput"
            )?.files?.[0];

            this.addStory(file);
        });
};

GROMOZEEF_APP.renderStories = function () {
    this.loadStories();

    const containers = [
        document.querySelector("#storiesContainer"),
        document.querySelector(".stories-row")
    ].filter(Boolean);

    containers.forEach(container => {
        let stripContainer = container;

        if (container.id !== "storiesContainer") {
            stripContainer = container;
        }

        stripContainer.replaceChildren();

        const addButton = document.createElement("button");
        addButton.type = "button";
        addButton.className = "story-item";
        addButton.textContent = "＋ Your STRIP";

        addButton.addEventListener("click", () => {
            this.openStoryPicker();
        });

        stripContainer.appendChild(addButton);

        this.storyState.items.forEach(story => {
            const button = document.createElement("button");

            button.type = "button";
            button.className = "story-item";

            const avatar = document.createElement("span");
            avatar.className = "story-avatar";
            avatar.textContent = story.avatar || "👤";

            const name = document.createElement("span");
            name.className = "small";
            name.textContent = story.username;

            button.appendChild(avatar);
            button.appendChild(name);

            button.addEventListener("click", () => {
                this.viewStory(story.id);
            });

            stripContainer.appendChild(button);
        });
    });
};

GROMOZEEF_APP.viewStory = function (storyId) {
    this.loadStories();

    const story = this.storyState.items.find(
        item => item.id === storyId
    );

    if (!story) {
        this.toast("Ye STRIP expire ho chuki hai.");
        return;
    }

    const username = this.getCurrentUsername();

    if (
        username &&
        username !== story.username &&
        !story.views.includes(username)
    ) {
        story.views.push(username);
        this.saveStories();
    }

    const mediaHTML = story.mediaType === "video"
        ? `<video class="story-view-media"
             src="${story.media}"
             controls autoplay playsinline></video>`
        : `<img class="story-view-media"
             src="${story.media}"
             alt="STRIP">`;

    this.showModal(
        "@" + story.username,
        `
            <div class="story-viewer">
                ${mediaHTML}

                <p class="muted">
                    ${story.views.length} views
                </p>
            </div>
        `
    );
};

GROMOZEEF_APP.renderConversation = function (username) {
    const root =
        document.querySelector("#page-chat") ||
        document.querySelector("#chatPageContent");

    if (!root) return;

    const chats = this.loadChatData();
    let conversation = chats.find(
        item => item.username === username
    );

    if (!conversation) {
        conversation = {
            id: "chat-" + Date.now(),
            username: username,
            messages: []
        };

        chats.unshift(conversation);
    }

    root.replaceChildren();

    const back = document.createElement("button");
    back.type = "button";
    back.textContent = "← All chats";
    back.addEventListener("click", () => {
        this.renderChat();
    });
    root.appendChild(back);

    const heading = document.createElement("h2");
    heading.textContent = "@" + username;
    root.appendChild(heading);

    const messageList = document.createElement("div");
    messageList.className = "chat-message-list";

    conversation.messages.forEach(message => {
        const bubble = document.createElement("div");

        bubble.className = "chat-message-bubble";
        bubble.textContent =
            (message.sender || "You") +
            ": " +
            message.text;

        messageList.appendChild(bubble);
    });

    root.appendChild(messageList);

    const form = document.createElement("form");
    form.className = "chat-compose";

    const input = document.createElement("input");
    input.type = "text";

    form.appendChild(send);
    root.appendChild(form);

    form.addEventListener("submit", event => {
        event.preventDefault();

        const text = input.value.trim();
        if (!text) return;

        conversation.messages.push({
            id: "msg-" + Date.now(),
            sender: this.getCurrentUsername() || "You",
            text: text,
            createdAt: Date.now()
        });

        this.saveChatData();
        this.renderConversation(username);
    });
};

GROMOZEEF_APP.sharePost = async function (postId) {
    const post = this.getPostById(postId);

    if (!post) {
        this.toast("Post nahi mili.");
        return;
    }

    const shareText =
        "Gromozeef par @" +
        (post.username || "creator") +
        " ki post dekho!";

    if (navigator.share) {
        try {
            await navigator.share({
                title: "Gromozeef",
                text: shareText
            });
        } catch (error) {
            if (error.name !== "AbortError") {
                this.toast("Share nahi ho paaya.");
            }
        }
    } else if (navigator.clipboard) {
        try {
            await navigator.clipboard.writeText(shareText);
            this.toast("Share text copy ho gaya!");
        } catch (error) {
            this.toast(shareText);
        }
    } else {
        this.toast(shareText);
    }
};

GROMOZEEF_APP.resharePost = function (postId) {
    const original = this.getPostById(postId);

    if (!original) {
        this.toast("Post nahi mili.");
        return;
    }

    const username = this.getCurrentUsername();

    if (!username) {
        this.toast("Pehle login karo.");
        return;
    }

    const allPosts = this.getAllPosts();

    const alreadyShared = allPosts.some(post =>
        post.reshareOf === postId &&
        post.username === username
    );

    if (alreadyShared) {
        this.toast("Tum ye post pehle hi reshare kar chuke ho.");
        return;
    }

    const resharedPost = {
        id: "reshare-" + Date.now(),
        username: username,
        type: "reshare",
        reshareOf: postId,
        originalUsername: original.username,
        caption: "Reshared from @" + original.username,
        createdAt: Date.now()
    };

    allPosts.unshift(resharedPost);
    this.saveAllPosts(allPosts);

    this.toast("Post tumhari demo feed mein reshare ho gayi.");

    if (typeof this.renderHome === "function") {
        this.renderHome();
    }
};

GROMOZEEF_APP.extractGrowtags = function (text) {
    const matches = String(text || "").match(
        /@[a-zA-Z0-9_.]+/g
    );

    return matches
        ? [...new Set(matches.map(tag => tag.slice(1)))]
        : [];
};

GROMOZEEF_APP.showGrowtags = function (text) {
    const usernames = this.extractGrowtags(text);

    if (!usernames.length) {
        this.toast("Is caption mein koi GROWTAG nahi hai.");
        return;
    }

    const wrapper = document.createElement("div");
    const heading = document.createElement("h3");

    heading.textContent = "GROWTAGGED ACCOUNTS";
    wrapper.appendChild(heading);

    usernames.forEach(username => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "account-switch-row";
        button.textContent = "@" + username;

        button.addEventListener("click", () => {
            this.toast("Profile: @" + username);
        });

        wrapper.appendChild(button);
    });

    this.showModal("GROWTAGS", wrapper.outerHTML);
};

GROMOZEEF_APP.openEditProfile = function () {
    const account =
        this.activeAccount ||
        this.currentUser ||
        {};

    const currentName =
        account.displayName ||
        account.username ||
        "";

    const currentBio =
        account.bio ||
        "";

    const form = document.createElement("form");

    form.innerHTML = `
        <label for="gzDisplayName">Display name</label>
        <input
            id="gzDisplayName"
            name="displayName"
            maxlength="50"
            value="${this.escape(currentName)}"
            required
        >

        <label for="gzBio">Bio</label>
        <textarea
            id="gzBio"
            name="bio"
            maxlength="160"
            rows="4"
        >${this.escape(currentBio)}</textarea>

        <p class="muted">
            Bio maximum 160 characters.
        </p>

        <button
            type="submit"
            class="primary-button"
        >
            Save profile
        </button>
    `;

    form.addEventListener("submit", event => {
        event.preventDefault();

        const displayName = form.elements.displayName.value.trim();
        const bio = form.elements.bio.value.trim();

        if (!displayName) {
            this.toast("Display name likho.");
            return;
        }

        const username = this.getCurrentUsername();

        if (!username) {
            this.toast("Pehle login karo.");
            return;
        }

        const accounts = GROMOZEEF_STORAGE.read(
            "gromozeef_accounts",
            []
        );

        if (!Array.isArray(accounts)) {
            this.toast("Accounts load nahi ho paaye.");
            return;
        }

        const index = accounts.findIndex(
            item => item.username === username
        );

        if (index < 0) {
            this.toast("Account nahi mila.");
            return;
        }

        accounts[index].displayName = displayName;
        accounts[index].bio = bio;

        GROMOZEEF_STORAGE.write(
            "gromozeef_accounts",
            accounts
        );

        if (this.activeAccount) {
            this.activeAccount.displayName = displayName;
            this.activeAccount.bio = bio;
        }

        if (this.currentUser) {
            this.currentUser.displayName = displayName;
            this.currentUser.bio = bio;
        }

        if (typeof this.renderCurrentProfile === "function") {
            this.renderCurrentProfile();
        }

        this.closeModal();
        this.toast("Profile demo mein update ho gayi.");
    });

    this.showModal("Edit profile", form.outerHTML);

    const modal = document.querySelector("#modalRoot");

    const actualForm = modal?.querySelector("form");

    if (actualForm) {
        actualForm.addEventListener("submit", event => {
            event.preventDefault();

            const displayName =
                actualForm.elements.displayName.value.trim();

            const bio =
                actualForm.elements.bio.value.trim();

            if (!displayName) {
                this.toast("Display name likho.");
                return;
            }

            const username = this.getCurrentUsername();

            const accounts = GROMOZEEF_STORAGE.read(
                "gromozeef_accounts",
                []
            );

            if (!Array.isArray(accounts)) return;

            const index = accounts.findIndex(
                item => item.username === username
            );

            if (index < 0) {
                this.toast("Account nahi mila.");
                return;
            }

            accounts[index].displayName = displayName;
            accounts[index].bio = bio;

            GROMOZEEF_STORAGE.write(
                "gromozeef_accounts",
                accounts
            );

            if (this.activeAccount) {
                this.activeAccount.displayName = displayName;
                this.activeAccount.bio = bio;
            }

            if (this.currentUser) {
                this.currentUser.displayName = displayName;
                this.currentUser.bio = bio;
            }

            if (typeof this.renderCurrentProfile === "function") {
                this.renderCurrentProfile();
            }

            this.closeModal();
            this.toast("Profile demo mein update ho gayi.");
        }, { once: true });
    }
};

        document.querySelector("#creatorPageContent");

    if (!root) {
        this.toast("Creator dashboard container nahi mila.");
        return;
    }

    root.replaceChildren();

    const heading = document.createElement("h2");
    heading.textContent = "Creator Dashboard";
    root.appendChild(heading);

    const info = document.createElement("p");
    info.className = "muted";
    info.textContent =
        "Your content performance — browser demo";
    root.appendChild(info);

    const username = this.getCurrentUsername();

    if (!username) {
        const message = document.createElement("p");
        message.textContent = "Dashboard dekhne ke liye login karo.";
        root.appendChild(message);
        return;
    }

    const posts = this.getAllPosts().filter(
        post => post.username === username
    );

    const totalLikes = posts.reduce(
        (sum, post) => sum + (
            Array.isArray(post.likes)
                ? post.likes.length
                : Number(post.likes || 0)
        ),
        0
    );

    const totalComments = posts.reduce(
        (sum, post) => sum + (
            Array.isArray(post.comments)
                ? post.comments.length
                : 0
        ),
        0
    );

    const metrics = [
        ["Your posts", posts.length],
        ["Recorded likes", totalLikes],
        ["Recorded comments", totalComments]
    ];

    const grid = document.createElement("div");
    grid.className = "dashboard-grid";

    metrics.forEach(([label, value]) => {
        const card = document.createElement("div");
        card.className = "page-card";

        const title = document.createElement("p");
        title.className = "muted";
        title.textContent = label;

        const number = document.createElement("h2");
        number.textContent = String(value);

        card.appendChild(title);
        card.appendChild(number);
        grid.appendChild(card);
    });

    root.appendChild(grid);

    const note = document.createElement("p");
    note.className = "muted";
    note.textContent =
        "Actual reach, unique views, watch time aur earnings ke liye server-side analytics zaroori hain.";

    root.appendChild(note);

    const refresh = document.createElement("button");
    refresh.type = "button";
    refresh.className = "primary-button";
    refresh.textContent = "Refresh dashboard";

    refresh.addEventListener("click", () => {
        this.renderCreatorDashboard();
    });

    root.appendChild(refresh);
};

/* End of Creator Dashboard demo */

GROMOZEEF_APP.safetyState = {
    reports: [],
    blockedUsers: []
};

GROMOZEEF_APP.loadSafetyData = function () {
    const reports = GROMOZEEF_STORAGE.read(
        "gromozeef_reports",
        []
    );

    const blockedUsers = GROMOZEEF_STORAGE.read(
        "gromozeef_blocked_users",
        []
    );

    this.safetyState.reports =
        Array.isArray(reports) ? reports : [];

    this.safetyState.blockedUsers =
        Array.isArray(blockedUsers) ? blockedUsers : [];

    return this.safetyState;
};

GROMOZEEF_APP.reportPost = function (postId) {
    const post = this.getPostById(postId);

    if (!post) {
        this.toast("Post nahi mili.");
        return;
    }

    const reasons = [
        "Spam",
        "Harassment or bullying",
        "Harmful content",
        "Impersonation",
        "Copyright concern",
        "Other"
    ];

    const form = document.createElement("form");

    const label = document.createElement("label");
    label.textContent = "Report reason";

    const select = document.createElement("select");
    select.name = "reason";
    select.required = true;

    reasons.forEach(reason => {
        const option = document.createElement("option");
        option.value = reason;
        option.textContent = reason;
        select.appendChild(option);
    });

    const submit = document.createElement("button");
    submit.type = "submit";
    submit.className = "primary-button";
    submit.textContent = "Submit report";

    form.append(label, select, submit);

    this.showModal("Report post", form.outerHTML);

    const modal = document.querySelector("#modalRoot");
    const actualForm = modal?.querySelector("form");

    if (!actualForm) return;

    actualForm.addEventListener("submit", event => {
        event.preventDefault();

        this.loadSafetyData();

        this.safetyState.reports.push({
            id: "report-" + Date.now(),
            postId: postId,
            reportedUsername: post.username || "unknown",
            reason: actualForm.elements.reason.value,
            createdAt: Date.now(),
            status: "local-demo"
        });

        GROMOZEEF_STORAGE.write(
            "gromozeef_reports",
            this.safetyState.reports
        );

        this.closeModal();
        this.toast("Report local demo mein save ho gayi.");
    }, { once: true });
};

GROMOZEEF_APP.blockUser = function (username) {
    if (!username) {
        this.toast("Username nahi mila.");
        return;
    }

    if (username === this.getCurrentUsername()) {
        this.toast("Apne account ko block nahi kar sakte.");
        return;
    }

    this.loadSafetyData();

    if (this.safetyState.blockedUsers.includes(username)) {
        this.toast("Ye account pehle se blocked hai.");
        return;
    }

    this.safetyState.blockedUsers.push(username);

    GROMOZEEF_STORAGE.write(
        "gromozeef_blocked_users",
        this.safetyState.blockedUsers
    );

    this.toast("Account local demo mein block hua.");
};

GROMOZEEF_APP.unblockUser = function (username) {
    this.loadSafetyData();

    this.safetyState.blockedUsers =
        this.safetyState.blockedUsers.filter(
            name => name !== username
        );

    GROMOZEEF_STORAGE.write(
        "gromozeef_blocked_users",
        this.safetyState.blockedUsers
    );

    this.toast("Account local demo se unblock hua.");
};

GROMOZEEF_APP.isUserBlocked = function (username) {
    this.loadSafetyData();

    return this.safetyState.blockedUsers.includes(username);
};

GROMOZEEF_APP.renderBlockedUsers = function () {
    this.loadSafetyData();

    const wrapper = document.createElement("div");
    const heading = document.createElement("h3");

    heading.textContent = "Blocked accounts";
    wrapper.appendChild(heading);

    if (!this.safetyState.blockedUsers.length) {
        const empty = document.createElement("p");
        empty.textContent = "Koi blocked account nahi hai.";
        wrapper.appendChild(empty);
    }

    this.safetyState.blockedUsers.forEach(username => {
        const row = document.createElement("div");
        row.className = "account-switch-row";

        const name = document.createElement("span");
        name.textContent = "@" + username;

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "Unblock";

        button.addEventListener("click", () => {
            this.unblockUser(username);
            this.renderBlockedUsers();
        });

        row.append(name, button);
        wrapper.appendChild(row);
    });

    this.showModal("Blocked accounts", wrapper.outerHTML);

    const modal = document.querySelector("#modalRoot");

    modal?.querySelectorAll("button").forEach((button, index) => {
        button.addEventListener("click", () => {
            const username = this.safetyState.blockedUsers[index];

            if (username) {
                this.unblockUser(username);
                this.renderBlockedUsers();
            }
        });
    });
};

/* End of Report & Block demo */

GROMOZEEF_APP.runDiagnostics = function () {
    const checks = [
        ["App object", typeof GROMOZEEF_APP === "object"],
        ["Storage read", typeof GROMOZEEF_STORAGE?.read === "function"],
        ["Storage write", typeof GROMOZEEF_STORAGE?.write === "function"],
        ["Navigation", typeof GROMOZEEF_APP.navigate === "function"],
        ["Home feed", typeof GROMOZEEF_APP.renderHome === "function"],
        ["Z-Chat", typeof GROMOZEEF_APP.renderChat === "function"],
        ["Search", typeof GROMOZEEF_APP.renderSearch === "function"],
        ["Profile editor", typeof GROMOZEEF_APP.openEditProfile === "function"],
        ["Settings", typeof GROMOZEEF_APP.renderSettings === "function"],
        ["Safety tools", typeof GROMOZEEF_APP.reportPost === "function"]
    ];

    console.table(
        checks.map(([feature, passed]) => ({
            feature,
            status: passed ? "FOUND" : "MISSING"
        }))
    );

    const missing = checks
        .filter(([, passed]) => !passed)
        .map(([feature]) => feature);

    if (missing.length) {
        this.toast("Kuch features missing hain. Console check karo.");
    } else {
        this.toast("Basic feature checks complete.");
    }

    return {
        passed: checks.filter(([, passed]) => passed).length,
        total: checks.length,
        missing
    };
};

GROMOZEEF_APP.openDiagnostics = function () {
    const result = this.runDiagnostics();

    const box = document.createElement("div");
    const summary = document.createElement("p");

    summary.textContent =
        "Checks passed: " + result.passed +
        " / " + result.total;

    box.appendChild(summary);

    if (result.missing.length) {
        const list = document.createElement("ul");

        result.missing.forEach(feature => {
            const item = document.createElement("li");
            item.textContent = feature;
            list.appendChild(item);
        });

        box.appendChild(list);
    } else {
        const message = document.createElement("p");
        message.textContent =
            "Required demo functions were found. This does not guarantee that every feature works.";
        box.appendChild(message);
    }

    this.showModal("Gromozeef diagnostics", box.outerHTML);
};
