<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10111f">
<link rel="manifest" href="/Gromazeef/manifest.json">
<meta name="description" content="Gromazeef — your people, your moments, your world.">
<title>Gromazeef — Your people, your moments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0b0c16;--panel:#131525;--panel2:#191c30;--panel3:#20243b;
  --text:#f7f7ff;--muted:#a5a8c4;--subtle:#747994;--line:rgba(255,255,255,.09);
  --pink:#ff4f9a;--purple:#8c5cff;--cyan:#39d9e6;--lime:#c6ff68;
  --grad:linear-gradient(120deg,#ff4f9a 0%,#a35bff 48%,#43d8e8 100%);
  --softgrad:linear-gradient(135deg,rgba(255,79,154,.16),rgba(140,92,255,.14),rgba(57,217,230,.10));
  --shadow:0 22px 70px rgba(0,0,0,.32);--radius:22px;--navw:248px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 75% -15%,rgba(140,92,255,.16),transparent 35%),radial-gradient(ellipse at -15% 55%,rgba(255,79,154,.08),transparent 28%),var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
a{color:inherit;text-decoration:none}
img,video{max-width:100%}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
h1,h2,h3,h4,p{margin-top:0}
h1,h2,h3,.brand-name{font-family:Manrope,sans-serif}
button{border:0;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:13px;padding:11px 15px;background:var(--panel2);color:var(--text);font-weight:700;transition:.18s ease}
.btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.2)}
.btn.primary{background:var(--grad);border:0;color:white;box-shadow:0 7px 24px rgba(165,91,255,.2)}
.btn.ghost{background:transparent}
.btn.danger{color:#ff7996}
.icon-btn{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:14px;background:transparent;border:1px solid transparent;font-size:20px;position:relative}
.icon-btn:hover{background:var(--panel2);border-color:var(--line)}
.field{width:100%;padding:13px 14px;background:#0d0f1c;border:1px solid var(--line);border-radius:13px;color:var(--text);outline:none}
.field:focus{border-color:rgba(57,217,230,.65);box-shadow:0 0 0 3px rgba(57,217,230,.08)}
textarea.field{resize:vertical;min-height:90px}
.label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 7px}
.stack{display:grid;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--panel3);border:1px solid var(--line)}
.avatar.sm{width:34px;height:34px}.avatar.lg{width:76px;height:76px}.avatar.xl{width:104px;height:104px}
.avatar-ring{padding:3px;border-radius:50%;background:var(--grad);display:inline-flex}
.avatar-ring .avatar{border:3px solid var(--bg)}
.pill{font-size:11px;font-weight:800;letter-spacing:.04em;padding:5px 8px;border-radius:99px;background:rgba(57,217,230,.12);color:var(--cyan)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:var(--grad);font-family:Manrope;font-weight:900;font-size:21px;box-shadow:0 8px 25px rgba(140,92,255,.3)}
.brand-name{font-size:20px;font-weight:800;letter-spacing:-.7px}
.brand-name span{background:var(--grad);background-clip:text;-webkit-background-clip:text;color:transparent}
.topbar{position:fixed;z-index:30;top:0;left:0;right:0;height:76px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:rgba(11,12,22,.78);backdrop-filter:blur(24px);border-bottom:1px solid var(--line)}
.topbar-right{display:flex;align-items:center;gap:8px}
.search-trigger{width:min(34vw,330px);display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--muted);text-align:left}
.app-shell{padding-top:76px}
.sidebar{position:fixed;z-index:20;top:76px;bottom:0;left:0;width:var(--navw);padding:22px 16px 18px;border-right:1px solid var(--line);background:rgba(11,12,22,.72);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:7px}
.nav-item{width:100%;display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:15px;color:var(--muted);font-weight:600;text-align:left;background:transparent;transition:.18s}
.nav-item .nav-icon{font-size:21px;width:25px;text-align:center}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:var(--softgrad);color:var(--text);border:1px solid rgba(255,255,255,.07)}
.nav-item.active .nav-icon{filter:drop-shadow(0 0 8px rgba(255,79,154,.6))}
.sidebar-bottom{margin-top:auto}
.main{margin-left:var(--navw);padding:28px clamp(18px,3vw,42px) 50px;min-height:calc(100vh - 76px)}
.page{max-width:1260px;margin:0 auto;animation:appear .22s ease}
@keyframes appear{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}
.page-head h1{font-size:clamp(25px,3vw,36px);letter-spacing:-1.4px;margin-bottom:5px}
.page-head p{color:var(--muted);margin-bottom:0}
.layout-two{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:28px;align-items:start}
.card{background:linear-gradient(145deg,rgba(25,28,48,.96),rgba(17,19,34,.96));border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 28px rgba(0,0,0,.08)}
.card-pad{padding:20px}
.section-title{font-family:Manrope;font-size:15px;font-weight:800;margin:0}
.section-sub{color:var(--muted);font-size:12px;margin:5px 0 0}
.stories{display:flex;gap:16px;overflow-x:auto;padding:18px 18px 16px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{width:68px;flex:none;text-align:center;background:none;padding:0;color:var(--muted);font-size:11px}
.story .avatar-ring{margin-bottom:7px;box-shadow:0 0 0 2px var(--pink),0 0 0 4px rgba(163,91,255,.45)}
.story .avatar{width:58px;height:58px}
.story-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add-story{width:64px;height:64px;border-radius:50%;border:1px dashed rgba(255,255,255,.25);display:grid;place-items:center;font-size:25px;margin:0 auto 7px;color:var(--cyan)}
.feed{display:grid;gap:20px;margin-top:20px}
.post{overflow:hidden}
.post-head{padding:17px 18px;display:flex;align-items:center;justify-content:space-between}
.post-author{display:flex;align-items:center;gap:11px;min-width:0}
.post-author strong{display:block;font-size:13px}
.post-author small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.post-media{width:100%;max-height:720px;object-fit:contain;display:block;background:#080912}
.post-media-wrap{position:relative;background:#080912;display:grid;place-items:center;overflow:hidden}
.post-media-wrap img.post-media{aspect-ratio:4/3}
.post-media-wrap video.post-media{max-height:690px}
.post-caption{padding:14px 18px 4px;font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.post-actions{display:flex;align-items:center;gap:4px;padding:8px 13px 0}
.post-actions .icon-btn{font-size:22px;width:40px;height:40px}
.post-actions .save-action{margin-left:auto}
.post-meta{padding:0 18px 16px;font-size:12px;color:var(--muted)}
.post-meta strong{color:var(--text)}
.comment-preview{padding:0 18px 14px;font-size:12px;line-height:1.5}
.comment-form{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.comment-form input{flex:1;min-width:0;background:transparent;border:0;color:var(--text);outline:none}
.comment-form button{background:transparent;color:var(--cyan);font-weight:800}
.right-rail{display:grid;gap:18px}
.user-suggestion{display:flex;align-items:center;gap:10px}
.user-suggestion .user-details{flex:1;min-width:0}
.user-details strong,.user-details small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-details strong{font-size:12px}.user-details small{font-size:11px;color:var(--muted);margin-top:3px}
.follow-btn{font-size:11px;font-weight:800;color:var(--cyan);background:transparent;padding:7px}
.hero{padding:30px;position:relative;overflow:hidden;background:var(--softgrad)}
.hero:after{content:"";position:absolute;width:280px;height:280px;right:-70px;top:-100px;border-radius:50%;background:var(--grad);filter:blur(80px);opacity:.18;pointer-events:none}
.hero h2{font-size:clamp(25px,3.5vw,42px);line-height:1.1;letter-spacing:-1.6px;max-width:620px;margin:14px 0}
.gradient-text{background:var(--grad);background-clip:text;-webkit-background-clip:text;color:transparent}
.hero p{max-width:580px;color:#c3c5db;line-height:1.7;font-size:14px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:15px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025)}
.stat strong{display:block;font-family:Manrope;font-size:23px}.stat span{font-size:11px;color:var(--muted)}
.grid-posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.grid-tile{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--panel2);border-radius:8px;cursor:pointer}
.grid-tile img,.grid-tile video{width:100%;height:100%;object-fit:cover;display:block}
.grid-tile .tile-overlay{position:absolute;inset:0;background:rgba(5,6,12,.0);display:flex;align-items:center;justify-content:center;gap:15px;font-weight:800;opacity:0;transition:.2s}
.grid-tile:hover .tile-overlay{opacity:1;background:rgba(5,6,12,.52)}
.profile-cover{height:155px;border-radius:22px 22px 0 0;background:radial-gradient(circle at 20% 30%,rgba(255,79,154,.8),transparent 28%),radial-gradient(circle at 80% 25%,rgba(57,217,230,.7),transparent 28%),linear-gradient(120deg,#2a1a55,#15182d 50%,#142b42)}
.profile-main{padding:0 24px 24px}
.profile-avatar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:-48px;gap:15px;flex-wrap:wrap}
.profile-avatar-row .avatar{width:100px;height:100px;border:5px solid var(--panel)}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap}
.profile-info{margin-top:17px}
.profile-info h2{font-size:22px;margin:0 0 3px}
.profile-info .handle{color:var(--muted);font-size:13px}
.profile-bio{font-size:13px;line-height:1.7;white-space:pre-wrap;max-width:620px;margin:12px 0}
.profile-stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
.profile-stats strong{color:var(--text)}
.profile-tabs{display:flex;gap:6px;border-top:1px solid var(--line);margin-top:24px;padding-top:13px;overflow-x:auto}
.tab{background:transparent;padding:11px 13px;border-radius:10px;color:var(--muted);font-size:11px;letter-spacing:.06em;font-weight:800;white-space:nowrap}
.tab.active{color:var(--text);background:var(--panel3)}
.explore-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.explore-card{padding:16px;min-width:0}
.explore-card .cover{height:90px;border-radius:13px;background:var(--softgrad);margin-bottom:-32px}
.explore-card .avatar{position:relative;border:4px solid var(--panel);width:66px;height:66px}
.explore-card h3{font-size:14px;margin:8px 0 3px}
.explore-card p{font-size:11px;color:var(--muted);margin-bottom:13px;overflow-wrap:anywhere}
.explore-card .btn{width:100%;padding:9px}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:8px 13px;font-size:12px;color:var(--muted)}
.chip.active{background:var(--softgrad);border-color:rgba(255,79,154,.35);color:var(--text)}
.search-box{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.search-box input{border:0;outline:0;background:transparent;color:var(--text);width:100%;min-width:0}
.message-layout{display:grid;grid-template-columns:310px minmax(0,1fr);height:min(70vh,720px);min-height:460px;overflow:hidden}
.message-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.message-list-head{padding:18px;border-bottom:1px solid var(--line)}
.message-users{overflow:auto}
.message-user{display:flex;align-items:center;gap:10px;padding:14px 16px;width:100%;text-align:left;background:transparent;border-bottom:1px solid rgba(255,255,255,.035)}
.message-user:hover,.message-user.active{background:var(--panel3)}
.message-user .user-details{flex:1;min-width:0}
.chat-panel{display:flex;flex-direction:column;min-width:0}
.chat-head{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.chat-body{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.chat-empty{margin:auto;text-align:center;color:var(--muted);padding:25px}
.bubble{max-width:min(78%,440px);padding:11px 14px;border-radius:16px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;background:linear-gradient(135deg,#8c5cff,#b44cff);border-bottom-right-radius:5px}
.bubble.theirs{align-self:flex-start;background:var(--panel3);border-bottom-left-radius:5px}
.bubble time{display:block;font-size:10px;opacity:.7;margin-top:5px;text-align:right}
.chat-compose{display:flex;gap:8px;padding:13px;border-top:1px solid var(--line)}
.chat-compose input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--text);outline:none}
.message-status{font-size:10px;text-align:right;color:#b4c5ff}
.upload-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.drop-zone{border:1px dashed rgba(255,255,255,.23);border-radius:20px;padding:35px 18px;text-align:center;background:rgba(255,255,255,.02);transition:.2s}
.drop-zone.drag{border-color:var(--cyan);background:rgba(57,217,230,.06)}
.drop-icon{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;background:var(--softgrad);display:grid;place-items:center;font-size:29px}
.preview-media{width:100%;max-height:430px;object-fit:contain;border-radius:15px;background:#080912;margin-top:15px}
.upload-form{display:grid;gap:15px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.notification{display:flex;align-items:flex-start;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.notification:last-child{border-bottom:0}
.notification p{font-size:12px;line-height:1.55;margin:2px 0 4px}
.notification small{color:var(--muted);font-size:10px}
.notification.unread{background:rgba(140,92,255,.06)}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:17px 0;border-bottom:1px solid var(--line)}
.settings-row:last-child{border-bottom:0}
.settings-row strong{display:block;font-size:13px}.settings-row small{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.switch{appearance:none;width:42px;height:24px;background:#3a3d52;border-radius:30px;position:relative;cursor:pointer;flex:none}
.switch:checked{background:var(--purple)}
.switch:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:white;transition:.2s}
.switch:checked:before{transform:translateX(18px)}
.empty-state{text-align:center;padding:45px 20px;color:var(--muted)}
.empty-state .empty-icon{font-size:38px;margin-bottom:12px}
.empty-state h3{color:var(--text);margin-bottom:8px;font-size:17px}
.empty-state p{font-size:12px;line-height:1.7;max-width:390px;margin:0 auto 17px}
.skeleton{height:180px;border-radius:18px;background:linear-gradient(90deg,var(--panel),var(--panel2),var(--panel));background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.toast-stack{position:fixed;z-index:100;right:20px;top:90px;display:grid;gap:9px;width:min(360px,calc(100vw - 40px))}
.toast{padding:13px 15px;background:#20233a;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);font-size:13px;animation:appear .2s ease}
.toast.success{border-color:rgba(198,255,104,.3)}.toast.error{border-color:rgba(255,79,154,.4)}
.modal-backdrop{position:fixed;z-index:80;inset:0;background:rgba(3,4,10,.72);backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px}
.modal{width:min(560px,100%);max-height:min(88vh,850px);overflow:auto;background:#15172a;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.modal-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:18px;margin:0}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
.menu-pop{position:absolute;z-index:40;right:10px;top:54px;min-width:175px;padding:6px;background:#20233a;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.menu-pop button{display:block;width:100%;padding:11px;border-radius:9px;text-align:left;background:transparent;font-size:12px}
.menu-pop button:hover{background:rgba(255,255,255,.07)}
.auth-screen{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);background:var(--bg)}
.auth-art{padding:clamp(30px,7vw,90px);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 20%,rgba(255,79,154,.24),transparent 30%),radial-gradient(circle at 80% 65%,rgba(57,217,230,.18),transparent 35%),#101222}
.auth-art h1{font-size:clamp(40px,6vw,74px);line-height:1;letter-spacing:-3px;margin:25px 0}
.auth-art p{max-width:450px;color:#c2c4da;line-height:1.8}
.auth-art .feature-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.auth-card-wrap{display:grid;place-items:center;padding:25px}
.auth-card{width:min(420px,100%);padding:30px}
.auth-card h2{font-size:25px;letter-spacing:-.8px;margin-bottom:8px}
.auth-card>p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:22px}
.auth-form{display:grid;gap:14px}
.auth-toggle{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
.auth-toggle button{color:var(--cyan);font-weight:800;background:transparent}
.bottom-nav{display:none}
.mobile-only{display:none}
.footer-note{color:var(--subtle);font-size:10px;line-height:1.7;padding:15px 12px}
.divider{height:1px;background:var(--line);margin:18px 0}
.video-badge{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);padding:6px 8px;border-radius:8px;font-size:11px}
.progress-track{height:5px;background:var(--panel3);border-radius:10px;overflow:hidden;margin-top:12px}
.progress-fill{height:100%;width:0;background:var(--grad);transition:width .2s}
.file-label{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
@media(max-width:1150px){
  :root{--navw:218px}
  .layout-two{grid-template-columns:minmax(0,1fr) 260px;gap:18px}
  .upload-layout{grid-template-columns:minmax(0,1fr) 280px}
  .explore-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  :root{--navw:76px}
  .sidebar{padding:20px 10px;align-items:center}
  .nav-item{justify-content:center;padding:13px 8px}
  .nav-item .nav-label,.sidebar .brand-name,.sidebar .nav-caption,.sidebar .footer-note{display:none}
  .sidebar .brand{margin-bottom:20px}
  .sidebar .brand-mark{width:45px;height:45px}
  .layout-two{grid-template-columns:1fr}
  .right-rail{display:none}
  .upload-layout{grid-template-columns:1fr}
  .upload-side{display:grid;grid-template-columns:1fr 1fr;gap:12px}
}
@media(max-width:620px){
  .topbar{height:64px;padding:0 13px}
  .topbar .brand-name{font-size:18px}
  .brand-mark{width:36px;height:36px;border-radius:12px}

  <small id="username-status" style="display:block;margin-top:6px;font-size:13px" aria-live="polite"></small>
</div>`:""}
              <div><label class="label" for="auth-password">Password</label><input class="field" id="auth-password" name="password" type="password" placeholder="At least 6 characters" minlength="6" autocomplete="${signup?"new-password":"current-password"}" required></div>

  async function requestPasswordReset() {
  const username = String(
    $("#auth-username")?.value || ""
  ).trim().toLowerCase();

  if (!username) {
    toast("Pehle apna username likho.", "error");
    $("#auth-username")?.focus();

  }

  const button = $("#forgot-password");

          "Content-Type": "application/json",

          "Authorization": `Bearer ${CONFIG.SUPABASE_ANON_KEY}`

  event.preventDefault();
  if (!state.client) return;

  const form = new FormData(event.currentTarget);

        .trim().toLowerCase()
        .replace(/[^a-z0-9_.]/g, "");

      const { data, error } = await state.client.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName,
            username
          }
        }
      });

      if (error) throw error;

      if (data.user) {
        const { error: profileError } = await state.client
          .from("profiles")
          .upsert({
            id: data.user.id,
            username,
            full_name: fullName,
            updated_at: new Date().toISOString()
          }, { onConflict: "id" });

        if (profileError) {
          console.error("Profile create:", profileError.message);

      if (!data.session) {

        toast("Welcome to Gromazeef!", "success");

            "Content-Type": "application/json",
            "apikey": CONFIG.SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${CONFIG.SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ username, password })
        }
      );

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.error || "Username ya password galat hai.");
      }

      if (!result.session?.access_token || !result.session?.refresh_token) {
        throw new Error("Login session nahi mili.");
      }

      const { error } = await state.client.auth.setSession({
        access_token: result.session.access_token,
        refresh_token: result.session.refresh_token

      if (error) throw error;

      toast("Welcome back to Gromazeef!", "success");

  function friendlyError(error) {
    const message = String(error?.message || error || "Something went wrong");
    if(/invalid login credentials/i.test(message)) return "Email ya password sahi nahi hai.";
    if(/email not confirmed/i.test(message)) return "Pehle email verification complete karo.";
    if(/row-level security|permission denied/i.test(message)) return "Database security policy permission nahi de rahi. Supabase RLS policies check karni hongi.";
    if(/duplicate key/i.test(message)) return "Ye username ya record pehle se maujood hai.";
    if(/fetch/i.test(message)) return "Network issue. Internet check karke dobara try karo.";
    return message;
  }

  async function fetchProfile(userId) {
    if(!state.client || !userId) return null;
    const {data,error}=await state.client.from("profiles").select("*").eq("id",userId).maybeSingle();
    if(error) { console.warn("Profile fetch:",error.message); return null; }
    return data;
  }

  async function ensureProfile() {
    if(!state.user) return;
    let profile=await fetchProfile(state.user.id);
    if(!profile) {
      const meta=state.user.user_metadata||{};
      const fallback=(state.user.email||"member").split("@")[0].replace(/[^a-z0-9_.]/gi,"").toLowerCase();
      const candidate=String(meta.username||fallback||"member").slice(0,24);
      const {data,error}=await state.client.from("profiles").upsert({
        id:state.user.id,username:candidate,full_name:meta.full_name||candidate,updated_at:new Date().toISOString()
      },{onConflict:"id"}).select().maybeSingle();
      if(!error) profile=data;
    }
    state.profile=profile||{id:state.user.id,username:(state.user.email||"member").split("@")[0],full_name:state.user.user_metadata?.full_name||"Gromazeef member"};
  }

  async function fetchFeed({type=null,limit=30,userId=null}={}) {
    if(!state.client) return [];
    let query=state.client.from("posts").select("*").order("created_at",{ascending:false}).limit(limit);
    if(userId) query=query.eq("user_id",userId);
    if(type) query=query.eq("type",type);
    const {data,error}=await query;
    if(error) {
      console.warn("Posts query:",error.message);
      // Some projects use post_type rather than type; retry using the common alternative.
      if(type) {
        const retry=await state.client.from("posts").select("*").eq("post_type",type).order("created_at",{ascending:false}).limit(limit);
        if(!retry.error) return enrichPosts(retry.data||[]);
      }
      return [];
    }
    return enrichPosts(data||[]);
  }

  async function enrichPosts(posts) {
    if(!posts.length) return [];
    const ids=[...new Set(posts.map(post=>post.user_id).filter(Boolean))];
    let profiles=[];
    if(ids.length) {
      const {data,error}=await state.client.from("profiles").select("*").in("id",ids);
      if(!error) profiles=data||[];
    }
    const map=new Map(profiles.map(profile=>[profile.id,profile]));
    return posts.map(post=>({...post,profile:map.get(post.user_id)||{id:post.user_id,username:"member",full_name:"Gromazeef member"}}));
  }

  async function loadSocialState(posts=[]) {
    if(!state.user) return;
    state.likedIds.clear();state.savedIds.clear();
    const localSaved=JSON.parse(localStorage.getItem("gromazeef-saved-"+(state.user?.id||"guest"))||"[]");
    localSaved.forEach(id=>state.savedIds.add(id));
    const ids=posts.map(post=>post.id).filter(Boolean);
    if(ids.length) {
      const likes=await state.client.from("likes").select("post_id").eq("user_id",state.user.id).in("post_id",ids);
      if(!likes.error) (likes.data||[]).forEach(row=>state.likedIds.add(row.post_id));
      const saves=await state.client.from("saved_posts").select("post_id").eq("user_id",state.user.id).in("post_id",ids);
      if(!saves.error) (saves.data||[]).forEach(row=>state.savedIds.add(row.post_id));
    }
    const follows=await state.client.from("follows").select("following_id").eq("follower_id",state.user.id);
    if(!follows.error) (follows.data||[]).forEach(row=>state.followedIds.add(row.following_id));
  }

  async function fetchStrips() {
    if(!state.client || !state.user) return [];
    const {data,error}=await state.client.from("strips").select("*").order("created_at",{ascending:false}).limit(30);
    if(error) {console.warn("Strips:",error.message);return [];}
    return enrichPosts(data||[]);
  }

  async function fetchMessages(partnerId) {
    const table=state.client.from("messages");
    const result=await table.select("*").or(`and(sender_id.eq.${state.user.id},receiver_id.eq.${partnerId}),and(sender_id.eq.${partnerId},receiver_id.eq.${state.user.id})`).order("created_at",{ascending:true}).limit(300);
    if(result.error) console.warn("Messages query:",result.error.message);
    const rows=result.error?[]:result.data||[];
    const unread=rows.filter(message=>message.receiver_id===state.user.id&&!message.read_at);
    if(unread.length) {
      const ids=unread.map(message=>message.id);
      await state.client.from("messages").update({read_at:new Date().toISOString(),is_read:true}).in("id",ids);
    }
    return rows;
  }

  async function sendMessage(event) {
    event.preventDefault();
    if(!state.chatPartner) return;
    const form=new FormData(event.currentTarget);
    const content=String(form.get("message")||"").trim();
    if(!content) return;
    const payload={sender_id:state.user.id,receiver_id:state.chatPartner,message_text:content,created_at:new Date().toISOString()};
    const result=await state.client.from("messages").insert(payload);
    if(result.error) {toast("Message send nahi hua: "+friendlyError(result.error),"error");return;}
    event.currentTarget.reset();
    await renderMessages($("#page-root"));
  }

  async function uploadPost(event) {
    event.preventDefault();
    const file=state.selectedFile;
    if(!file) {toast("Pehle photo ya video select karo.","error");return;}
    const submit=$("#upload-submit");
    submit.disabled=true;submit.textContent="Uploading…";
    $("#upload-progress").classList.remove("hidden");
    const progress=(percent,status)=>{$("#upload-percent").textContent=percent+"%";$("#upload-progress-fill").style.width=percent+"%";$("#upload-status").textContent=status;};
    try {
      progress(8,"Preparing media…");
      const extension=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
      const path=`${state.user.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${extension}`;
      progress(18,"Uploading media…");
      const {data:storageData,error:storageError}=await state.client.storage.from(CONFIG.STORAGE_BUCKET).upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type||undefined});
      if(storageError) throw storageError;
      const {data:urlData}=state.client.storage.from(CONFIG.STORAGE_BUCKET).getPublicUrl(storageData.path);
      const publicUrl=urlData?.publicUrl;
      if(!publicUrl) throw new Error("Public media URL nahi mil paaya. Bucket public hai ya nahi check karo.");
      progress(72,"Saving post…");
      const caption=$("#upload-caption").value.trim();
      const tags=$("#upload-tags").value.trim().split(/\s+/).filter(Boolean);
      const payload={
        user_id:state.user.id,
        type:state.selectedUploadType,
        post_type:state.selectedUploadType,
        media_url:publicUrl,
        caption,
        tags,
        created_at:new Date().toISOString()
      };
      // First try the schema used by the app; retry without optional columns if needed.
      let result=await state.client.from(state.selectedUploadType==="strip"?"strips":"posts").insert(payload).select().single();
      if(result.error) {
        const fallback={user_id:state.user.id,media_url:publicUrl,caption,created_at:new Date().toISOString()};
        result=await state.client.from(state.selectedUploadType==="strip"?"strips":"posts").insert(fallback).select().single();
      }
      if(result.error) throw result.error;
      progress(100,"Shared successfully!");
      toast("Your "+state.selectedUploadType+" is live!","success");
      state.selectedFile=null;
      if(state.uploadObjectUrl) URL.revokeObjectURL(state.uploadObjectUrl);
      state.uploadObjectUrl="";
      state.selectedUploadType="grom";
      setTimeout(()=>navigate("home"),650);
    } catch(error) {
      console.error(error);
      toast("Upload failed: "+friendlyError(error),"error");
      progress(0,"Upload failed");
    } finally {
      submit.disabled=false;submit.textContent="Share "+(state.selectedUploadType==="zeef"?"Zeef":state.selectedUploadType==="strip"?"Strip":"Grom")+" →";
    }
  }

  async function openComments(postId) {
    const post=[...state.feed,...state.profilePosts,...state.searchResults.posts].find(item=>String(item.id)===String(postId));
    const result=await state.client.from("comments").select("*").eq("post_id",postId).order("created_at",{ascending:true}).limit(100);
    if(result.error){toast("Comments load nahi hue: "+friendlyError(result.error),"error");return;}
    const comments=result.data||[]; const ids=[...new Set(comments.map(c=>c.user_id).filter(Boolean))];
    const prof=ids.length?await state.client.from("profiles").select("id,username,full_name,avatar_url").in("id",ids):{data:[]};
    const map=new Map((prof.data||[]).map(p=>[p.id,p]));
    const body=comments.length?comments.map(c=>{const u=map.get(c.user_id)||{};return `<div class="row" style="align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)">${defaultAvatar(u,"sm")}<div style="flex:1;min-width:0"><strong>@${esc(username(u))}</strong><div style="font-size:13px;line-height:1.5;margin-top:4px">${esc(c.comment_text||c.content||"")}</div><small class="muted">${esc(timeAgo(c.created_at))}</small></div></div>`;}).join(""):`<div class="empty-state"><div class="empty-icon">◌</div><h3>No comments yet</h3><p>Start the conversation.</p></div>`;
    openModal("Comments",`<div id="comments-full-list">${body}</div><form id="comments-full-form" class="comment-form" data-comment-form="${esc(postId)}"><input name="comment" placeholder="Write a comment…" maxlength="1000" required><button type="submit">Post</button></form>`);

  async function createActivityNotification(targetUserId, type, postId, message) {
    if(!state.client || !state.user || !targetUserId || targetUserId===state.user.id) return;
    const payload={user_id:targetUserId,actor_id:state.user.id,type,post_id:postId||null,message,created_at:new Date().toISOString(),is_read:false};
    const result=await state.client.from("notifications").insert(payload);
    if(result.error) console.warn("Notification not saved; check notifications table columns and RLS:",result.error.message);
  }

  async function postOwner(postId) {
    const cached=[...state.feed,...state.profilePosts].find(post=>String(post.id)===String(postId));
    if(cached?.user_id) return cached.user_id;
    const result=await state.client.from("posts").select("user_id").eq("id",postId).maybeSingle();
    return result.data?.user_id||null;
  }

  async function toggleLike(postId,button) {
    const liked=state.likedIds.has(postId);
    button.disabled=true;
    try {
      if(liked) {
        const result=await state.client.from("likes").delete().eq("post_id",postId).eq("user_id",state.user.id);
        if(result.error) throw result.error;
        state.likedIds.delete(postId);
      } else {
        const result=await state.client.from("likes").insert({post_id:postId,user_id:state.user.id});
        if(result.error) throw result.error;
        state.likedIds.add(postId);
        const ownerId=await postOwner(postId);
        await createActivityNotification(ownerId,"like",postId,`${displayName(state.profile)} liked your post.`);
      }
      const card=button.closest("[data-post-card]");
      button.textContent=state.likedIds.has(postId)?"♥":"♡";
      button.style.color=state.likedIds.has(postId)?"var(--pink)":"";
      const meta=$(".post-meta",card);
      if(meta) {
        const post=state.feed.find(item=>item.id===postId)||state.profilePosts.find(item=>item.id===postId);
        const base=Number(post?.likes_count??post?.like_count??0);
        meta.innerHTML=`<strong>${fmtCount(Math.max(0,base+(state.likedIds.has(postId)?1:-1*(base>0?1:0))))} likes</strong> · ${esc(meta.textContent.split("·")[1]?.trim()||"0 comments")}`;
      }
    } catch(error) {toast("Like update nahi hua: "+friendlyError(error),"error");}
    finally {button.disabled=false;}
  }

  async function toggleSave(postId,button) {
    const saved=state.savedIds.has(postId);
    try {
      // Prefer the persistent Supabase table when configured; local per-account fallback keeps Save usable without it.
      if(saved) {
        const result=await state.client.from("saved_posts").delete().eq("post_id",postId).eq("user_id",state.user.id);
        if(result.error && !/saved_posts|does not exist|schema cache/i.test(result.error.message||"")) throw result.error;
        state.savedIds.delete(postId);
      } else {
        const result=await state.client.from("saved_posts").insert({post_id:postId,user_id:state.user.id});
        if(result.error && !/saved_posts|does not exist|schema cache/i.test(result.error.message||"")) throw result.error;
        state.savedIds.add(postId);
      }
      localStorage.setItem("gromazeef-saved-"+state.user.id,JSON.stringify([...state.savedIds]));
      button.textContent=state.savedIds.has(postId)?"▣":"♧";
      toast(state.savedIds.has(postId)?"Saved to your collection":"Removed from saved","success");
    } catch(error) {toast("Save update nahi hua: "+friendlyError(error),"error");}
  }

  async function toggleFollow(targetId,button) {
    if(!targetId||targetId===state.user.id) return;
    const following=state.followedIds.has(targetId);
    button.disabled=true;
    try {
      if(following) {
        const result=await state.client.from("follows").delete().eq("follower_id",state.user.id).eq("following_id",targetId);
        if(result.error) throw result.error;
        state.followedIds.delete(targetId);
      } else {
        const result=await state.client.from("follows").insert({follower_id:state.user.id,following_id:targetId});
        if(result.error) throw result.error;
        state.followedIds.add(targetId);
      }
      button.textContent=state.followedIds.has(targetId)?"Following":"Follow";
      button.classList.toggle("primary",!state.followedIds.has(targetId));
      toast(state.followedIds.has(targetId)?"You're connected now":"Unfollowed","success");
    } catch(error) {toast("Follow update nahi hua: "+friendlyError(error),"error");}
    finally {button.disabled=false;}
  }

  async function submitComment(event) {
    event.preventDefault();
    const form=event.currentTarget;
    const postId=form.dataset.commentForm;
    const content=String(new FormData(form).get("comment")||"").trim();
    if(!content) return;
    let result=await state.client.from("comments").insert({post_id:postId,user_id:state.user.id,comment_text:content});
    if(result.error) result=await state.client.from("comments").insert({post_id:postId,user_id:state.user.id,content});
    if(result.error) {toast("Comment nahi gaya: "+friendlyError(result.error),"error");return;}
    form.reset();
    const ownerId=await postOwner(postId);
    await createActivityNotification(ownerId,"comment",postId,`${displayName(state.profile)} commented on your post: ${content}`);
    await loadComments(postId);
    toast("Comment added","success");
  }

  async function loadComments(postId) {
    const preview=$("#comment-preview-"+CSS.escape(postId));
    if(!preview) return;
    const result=await state.client.from("comments").select("*").eq("post_id",postId).order("created_at",{ascending:true}).limit(20);
    if(result.error) {toast("Comments load nahi hue: "+friendlyError(result.error),"error");return;}
    const comments=result.data||[];
    if(!comments.length) {preview.innerHTML=`<span class="muted">No comments yet. Be the first.</span>`;return;}
    const ids=[...new Set(comments.map(comment=>comment.user_id).filter(Boolean))];
    const profilesResult=ids.length?await state.client.from("profiles").select("id,username,full_name").in("id",ids):{data:[]};
    const profileMap=new Map((profilesResult.data||[]).map(profile=>[profile.id,profile]));
    preview.innerHTML=comments.slice(-3).map(comment=>`<div><strong>@${esc(username(profileMap.get(comment.user_id)))}</strong> ${esc(comment.comment_text||comment.content||"")}</div>`).join("");
  }

  async function sharePost(postId) {
    const url=`${location.origin}${location.pathname}#post-${encodeURIComponent(postId)}`;
    try {
      if(navigator.share) await navigator.share({title:"Gromazeef",text:"Check out this moment on Gromazeef",url});
      else if(navigator.clipboard?.writeText) {await navigator.clipboard.writeText(url);toast("Post link copied","success");}
      else {prompt("Copy post link:",url);}
      const ownerId=await postOwner(postId);
      await createActivityNotification(ownerId,"share",postId,`${displayName(state.profile)} shared your post.`);
    } catch(error) {if(error.name!=="AbortError")toast("Share nahi ho paaya.");}
  }

  function openPostMenu(postId,button) {
    const existing=$(".menu-pop",button.parentElement);
    if(existing){existing.remove();return;}
    const post=[...state.feed,...state.profilePosts].find(item=>item.id===postId);
    const mine=post?.user_id===state.user.id;
    const menu=document.createElement("div");
    menu.className="menu-pop";
    menu.innerHTML=`${mine?`<button data-edit-post="${esc(postId)}">✎ Edit caption</button><button data-delete-post="${esc(postId)}" style="color:#ff7996">⌫ Delete post</button>`:""}<button data-interest="${esc(postId)}">♡ Interested</button><button data-not-interest="${esc(postId)}">⊘ Not interested</button><button data-report-post="${esc(postId)}">⚑ Report post</button><button data-copy-post="${esc(postId)}">↗ Copy link</button>`;
    button.parentElement.appendChild(menu);
    $("[data-edit-post]",menu)?.addEventListener("click",()=>openEditPost(post));
    $("[data-delete-post]",menu)?.addEventListener("click",()=>confirmDeletePost(post));
    $("[data-report-post]",menu)?.addEventListener("click",()=>openReport("post",postId));
    $("[data-copy-post]",menu)?.addEventListener("click",()=>sharePost(postId));
    document.addEventListener("click",function closeMenu(event){if(!menu.contains(event.target)&&event.target!==button){menu.remove();document.removeEventListener("click",closeMenu);}});
  }

  function openModal(title,body,options={}) {
    const root=$("#modal-root");
    root.innerHTML=`<div class="modal-backdrop" data-modal-backdrop><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-modal-close aria-label="Close">×</button></header><div class="modal-body">${body}</div>${options.footer?`<footer class="modal-foot">${options.footer}</footer>`:""}</section></div>`;
    $("[data-modal-close]",root).addEventListener("click",closeModal);
    $("[data-modal-backdrop]",root).addEventListener("click",event=>{if(event.target===event.currentTarget)closeModal();});
    document.addEventListener("keydown",function escModal(event){if(event.key==="Escape"){closeModal();document.removeEventListener("keydown",escModal);}});
    return root;
  }

  function closeModal() {$("#modal-root").innerHTML="";}

  function openEditProfile(profile) {
    const root=openModal("Edit profile",`<form id="edit-profile-form" class="stack">
      <div><label class="label">Full name</label><input class="field" name="full_name" maxlength="70" value="${esc(profile.full_name||profile.name||"")}" required></div>
      <div><label class="label">Username</label><input class="field" name="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_.]+" value="${esc(profile.username||"")}" required></div>
      <div><label class="label">Bio</label><textarea class="field" name="bio" maxlength="300">${esc(profile.bio||"")}</textarea></div>
      <div><label class="label">Avatar image URL</label><input class="field" name="avatar_url" type="url" value="${esc(avatarUrl(profile))}" placeholder="https://…"></div>
      <div><label class="label">Website (optional)</label><input class="field" name="website" type="url" value="${esc(profile.website||"")}" placeholder="https://…"></div>
      <button class="btn primary" type="submit">Save changes</button>
    </form>`);
    $("#edit-profile-form",root).addEventListener("submit",async event=>{
      event.preventDefault();
      const form=new FormData(event.currentTarget);
      const payload={id:state.user.id,full_name:String(form.get("full_name")||"").trim(),username:String(form.get("username")||"").trim().toLowerCase(),bio:String(form.get("bio")||"").trim(),avatar_url:String(form.get("avatar_url")||"").trim(),website:String(form.get("website")||"").trim(),updated_at:new Date().toISOString()};
      const {data,error}=await state.client.from("profiles").upsert(payload,{onConflict:"id"}).select().single();
      if(error){toast("Profile save nahi hua: "+friendlyError(error),"error");return;}
      state.profile=data;closeModal();toast("Profile updated","success");renderShell();navigate("profile");
    });
  }

  function openProfileMenu(profile) {
    const own=profile.id===state.user.id;
    const root=openModal("Profile options",`<div class="stack">
      ${own?`<button class="btn" id="menu-edit-profile">✎ Edit profile</button><button class="btn" data-page="dashboard">◉ Creator dashboard</button><button class="btn" data-page="settings">⚙ Settings and activity</button><button class="btn" id="menu-account-details">ⓘ About this account</button><button class="btn" id="menu-logout">↪ Log out</button>`:`<button class="btn" id="menu-about-account">ⓘ About this account</button><button class="btn" id="menu-hide-story">◉ Hide their story</button><button class="btn" id="menu-restrict-user">⊘ Restrict sharing</button><button class="btn" id="menu-report-user">⚑ Report account</button><button class="btn danger" id="menu-block-user">⊘ Block account</button>`}
    </div>`);
    $("#menu-edit-profile")?.addEventListener("click",()=>{closeModal();openEditProfile(profile);});
    $("#menu-account-details")?.addEventListener("click",()=>openModal("About this account",`<p><b>Name:</b> ${esc(displayName(profile))}</p><p><b>Username:</b> @${esc(username(profile))}</p><p><b>Account ID:</b> ${esc(profile.id||"")}</p><p class="muted">Email and private security details are not shown publicly.</p>`));
    $("#menu-about-account")?.addEventListener("click",()=>openModal("About this account",`<p><b>Name:</b> ${esc(displayName(profile))}</p><p><b>Username:</b> @${esc(username(profile))}</p><p><b>Profile created:</b> ${esc(profile.created_at?new Date(profile.created_at).toLocaleDateString():"Not available")}</p><p class="muted">Private account details are never exposed here.</p>`));
    $("#menu-hide-story")?.addEventListener("click",()=>{const arr=JSON.parse(localStorage.getItem("gromazeef-muted-accounts")||"[]");const key="@"+username(profile);if(!arr.includes(key))arr.push(key);localStorage.setItem("gromazeef-muted-accounts",JSON.stringify(arr));closeModal();toast("Story hide preference saved on this device.","success");});
    $("#menu-restrict-user")?.addEventListener("click",()=>{const arr=JSON.parse(localStorage.getItem("gromazeef-restricted-accounts")||"[]");const key="@"+username(profile);if(!arr.includes(key))arr.push(key);localStorage.setItem("gromazeef-restricted-accounts",JSON.stringify(arr));closeModal();toast("Restrict preference saved locally. Server enforcement needs a blocks/restrictions table.","success");});
    $("#menu-logout")?.addEventListener("click",logout);
    $("#menu-report-user")?.addEventListener("click",()=>openReport("user",profile.id));
    $("#menu-block-user")?.addEventListener("click",()=>toast("Blocking needs a configured blocks table and RLS policies."));
    $$("[data-page]",root).forEach(button=>button.addEventListener("click",()=>{closeModal();navigate(button.dataset.page);}));
  }

  function openEditPost(post) {
    if(!post) return;
    const root=openModal("Edit caption",`<form id="edit-post-form" class="stack"><label class="label">Caption</label><textarea class="field" name="caption" maxlength="2200">${esc(post.caption||"")}</textarea><button class="btn primary" type="submit">Save caption</button></form>`);
    $("#edit-post-form",root).addEventListener("submit",async event=>{
      event.preventDefault();
      const caption=new FormData(event.currentTarget).get("caption")||"";
      const result=await state.client.from("posts").update({caption}).eq("id",post.id).eq("user_id",state.user.id);
      if(result.error){toast("Caption update nahi hua: "+friendlyError(result.error),"error");return;}
      closeModal();toast("Caption updated","success");renderPage();
    });
  }

  function confirmDeletePost(post) {
    if(!post) return;
    const root=openModal("Delete this post?",`<p class="muted" style="line-height:1.7">This removes the post record. The uploaded media file may remain in storage unless it is deleted separately.</p><div class="row"><button class="btn" id="cancel-delete">Cancel</button><button class="btn danger" id="confirm-delete">Delete post</button></div>`);
    $("#cancel-delete",root).addEventListener("click",closeModal);
    $("#confirm-delete",root).addEventListener("click",async()=>{
      const result=await state.client.from("posts").delete().eq("id",post.id).eq("user_id",state.user.id);
      if(result.error){toast("Delete nahi hua: "+friendlyError(result.error),"error");return;}
      closeModal();toast("Post deleted","success");renderPage();
    });
  }

  function openReport(targetType,targetId) {
    const root=openModal("Report",`<form id="report-form" class="stack"><p class="small muted">Tell us what needs attention. Please report honestly.</p><label class="label">Reason</label><select class="field" name="reason"><option>Spam</option><option>Harassment or bullying</option><option>Harmful content</option><option>Impersonation</option><option>Copyright concern</option><option>Other</option></select><label class="label">Details (optional)</label><textarea class="field" name="details" maxlength="1000" placeholder="Add context…"></textarea><button class="btn primary" type="submit">Submit report</button></form>`);
    $("#report-form",root).addEventListener("submit",async event=>{
      event.preventDefault();
      const form=new FormData(event.currentTarget);
      const payload={reporter_id:state.user.id,target_type:targetType,target_id:targetId,reason:form.get("reason"),details:form.get("details"),created_at:new Date().toISOString()};
      const result=await state.client.from("reports").insert(payload);
      if(result.error){toast("Report submit nahi hua. Reports table/policies configure karni hongi.","error");return;}
      closeModal();toast("Report received. Thank you.","success");
    });
  }

  async function openPostDetail(postId) {
    const post=[...state.feed,...state.profilePosts,...state.searchResults.posts].find(item=>item.id===postId);
    if(!post){toast("Post details nahi mil paaye.");return;}
    const media=safeUrl(mediaUrl(post));
    const video=postType(post).includes("zeef")||/\.(mp4|mov|webm)(\?|$)/i.test(media);
    openModal("Post",`${media?(video?`<video class="post-media" src="${esc(media)}" controls playsinline></video>`:`<img class="post-media" src="${esc(media)}" alt="">`):""}<p style="margin-top:15px;white-space:pre-wrap">${esc(post.caption||"")}</p><div class="row">${defaultAvatar(post.profile,"sm")}<div><strong>${esc(displayName(post.profile))}</strong><div class="small muted">@${esc(username(post.profile))}</div></div></div>`);
  }

  async function openStrip(stripId) {
    const strip=state.strips.find(item=>String(item.id)===String(stripId));
    if(!strip){toast("Strip unavailable.");return;}
    const media=safeUrl(mediaUrl(strip));
    const video=postType(strip).includes("video")||/\.(mp4|mov|webm)(\?|$)/i.test(media);
    let views="View count unavailable";
    try {
      const count=await state.client.from("strip_views").select("id",{count:"exact",head:true}).eq("strip_id",strip.id);
      if(!count.error) views=`${count.count||0} views`;
      await state.client.from("strip_views").upsert({strip_id:strip.id,viewer_id:state.user.id},{onConflict:"strip_id,viewer_id",ignoreDuplicates:true});
    } catch(_){}
    const link=`${location.origin}${location.pathname}#strip-${encodeURIComponent(strip.id)}`;
    openModal("Strip",`${media?(video?`<video class="post-media" src="${esc(media)}" autoplay playsinline controls></video>`:`<img class="post-media" src="${esc(media)}" alt="Strip media">`):""}<p style="margin-top:12px">${esc(strip.caption||"")}</p><div class="small muted">Shared by @${esc(username(strip.profile))} · ${esc(timeAgo(strip.created_at))} · ${esc(views)}</div><div class="row" style="margin-top:14px"><button class="btn" id="strip-copy-link">↗ Copy link</button><button class="btn" id="strip-report">⚑ Report</button></div>`,{footer:`<button class="btn" data-modal-close>Close</button>`});
    $("#strip-copy-link")?.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(link);toast("Strip link copied","success");}catch(_){prompt("Copy strip link",link);}});
    $("#strip-report")?.addEventListener("click",()=>openReport("strip",strip.id));
  }

  async function filterExplore(filter,button) {
    $$(".chip[data-explore-filter]").forEach(chip=>chip.classList.toggle("active",chip===button));
    if(filter==="people") {
      const results=$("#explore-results");
      const users=state.exploreUsers;
      results.innerHTML=`<div class="explore-grid">${users.length?users.map(exploreUserHTML).join(""):emptyHTML("explore")}</div>`;
      bindGlobalActions(results);
    } else if(filter==="groms"||filter==="zeefs"||filter==="trending"||filter==="all") {
      const posts=await fetchFeed({limit:50});
      const filtered=filter==="groms"?posts.filter(p=>!postType(p).includes("zeef")&&!postType(p).includes("video")):filter==="zeefs"?posts.filter(p=>postType(p).includes("zeef")||postType(p).includes("video")):filter==="trending"?[...posts].sort((a,b)=>Number(b.likes_count||0)-Number(a.likes_count||0)):posts;
      const users=state.exploreUsers;
      $("#explore-results").innerHTML=`${filter==="all"||filter==="trending"?`<div class="between" style="margin-bottom:13px"><h2 class="section-title">${filter==="trending"?"Trending moments":"Creators you might like"}</h2></div><div class="explore-grid">${users.slice(0,6).map(exploreUserHTML).join("")}</div>`:""}<div class="between" style="margin:25px 0 13px"><h2 class="section-title">${filter==="zeefs"?"Zeefs":filter==="groms"?"Groms":filter==="trending"?"Popular this week":"Fresh from the community"}</h2></div><div class="grid-posts">${filtered.length?filtered.map(exploreTileHTML).join(""):emptyHTML("posts")}</div>`;
      bindGlobalActions($("#explore-results"));
    }
  }

  async function sortZeefs(sort,button) {
    $$(".chip[data-zeef-sort]").forEach(chip=>chip.classList.toggle("active",chip===button));
    let posts=await fetchFeed({type:"zeef",limit:40});
    if(!posts.length) posts=(await fetchFeed({limit:50})).filter(post=>postType(post).includes("zeef")||postType(post).includes("video"));
    if(sort==="popular") posts.sort((a,b)=>Number(b.likes_count||b.like_count||0)-Number(a.likes_count||a.like_count||0));
    $("#zeef-feed").innerHTML=posts.length?posts.map(postHTML).join(""):emptyHTML("zeefs");
    bindGlobalActions($("#zeef-feed"));
  }

  function debounce(fn,wait) {
    let timer;
    return (...args)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...args),wait);};
  }

  async function logout() {
    if(!state.client) return;
    const {error}=await state.client.auth.signOut();
    if(error){toast("Logout nahi hua: "+friendlyError(error),"error");return;}
    if(state.pollTimer) clearInterval(state.pollTimer);
    state.session=null;state.user=null;state.profile=null;state.feed=[];state.followedIds.clear();
    closeModal();state.authMode="login";renderAuth();toast("You have logged out","success");
  }

  async function bootstrap() {
    state.client=createClient();
    if(!state.client) {
      $("#app").innerHTML=`<div class="auth-screen"><div class="auth-card card" style="margin:auto"><h2>Gromazeef couldn't start</h2><p class="muted">Supabase library load nahi hui. Internet check karke page refresh karo.</p></div></div>`;
      return;
    }
    const {data,error}=await state.client.auth.getSession();
    if(error) console.warn(error);
    state.session=data?.session||null;
    state.user=state.session?.user||null;
    state.client.auth.onAuthStateChange((event,session)=>{
      // Defer follow-up calls so auth callback does not block Supabase internals.
      setTimeout(async()=>{
        state.session=session;state.user=session?.user||null;
        if(state.user) {await ensureProfile();renderShell();if(event==="PASSWORD_RECOVERY")openUpdatePassword();}
        else renderAuth();
      },0);
    });
    if(state.user) {
      await ensureProfile();
      renderShell();
      startRefresh();
    } else {
      renderAuth();
    }
  }

  function startRefresh() {
    if(state.pollTimer) clearInterval(state.pollTimer);
    state.pollTimer=setInterval(async()=>{
      if(!state.user||document.hidden) return;
      if(state.page==="messages"&&state.chatPartner) {
        const messages=await fetchMessages(state.chatPartner);
        const body=$("#chat-body");
        if(body) {
          const nearBottom=body.scrollHeight-body.scrollTop-body.clientHeight<120;
          body.innerHTML=messages.length?messages.map(messageHTML).join(""):`<div class="chat-empty"><strong>Say hello</strong></div>`;
          if(nearBottom) body.scrollTop=body.scrollHeight;
        }
      }
    },12000);
  }

  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state.user&&state.page==="messages")renderMessages($("#page-root"));});
  window.addEventListener("hashchange",()=>{const match=location.hash.match(/^#post-(.+)$/);if(match)openPostDetail(decodeURIComponent(match[1]));const strip=location.hash.match(/^#strip-(.+)$/);if(strip)openStrip(decodeURIComponent(strip[1]));});
  bootstrap();
})();
</script>
</body>
</html>
