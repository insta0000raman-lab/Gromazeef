<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b14">
<title>GROMAZEEF</title>
<style>
:root {
  --bg:#090b14;
  --panel:#121626;
  --panel2:#191f33;
  --text:#f5f7ff;
  --muted:#9ba5c1;
  --blue:#5c8dff;
  --purple:#a36aff;
  --border:#2a3048;
  --danger:#ff5475;
  --radius:18px;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Arial,sans-serif;
}
button,input,textarea {font:inherit}
button {cursor:pointer}
button:disabled {opacity:.5;cursor:not-allowed}
a {color:inherit}
.hidden,[hidden] {display:none!important}
.topbar {
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--border);
  background:#0b0e19;
  position:sticky;
  top:0;
  z-index:10;
}
.brand {
  font-weight:900;
  font-size:22px;
  letter-spacing:1px;
  background:linear-gradient(90deg,var(--blue),var(--purple));
  color:transparent;
  background-clip:text;
}
.icon-btn,.btn {
  border:0;
  border-radius:12px;
  padding:10px 14px;
  background:linear-gradient(120deg,var(--blue),var(--purple));
  color:white;
  font-weight:700;
}
.secondary {
  background:var(--panel2);
  border:1px solid var(--border);
}
.danger {background:#562034}
.page {
  width:min(720px,100%);
  margin:auto;
  padding:16px;
  padding-bottom:95px;
}
.card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:16px;
  overflow:hidden;
}
h1,h2,h3,p {overflow-wrap:anywhere}
.muted {color:var(--muted);font-size:13px}
input,textarea {
  width:100%;
  padding:13px;
  margin:6px 0 12px;
  color:var(--text);
  background:#0b0f1d;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
}
input:focus,textarea:focus {border-color:var(--blue)}
textarea {resize:vertical;min-height:75px}
.row {display:flex;gap:10px;align-items:center}
.row>* {min-width:0}
.row input {flex:1}
.actions {display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions button {flex:1}
.avatar {
  width:44px;height:44px;flex-shrink:0;
  display:grid;place-items:center;
  border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  font-weight:800;
  overflow:hidden;
}
.avatar img {width:100%;height:100%;object-fit:cover}
.post-head {display:flex;align-items:center;gap:10px}
.post-media {
  width:100%;
  max-height:620px;
  object-fit:contain;
  background:#05060a;
  border-radius:12px;
  margin-top:12px;
}
.empty {
  text-align:center;
  padding:28px 12px;
  color:var(--muted);
}
.bottom-nav {
  position:fixed;
  bottom:0;left:0;right:0;
  display:flex;justify-content:space-around;
  background:#0b0e19f5;
  border-top:1px solid var(--border);
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  z-index:20;
}
.nav-btn {
  border:0;background:none;color:var(--muted);
  padding:8px 6px;font-size:12px;
}
.nav-btn.active {color:#a8c3ff}
.nav-btn span {display:block;font-size:19px;margin-bottom:3px}
.auth-wrap {
  width:min(420px,100%);
  margin:40px auto;
  padding:18px;
}
.toast {
  position:fixed;bottom:90px;left:50%;
  transform:translateX(-50%);
  z-index:100;
  background:#252c42;color:white;
  border:1px solid #454e6b;
  padding:12px 18px;border-radius:12px;
  width:max-content;max-width:90%;
}
.profile-result {
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
}
.profile-result-left {display:flex;align-items:center;gap:10px;min-width:0}
.stats {display:flex;gap:20px;margin-top:15px}
.strip-row {
  display:flex;gap:12px;overflow-x:auto;padding:8px 0 14px;
}
.strip-item {
  min-width:70px;text-align:center;
  background:none;border:0;color:var(--text);
}
.strip-circle {
  width:60px;height:60px;margin:auto auto 6px;
  border:3px solid var(--purple);border-radius:50%;
  display:grid;place-items:center;overflow:hidden;
}
.strip-circle img {width:100%;height:100%;object-fit:cover}
.comment-row {display:flex;gap:8px;align-items:center}
.comment-row input {margin-bottom:0}
.message {
  max-width:85%;padding:10px 12px;
  margin:8px 0;border-radius:14px;
  overflow-wrap:anywhere;
}
.mine {margin-left:auto;background:#34356d}
.theirs {background:#22283b}
#chatMessages {max-height:50vh;overflow:auto}
@media(min-width:850px) {
  .page {padding-top:24px}
  .bottom-nav {left:50%;right:auto;transform:translateX(-50%);
    width:min(650px,100%);border:1px solid var(--border);
    border-radius:18px 18px 0 0}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">GROMAZEEF</div>
  <button class="icon-btn secondary" onclick="showPage('searchPage')">⌕ Search</button>
</header>

<section id="authScreen" class="auth-wrap">
  <div class="card">
    <h1 class="brand">Welcome to GROMAZEEF 🔥</h1>
    <p class="muted">Connect. Create. Share your world.</p>
    <form id="authForm">
      <label>Email</label>
      <input id="authEmail" type="email" autocomplete="email" required>
      <label>Password</label>
      <input id="authPassword" type="password" minlength="6" required>
      <button class="btn" id="authSubmit" type="submit" style="width:100%">Login</button>
    </form>
    <button class="btn secondary" style="width:100%;margin-top:10px" onclick="authMode()">
      Create account / Switch mode
    </button>
    <button class="btn secondary" style="width:100%;margin-top:10px" onclick="forgotPassword()">
      Forgot password?
    </button>
    <p id="authHint" class="muted">Login to continue.</p>
  </div>
</section>

<main id="appScreen" hidden>
  <section id="homePage" class="page">
    <div class="card">
      <h2>STRIP · Stories</h2>
      <div id="stripRow" class="strip-row"></div>
      <button class="btn" onclick="openStripUpload()">＋ Add story</button>
    </div>
    <form id="postForm" class="card">
      <h2>Create post</h2>
      <textarea id="postCaption" maxlength="2000" placeholder="What's happening?"></textarea>
      <input id="postFile" type="file" accept="image/*,video/*">
      <button class="btn" type="submit">Publish post</button>
    </form>
    <div id="homeFeed"><div class="empty">Loading posts...</div></div>
  </section>

  <section id="searchPage" class="page" hidden>
    <div class="card">
      <h2>Discover people</h2>
      <input id="searchInput" placeholder="Search username or name">
      <div id="searchResults"></div>
    </div>
  </section>

  <section id="zeefPage" class="page" hidden>
    <form id="zeefForm" class="card">
      <h2>Upload ZEEF</h2>
      <p class="muted">Share a short video.</p>
      <input id="zeefFile" type="file" accept="video/*" required>
      <textarea id="zeefCaption" maxlength="1000" placeholder="Add a caption"></textarea>
      <button class="btn" type="submit">Publish ZEEF</button>
    </form>
    <div id="zeefFeed"></div>
  </section>

  <section id="chatPage" class="page" hidden>
    <div class="card">
      <h2>Z-CHAT</h2>
      <div id="chatUsers"></div>
    </div>
    <div id="chatPanel" class="card" hidden>
      <h3 id="chatTitle">Chat</h3>
      <div id="chatMessages"></div>
      <form id="chatForm">
        <input id="chatText" maxlength="3000" placeholder="Write a message..." required>
        <button class="btn" type="submit">Send</button>
      </form>
    </div>
  </section>

  <section id="profilePage" class="page" hidden>
    <div id="profileSummary" class="card"></div>
    <form id="profileEditForm" class="card">
      <h2>Edit profile</h2>
      <label>Name</label><input id="editName" maxlength="80">
      <label>Username</label><input id="editUsername" maxlength="30">
      <label>Bio</label><textarea id="editBio" maxlength="300"></textarea>
      <label>Avatar</label><input id="avatarFile" type="file" accept="image/*">
      <button class="btn" type="submit">Save profile</button>
    </form>
    <form id="emailForm" class="card">
      <h3>Change email</h3>
      <input id="newEmail" type="email" placeholder="New email">
      <button class="btn" type="submit">Update email</button>
    </form>
    <form id="passwordForm" class="card">
      <h3>Change password</h3>
      <input id="newPassword" type="password" minlength="8" placeholder="New password">
      <button class="btn" type="submit">Update password</button>
    </form>
    <h2>My posts</h2>
    <div id="myPosts"></div>
    <button class="btn danger" onclick="logout()">Log out</button>
  </section>
</main>

<nav class="bottom-nav" id="bottomNav" hidden>
  <button class="nav-btn active" data-page="homePage"><span>⌂</span>Home</button>
  <button class="nav-btn" data-page="searchPage"><span>⌕</span>Search</button>
  <button class="nav-btn" data-page="zeefPage"><span>▶</span>ZEEF</button>
  <button class="nav-btn" data-page="chatPage"><span>✉</span>Z-CHAT</button>
  <button class="nav-btn" data-page="profilePage"><span>◎</span>Profile</button>
</nav>
<div id="toastBox" class="toast" hidden></div>
<script>
/* PART 1 END */
  // PART 2 START
const SUPABASE_URL = "https://jwkpergysvdicyzvqypy.supabase.co";
const SUPABASE_KEY = "sb_publishable_Y2J7myGmTRSrRGN5PxnbYg_m07KlrmB";

let db = null;
let currentUser = null;
let currentProfile = null;
let authAction = "login";
let activeChatUser = null;
let searchTimer = null;
let toastTimer = null;

function toast(message) {
  const box = document.getElementById("toastBox");
  if (!box) return;
  box.textContent = String(message || "");
  box.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.hidden = true, 3500);
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[char]);
}

function avatar(url, name) {
  const fallback = esc((name || "U").slice(0,1).toUpperCase());
  if (!url) return `<div class="avatar">${fallback}</div>`;
  return `<div class="avatar"><img src="${esc(url)}" alt="" onerror="this.parentElement.textContent='${fallback}'"></div>`;
}

function mediaMarkup(url, type) {
  if (!url) return "";
  const safe = esc(url);
  if (type === "video") {
    return `<video class="post-media" src="${safe}" controls playsinline preload="metadata"></video>`;
  }
  return `<img class="post-media" src="${safe}" alt="Post media" loading="lazy">`;
}

async function initSupabase() {
  if (!window.supabase) {
    throw new Error("Supabase library load nahi hui. Internet check karo.");
  }
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

function authMode() {
  authAction = authAction === "login" ? "signup" : "login";
  document.getElementById("authSubmit").textContent =
    authAction === "login" ? "Login" : "Create account";
  document.getElementById("authHint").textContent =
    authAction === "login"
      ? "Login to continue."
      : "Naya account banane ke liye details bharo.";
}

async function ensureProfile() {
  if (!currentUser) return;

  const { data: profile, error } = await db
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) throw error;
  if (profile) {
    currentProfile = profile;
    return;
  }

  const base = (currentUser.email || "user")
    .split("@")[0].toLowerCase()
    .replace(/[^a-z0-9_.]/g, "")
    .slice(0,20) || "user";

  const newProfile = {
    id: currentUser.id,
    username: `${base}_${currentUser.id.slice(0,5)}`,
    full_name: base,
    bio: "",
    avatar_url: null
  };

  const result = await db.from("profiles").insert(newProfile);
  if (result.error) throw result.error;
  currentProfile = newProfile;
}

document.getElementById("authForm").addEventListener("submit", async event => {
  event.preventDefault();

  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const button = document.getElementById("authSubmit");

  button.disabled = true;

  try {
    let result;

    if (authAction === "signup") {
      result = await db.auth.signUp({ email, password });
    } else {
      result = await db.auth.signInWithPassword({ email, password });
    }

    if (result.error) throw result.error;

    if (result.data.user) {
      currentUser = result.data.user;

      if (authAction === "signup" && !result.data.session) {
        toast("Email confirmation check karo.");
      } else {
        await enterApp();
      }
    }
  } catch (error) {
    console.error(error);
    toast(error.message || "Authentication error");
  } finally {
    button.disabled = false;
  }
});

async function forgotPassword() {
  const email = document.getElementById("authEmail").value.trim();
  if (!email) return toast("Pehle email likho.");

  try {
    const { error } = await db.auth.resetPasswordForEmail(email);
    if (error) throw error;
    toast("Password reset email check karo.");
  } catch (error) {
    toast(error.message);
  }
}

async function logout() {
  if (!db) return;
  const { error } = await db.auth.signOut();
  if (error) return toast(error.message);

  currentUser = null;
  currentProfile = null;
  activeChatUser = null;

  document.getElementById("appScreen").hidden = true;
  document.getElementById("bottomNav").hidden = true;
  document.getElementById("authScreen").hidden = false;
}
  // PART 3 START
const MEDIA_BUCKET = "gromazeef-media";
const MAX_MEDIA_SIZE = 50 * 1024 * 1024;

async function uploadMedia(file, folder) {
  if (!file) throw new Error("File select karo.");
  if (file.size > MAX_MEDIA_SIZE) throw new Error("File 50 MB se chhoti honi chahiye.");

  const extension = (file.name.split(".").pop() || "bin")
    .toLowerCase().replace(/[^a-z0-9]/g, "");
  const path = `${currentUser.id}/${folder}/${Date.now()}_${crypto.randomUUID()}.${extension}`;

  const { error } = await db.storage
    .from(MEDIA_BUCKET)
    .upload(path, file, { upsert: false, contentType: file.type });

  if (error) throw error;

  const { data } = db.storage.from(MEDIA_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

async function getProfilesFor(ids) {
  if (!ids.length) return {};
  const { data, error } = await db
    .from("profiles")
    .select("id,username,full_name,avatar_url")
    .in("id", [...new Set(ids)]);

  if (error) throw error;
  return Object.fromEntries((data || []).map(profile => [profile.id, profile]));
}

async function loadFeed() {
  if (!currentUser) return;

  const feed = document.getElementById("homeFeed");
  feed.innerHTML = '<div class="empty">Loading posts...</div>';

  try {
    const { data: posts, error } = await db
      .from("posts")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(50);

    if (error) throw error;

    const profiles = await getProfilesFor((posts || []).map(p => p.user_id));
    const { data: likes, error: likeError } = await db
      .from("likes").select("post_id,user_id");

    if (likeError) throw likeError;

    const { data: comments, error: commentError } = await db
      .from("comments")
      .select("*")
      .order("created_at", { ascending: true })
      .limit(300);

    if (commentError) throw commentError;

    const commentProfiles = await getProfilesFor((comments || []).map(c => c.user_id));

    feed.innerHTML = (posts || []).map(post => {
      const owner = profiles[post.user_id] || {};
      const postLikes = (likes || []).filter(l => l.post_id === post.id);
      const postComments = (comments || []).filter(c => c.post_id === post.id);

      return `
        <article class="card">
          <div class="post-head">
            ${avatar(owner.avatar_url, owner.username)}
            <div><strong>${esc(owner.full_name || owner.username || "User")}</strong>
            <div class="muted">@${esc(owner.username || "user")}</div></div>
          </div>
          ${post.caption ? `<p>${esc(post.caption)}</p>` : ""}
          ${mediaMarkup(post.media_url, post.media_type)}
          <div class="actions">
            <button class="btn secondary" onclick="toggleLike('${esc(post.id)}')">
              ${postLikes.some(l => l.user_id === currentUser.id) ? "♥" : "♡"}
              ${postLikes.length}
            </button>
            <button class="btn secondary" onclick="focusComment('${esc(post.id)}')">
              Comments ${postComments.length}
            </button>
          </div>
          <div>
            ${postComments.map(comment => {
              const cp = commentProfiles[comment.user_id] || {};
              return `<p class="muted"><strong>${esc(cp.username || "user")}</strong>
                ${esc(comment.comment_text || "")}</p>`;
            }).join("")}
          </div>
          <form class="comment-row" onsubmit="submitComment(event,'${esc(post.id)}')">
            <input id="comment-${esc(post.id)}" maxlength="1000" placeholder="Write a comment..." required>
            <button class="btn" type="submit">Send</button>
          </form>
        </article>`;
    }).join("") || '<div class="empty">Abhi koi post nahi hai. Pehli post banao!</div>';

  } catch (error) {
    console.error(error);
    feed.innerHTML = `<div class="card">Feed error: ${esc(error.message)}</div>`;
  }
}

document.getElementById("postForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!currentUser) return toast("Pehle login karo.");

  const file = document.getElementById("postFile").files[0];
  const caption = document.getElementById("postCaption").value.trim();

  if (!file && !caption) return toast("Caption ya media add karo.");

  try {
    let mediaUrl = null;
    let mediaType = null;

    if (file) {
      if (!file.type.startsWith("image/") && !file.type.startsWith("video/")) {
        throw new Error("Image ya video select karo.");
      }
      mediaUrl = await uploadMedia(file, "posts");
      mediaType = file.type.startsWith("video/") ? "video" : "image";
    }

    const { error } = await db.from("posts").insert({
      user_id: currentUser.id,
      caption,
      media_url: mediaUrl,
      media_type: mediaType
    });

    if (error) throw error;

    event.target.reset();
    toast("Post publish ho gayi!");
    await loadFeed();
  } catch (error) {
    console.error(error);
    toast(error.message);
  }
});

async function toggleLike(postId) {
  try {
    const { data, error } = await db.from("likes")
      .select("post_id")
      .eq("post_id", postId)
      .eq("user_id", currentUser.id)
      .maybeSingle();

    if (error) throw error;

    const result = data
      ? await db.from("likes").delete().eq("post_id", postId).eq("user_id", currentUser.id)
      : await db.from("likes").insert({ post_id: postId, user_id: currentUser.id });

    if (result.error) throw result.error;
    await loadFeed();
  } catch (error) {
    toast("Like error: " + error.message);
  }
}

function focusComment(postId) {
  document.getElementById(`comment-${postId}`)?.focus();
}

async function submitComment(event, postId) {
  event.preventDefault();

  const input = document.getElementById(`comment-${postId}`);
  const commentText = input.value.trim();

  if (!commentText) return;

  try {
    const { error } = await db.from("comments").insert({
      post_id: postId,
      user_id: currentUser.id,
      comment_text: commentText
    });

    if (error) throw error;
    await loadFeed();
  } catch (error) {
    toast("Comment error: " + error.message);
  }
}
// PART 4 START
async function openStripUpload() {
  if (!currentUser) return toast("Login karo.");

  const picker = document.createElement("input");
  picker.type = "file";
  picker.accept = "image/*,video/*";

  picker.onchange = async () => {
    const file = picker.files[0];
    if (!file) return;

    try {
      if (!file.type.startsWith("image/") && !file.type.startsWith("video/")) {
        throw new Error("Image ya video select karo.");
      }

      const mediaUrl = await uploadMedia(file, "strips");
      const now = new Date();
      const expires = new Date(now.getTime() + 24 * 60 * 60 * 1000);

      const { error } = await db.from("strips").insert({
        user_id: currentUser.id,
        media_url: mediaUrl,
        media_type: file.type.startsWith("video/") ? "video" : "image",
        created_at: now.toISOString(),
        expires_at: expires.toISOString()
      });

      if (error) throw error;

      toast("Story upload ho gayi!");
      await loadStrips();
    } catch (error) {
      toast("Story error: " + error.message);
    }
  };

  picker.click();
}

async function loadStrips() {
  if (!currentUser) return;

  const box = document.getElementById("stripRow");
  if (!box) return;

  try {
    const { data, error } = await db
      .from("strips")
      .select("*")
      .gt("expires_at", new Date().toISOString())
      .order("created_at", { ascending: false })
      .limit(100);

    if (error) throw error;

    const profiles = await getProfilesFor((data || []).map(s => s.user_id));

    box.innerHTML = `
      <button class="strip-item" onclick="openStripUpload()">
        <div class="strip-circle">＋</div>
        Add yours
      </button>
    ` + (data || []).map(strip => {
      const profile = profiles[strip.user_id] || {};
      return `
        <button class="strip-item" onclick="viewStrip('${esc(strip.id)}')">
          <div class="strip-circle">
            ${strip.media_type === "video" ? "▶" : "◉"}
          </div>
          ${esc(profile.username || "User")}
        </button>`;
    }).join("");
  } catch (error) {
    console.error(error);
    box.innerHTML = '<div class="muted">Stories load nahi hui.</div>';
  }
}

async function viewStrip(stripId) {
  try {
    const { data, error } = await db.from("strips")
      .select("*").eq("id", stripId).single();

    if (error) throw error;

    const overlay = document.createElement("div");
    overlay.style.cssText =
      "position:fixed;inset:0;z-index:200;background:#000;display:grid;place-items:center;padding:20px";

    overlay.innerHTML = `
      <button class="btn secondary" style="position:absolute;top:20px;right:20px"
        id="closeStrip">Close ✕</button>
      <div style="width:min(600px,100%)">
        ${mediaMarkup(data.media_url, data.media_type)}
        ${data.user_id === currentUser.id
          ? `<button class="btn danger" id="deleteStrip">Delete story</button>`
          : ""}
      </div>`;

    document.body.appendChild(overlay);
    overlay.querySelector("#closeStrip").onclick = () => overlay.remove();

    const deleteButton = overlay.querySelector("#deleteStrip");
    if (deleteButton) {
      deleteButton.onclick = async () => {
        try {
          const result = await db.from("strips")
            .delete().eq("id", stripId).eq("user_id", currentUser.id);
          if (result.error) throw result.error;
          overlay.remove();
          toast("Story deleted.");
          await loadStrips();
        } catch (error) {
          toast(error.message);
        }
      };
    }
  } catch (error) {
    toast("Story open error: " + error.message);
  }
}
// PART 5 START
document.getElementById("zeefForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!currentUser) return toast("Login karo.");

  const file = document.getElementById("zeefFile").files[0];
  const caption = document.getElementById("zeefCaption").value.trim();

  if (!file) return toast("Video select karo.");
  if (!file.type.startsWith("video/")) return toast("Video file select karo.");

  try {
    const videoUrl = await uploadMedia(file, "zeefs");

    const { error } = await db.from("zeefs").insert({
      user_id: currentUser.id,
      video_url: videoUrl,
      caption
    });

    if (error) throw error;

    event.target.reset();
    toast("ZEEF publish ho gaya!");
    await loadZeefs();
  } catch (error) {
    toast("ZEEF error: " + error.message);
  }
});

async function loadZeefs() {
  if (!currentUser) return;

  const box = document.getElementById("zeefFeed");
  box.innerHTML = '<div class="empty">Loading ZEEF...</div>';

  try {
    const { data, error } = await db
      .from("zeefs")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(30);

    if (error) throw error;

    const profiles = await getProfilesFor((data || []).map(z => z.user_id));

    box.innerHTML = (data || []).map(zeef => {
      const profile = profiles[zeef.user_id] || {};
      return `
        <article class="card">
          <div class="post-head">
            ${avatar(profile.avatar_url, profile.username)}
            <strong>${esc(profile.username || "User")}</strong>
          </div>
          ${mediaMarkup(zeef.video_url, "video")}
          <p>${esc(zeef.caption || "")}</p>
        </article>`;
    }).join("") || '<div class="empty">Abhi koi ZEEF nahi hai.</div>';
  } catch (error) {
    console.error(error);
    box.innerHTML = `<div class="card">ZEEF error: ${esc(error.message)}</div>`;
  }
}
// PART 6 START
async function searchUsers() {
  if (!currentUser) return;

  const term = document.getElementById("searchInput").value.trim();
  const box = document.getElementById("searchResults");

  if (term.length < 2) {
    box.innerHTML = '<div class="empty">Kam se kam 2 characters likho.</div>';
    return;
  }

  try {
    const clean = term.replace(/[,%()]/g, "");

    const { data, error } = await db.from("profiles")
      .select("id,username,full_name,avatar_url,bio")
      .or(`username.ilike.%${clean}%,full_name.ilike.%${clean}%`)
      .limit(30);

    if (error) throw error;

    box.innerHTML = (data || []).map(user => `
      <div class="card profile-result">
        <div class="profile-result-left">
          ${avatar(user.avatar_url, user.username)}
          <div>
            <strong>${esc(user.full_name || user.username)}</strong>
            <div class="muted">@${esc(user.username || "")}</div>
            <p>${esc(user.bio || "")}</p>
          </div>
        </div>
        ${user.id === currentUser.id
          ? '<button class="btn secondary" disabled>You</button>'
          : `<button class="btn" onclick="toggleFollow('${esc(user.id)}',this)">Follow</button>`}
      </div>`).join("") || '<div class="empty">Koi user nahi mila.</div>';

    const { data: follows } = await db.from("follows")
      .select("following_id")
      .eq("follower_id", currentUser.id);

    const following = new Set((follows || []).map(f => f.following_id));

    box.querySelectorAll("button[onclick]").forEach(button => {
      const match = button.getAttribute("onclick").match(/toggleFollow\('([^']+)'/);
      if (match && following.has(match[1])) {
        button.textContent = "Following";
        button.classList.add("secondary");
      }
    });
  } catch (error) {
    box.innerHTML = `<div class="empty">Search error: ${esc(error.message)}</div>`;
  }
}

function debouncedSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(searchUsers, 350);
}

document.getElementById("searchInput").addEventListener("input", debouncedSearch);

async function toggleFollow(userId, button) {
  if (button) button.disabled = true;

  try {
    const { data, error } = await db.from("follows")
      .select("following_id")
      .eq("follower_id", currentUser.id)
      .eq("following_id", userId)
      .maybeSingle();

    if (error) throw error;

    if (data) {
      const result = await db.from("follows").delete()
        .eq("follower_id", currentUser.id)
        .eq("following_id", userId);
      if (result.error) throw result.error;
    } else {
      const result = await db.from("follows").insert({
        follower_id: currentUser.id,
        following_id: userId
      });
      if (result.error) throw result.error;
    }

    await searchUsers();
    await loadProfile();
  } catch (error) {
    toast("Follow error: " + error.message);
  } finally {
    if (button) button.disabled = false;
  }
}

async function loadProfile() {
  if (!currentUser) return;

  try {
    const { data: profile, error } = await db.from("profiles")
      .select("*").eq("id", currentUser.id).single();

    if (error) throw error;
    currentProfile = profile;

    const summary = document.getElementById("profileSummary");
    summary.innerHTML = `
      <div class="post-head">
        ${avatar(profile.avatar_url, profile.username)}
        <div><h2>${esc(profile.full_name || profile.username)}</h2>
        <div class="muted">@${esc(profile.username || "")}</div>
        <p>${esc(profile.bio || "")}</p></div>
      </div>`;

    document.getElementById("editName").value = profile.full_name || "";
    document.getElementById("editUsername").value = profile.username || "";
    document.getElementById("editBio").value = profile.bio || "";

    const { count: followers } = await db.from("follows")
      .select("*", {count:"exact",head:true})
      .eq("following_id", currentUser.id);

    const { count: following } = await db.from("follows")
      .select("*", {count:"exact",head:true})
      .eq("follower_id", currentUser.id);

    summary.innerHTML += `<div class="stats">
      <span><strong>${followers || 0}</strong> Followers</span>
      <span><strong>${following || 0}</strong> Following</span>
    </div>`;

    const { data: posts, error: postsError } = await db.from("posts")
      .select("*").eq("user_id", currentUser.id)
      .order("created_at", {ascending:false});

    if (postsError) throw postsError;

    document.getElementById("myPosts").innerHTML = (posts || []).map(post => `
      <div class="card">
        ${mediaMarkup(post.media_url, post.media_type)}
        <p>${esc(post.caption || "")}</p>
        <button class="btn danger" onclick="deleteMyPost('${esc(post.id)}')">Delete</button>
      </div>`).join("") || '<div class="empty">No posts yet.</div>';

  } catch (error) {
    toast("Profile error: " + error.message);
  }
}

async function saveProfile(event) {
  event.preventDefault();

  const full_name = document.getElementById("editName").value.trim();
  const username = document.getElementById("editUsername").value.trim().toLowerCase();
  const bio = document.getElementById("editBio").value.trim();

  if (!/^[a-z0-9_.]{3,30}$/.test(username)) {
    return toast("Username 3–30 characters ka hona chahiye.");
  }

  try {
    let avatar_url = currentProfile?.avatar_url || null;
    const file = document.getElementById("avatarFile").files[0];

    if (file) {
      if (!file.type.startsWith("image/")) throw new Error("Image select karo.");
      avatar_url = await uploadMedia(file, "avatars");
    }

    const { error } = await db.from("profiles").update({
      full_name, username, bio, avatar_url
    }).eq("id", currentUser.id);

    if (error) throw error;

    toast("Profile updated!");
    await loadProfile();
  } catch (error) {
    toast(error.message);
  }
}

async function deleteMyPost(postId) {
  if (!confirm("Post delete karni hai?")) return;

  try {
    const { error } = await db.from("posts").delete()
      .eq("id", postId).eq("user_id", currentUser.id);

    if (error) throw error;

    toast("Post deleted.");
    await loadFeed();
    await loadProfile();
  } catch (error) {
    toast(error.message);
  }
}

document.getElementById("profileEditForm").addEventListener("submit", saveProfile);
// PART 7 START
async function loadChatUsers() {
  const box = document.getElementById("chatUsers");
  if (!currentUser) return;

  try {
    const { data, error } = await db.from("profiles")
      .select("id,username,full_name,avatar_url")
      .neq("id", currentUser.id).limit(50);

    if (error) throw error;

    box.innerHTML = (data || []).map(user => `
      <button class="card profile-result" style="width:100%;color:inherit"
        onclick="openChat('${esc(user.id)}')">
        <div class="profile-result-left">
          ${avatar(user.avatar_url, user.username)}
          <strong>${esc(user.full_name || user.username)}</strong>
        </div>
        <span>Message</span>
      </button>`).join("") || '<div class="empty">No other users yet.</div>';
  } catch (error) {
    box.innerHTML = `<div class="empty">Chat users error: ${esc(error.message)}</div>`;
  }
}

async function openChat(userId) {
  activeChatUser = userId;
  document.getElementById("chatPanel").hidden = false;

  try {
    const { data, error } = await db.from("profiles")
      .select("username,full_name").eq("id", userId).single();

    if (error) throw error;

    document.getElementById("chatTitle").textContent =
      data.full_name || data.username || "Chat";

    await loadMessages();
  } catch (error) {
    toast(error.message);
  }
}

async function loadMessages() {
  if (!currentUser || !activeChatUser) return;

  const box = document.getElementById("chatMessages");

  try {
    const { data, error } = await db.from("messages")
      .select("*")
      .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeChatUser}),and(sender_id.eq.${activeChatUser},receiver_id.eq.${currentUser.id})`)
      .order("created_at", {ascending:true})
      .limit(200);

    if (error) throw error;

    box.innerHTML = (data || []).map(message => `
      <div class="message ${message.sender_id === currentUser.id ? "mine" : "theirs"}">
        ${esc(message.message_text || "")}
        <div class="muted">${esc(message.created_at || "")}</div>
      </div>`).join("") || '<div class="empty">Say hello 👋</div>';

    box.scrollTop = box.scrollHeight;
  } catch (error) {
    box.innerHTML = `<div class="empty">Chat setup required: ${esc(error.message)}</div>`;
  }
}

document.getElementById("chatForm").addEventListener("submit", async event => {
  event.preventDefault();

  const input = document.getElementById("chatText");
  const message_text = input.value.trim();

  if (!message_text || !activeChatUser) return;

  try {
    const { error } = await db.from("messages").insert({
      sender_id: currentUser.id,
      receiver_id: activeChatUser,
      message_text
    });

    if (error) throw error;

    input.value = "";
    await loadMessages();
  } catch (error) {
    toast("Message error: " + error.message);
  }
});
// PART 8 START
function showPage(pageName) {
  const pages = ["homePage","searchPage","zeefPage","chatPage","profilePage"];

  pages.forEach(id => {
    document.getElementById(id).hidden = id !== pageName;
  });

  document.querySelectorAll("[data-page]").forEach(button => {
    button.classList.toggle("active", button.dataset.page === pageName);
  });

  if (pageName === "homePage") {
    loadFeed();
    loadStrips();
  } else if (pageName === "searchPage") {
    document.getElementById("searchInput").focus();
  } else if (pageName === "zeefPage") {
    loadZeefs();
  } else if (pageName === "chatPage") {
    loadChatUsers();
  } else if (pageName === "profilePage") {
    loadProfile();
  }
}

document.querySelectorAll("[data-page]").forEach(button => {
  button.addEventListener("click", () => showPage(button.dataset.page));
});

async function changeEmail(event) {
  event.preventDefault();
  const email = document.getElementById("newEmail").value.trim();

  if (!email) return toast("New email likho.");

  try {
    const { error } = await db.auth.updateUser({email});
    if (error) throw error;
    toast("Email confirmation check karo.");
  } catch (error) {
    toast(error.message);
  }
}

async function changePassword(event) {
  event.preventDefault();
  const password = document.getElementById("newPassword").value;

  if (password.length < 8) return toast("Password minimum 8 characters.");

  try {
    const { error } = await db.auth.updateUser({password});
    if (error) throw error;
    document.getElementById("newPassword").value = "";
    toast("Password updated.");
  } catch (error) {
    toast(error.message);
  }
}

document.getElementById("emailForm").addEventListener("submit", changeEmail);
document.getElementById("passwordForm").addEventListener("submit", changePassword);
// PART 9 START
async function enterApp() {
  if (!currentUser || !db) return;

  try {
    await ensureProfile();

    document.getElementById("authScreen").hidden = true;
    document.getElementById("appScreen").hidden = false;
    document.getElementById("bottomNav").hidden = false;

    await refreshEverything();
    showPage("homePage");
    toast("Welcome to GROMAZEEF 🔥");
  } catch (error) {
    console.error("App initialization:", error);
    toast("App setup error: " + error.message);
  }
}

async function refreshEverything() {
  await Promise.allSettled([
    loadFeed(),
    loadStrips(),
    loadZeefs(),
    loadProfile()
  ]);
}

function showAuth() {
  document.getElementById("authScreen").hidden = false;
  document.getElementById("appScreen").hidden = true;
  document.getElementById("bottomNav").hidden = true;
}

async function startGromazeef() {
  try {
    await initSupabase();

    const { data, error } = await db.auth.getSession();
    if (error) throw error;

    if (data.session?.user) {
      currentUser = data.session.user;
      await enterApp();
    } else {
      showAuth();
    }

    db.auth.onAuthStateChange((event, session) => {
      setTimeout(async () => {
        if (session?.user) {
          currentUser = session.user;
          if (event === "SIGNED_IN") await enterApp();
        } else {
          currentUser = null;
          currentProfile = null;
          activeChatUser = null;
          showAuth();
        }
      }, 0);
    });

  } catch (error) {
    console.error(error);
    showAuth();
    toast("Connection error: " + error.message);
  }
}

window.addEventListener("online", () => toast("Internet connected."));
window.addEventListener("offline", () => toast("Internet disconnected."));
// PART 10 START
</script>

startGromazeef();
