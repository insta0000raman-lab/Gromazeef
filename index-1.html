*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #aaa2ff;outline-offset:2px}img,video{max-width:100%}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.wrap{max-width:1200px;margin:auto;padding:0 18px}.topbar{height:72px;position:sticky;top:0;z-index:20;background:#ffffffed;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topinner{height:100%;display:flex;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;letter-spacing:-.7px;white-space:nowrap}.brandmark{width:36px;height:36px;border-radius:13px;background:linear-gradient(135deg,var(--brand),#a26cf5);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 6px 15px #6558e833}.spacer{flex:1}.iconbtn,.btn{border:0;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s}.iconbtn{width:42px;height:42px;background:#f1f2f8;color:#30344b;font-size:19px;position:relative}.iconbtn:hover,.btn:hover{transform:translateY(-1px)}.badge{position:absolute;right:4px;top:4px;min-width:8px;height:8px;border-radius:50%;background:#fa5775;border:2px solid white}.btn{padding:11px 16px;font-weight:750}.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:white;box-shadow:0 6px 16px #6558e829}.secondary{background:var(--soft);color:var(--brand)}.plain{background:#f1f2f7;color:var(--text)}.danger{background:#fff0f2;color:var(--danger)}.searchbox{display:flex;align-items:center;gap:8px;background:#f1f2f8;border-radius:14px;padding:0 12px;max-width:340px;width:100%}.searchbox input{width:100%;border:0;background:transparent;padding:12px 0;outline:0}.layout{displ x;place-items:center;font-size:10px;min-width:47px}.bottomnav button span{font-size:22px}.bottomnav button.active{color:var(--brand)}.chatlayout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:520px;overflow:hidden}.chatlist{border-right:1px solid var(--line);padding:14px}.chatperson{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:0;background:transparent;width:100%;text-align:left}.chatperson.active,.chatperson:hover{background:var(--soft)}.chatwindow{display:flex;flex-direction:column;min-height:520px}.chatmessages{flex:1;padding:18px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:460px}.bubble{max-width:78%;padding:10px 13px;border-radius:16px;background:#f0f1f7;align-self:flex-start;overflow-wrap:anywhere}.bubble.mine{background:var(--brand);color:white;align-self:flex-end;border-bottom-right-radius:5px}.bubble small{display:block;font-size:10px;opacity:.7;text-align:right;margin-top:4px}.chatcompose{display:flex;gap:8px;padding:13px;border-top:1px solid var(--line)}.chatcompose input{flex:1;min-width:0}.notifrow{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}.notifrow.unread{background:#f5f3ff}.dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.statbox{padding:16px;border-radius:17px;background:#f8f7ff}.statbox b{font-size:23px;display:block}.statbox span{font-size:12px;color:var(--muted)}.settingslist button{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid var(--line);background:white;padding:16px 3px;text-align:left;font-weight:700}.searchresults{display:grid;gap:10px}.userresult{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:white}.userresult .grow{flex:1;min-width:0}.authscreen{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 10%,#e9e5ff,transparent 35%),radial-gradient(circle at 90% 90%,#dff9f2,transparent 30%),var(--bg)}.authbox{width:min(440px,100%);padding:28px}.authbox .brand{justify-content:center;margin-bottom:22px}.authbox h1{text-align:center;margin:0 0 7px}.authbox p{text-align:center}.authswitch{text-align:center;margin-top:15px}.linkbtn{border:0;background:transparent;color:var(--brand);font-weight:800}.footerhint{padding:15px 4px;color:var(--muted);font-size:11px;line-height:1.6}.menuwrap{position:relative}.menupop{position:absolute;right:0;top:48px;width:210px;background:white;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:7px;z-index:25}.menupop button{width:100%;text-align:left;border:0;background:white;border-radius:10px;padding:11px}.menupop button:hover{background:var(--soft);color:var(--brand)}

@media(max-width:700px){.wrap{padding:0 12px}.topbar{height:62px}.topinner{gap:8px}.brand{font-size:18px}.brandmark{width:32px;height:32px;border-radius:11px}.topbar .searchbox{display:none}.layout{display:block;padding-top:14px;padding-bottom:95px}.sidebar{display:none}.bottomnav{display:flex}.panel{border-radius:19px}.storyrow{padding:13px;gap:12px}.profiletop{padding:17px}.profilehero{align-items:flex-start;gap:14px}.avatar.lg{width:78px;height:78px}.profiletitle h2{font-size:20px}.stats{gap:15px;margin:12px 0}.stats b{font-size:15px}.stats span{font-size:12px}.topthree{gap:6px}.topcard{border-radius:11px}.toprank{left:5px;top:5px;padding:4px 6px}.profilebuttons .btn{flex:1;padding:10px 8px;font-size:13px}.tabs{gap:0}.tab{flex:1;padding:12px 5px;font-size:12px}.chatlayout{grid-template-columns:100px minmax(0,1fr);min-height:480px}.chatlist{padding:7px}.chatperson{display:grid;place-items:center;padding:8px 3px;font-size:10px;text-align:center;overflow:hidden}.chatperson .chatname{max-width:80px;overflow:hidden;text-overflow:ellipsis}.chatwindow{min-height:480px}.chatmessages{padding:10px;max-height:410px}.bubble{max-width:90%}.chatcompose{padding:8px}.chatcompose .btn{padding:10px}.statgrid{gap:7px}.statbox{padding:12px}.statbox b{font-size:19px}.panelpad{padding:15px}.iconbtn{width:39px;height:39px}.brandtext{max-width:150px;overflow:hidden;text-overflow:ellipsis}.topthree .topcard{aspect-ratio:3/4}}

<body>
<div id="app"></div>
<div id="modalroot"></div>
<div id="toastroot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* GROMAZEEF — single-file Phase 1 foundation.
   Parts 1–10 are labelled below for easier maintenance. */
const SUPABASE_URL = "https://jwkpergysvdicyzvqypy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Y2J7myGmTRSrRGN5PxnbYg_m07KlrmB";
const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (s,root=document)=>root.querySelector(s);
const $$ = (s,root=document)=>[...root.querySelectorAll(s)];
const state = {session:null,user:null,profile:null,view:"home",profileId:null,tab:"groms",feed:[],stories:[],search:"",searchUsers:[],searchPosts:[],chats:[],activeChat:null,messages:[],notifications:[],unread:0,uploadFile:null,editPost:null,storyFile:null,following:[],menu:false,authMode:"login"};
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials = p => (p?.display_name||p?.username||"G").slice(0,1).toUpperCase();
const fmt = n => Intl.NumberFormat(undefined,{notation:n>=10000?"compact":"standard",maximumFractionDigits:1}).format(n||0);
const ago = date => {let d=Math.max(0,Date.now()-new Date(date||Date.now()).getTime())/1000;if(d<60)return "now";if(d<3600)return Math.floor(d/60)+"m";if(d<86400)return Math.floor(d/3600)+"h";return Math.floor(d/86400)+"d"};
const toast = msg => {const r=$("#toastroot");r.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>r.innerHTML="",3200)};
function avatar(p,size=""){const url=p?.avatar_url||p?.profile_photo_url;return `<div class="avatar ${size}">${url?`<img src="${esc(url)}" alt="">`:esc(initials(p))}</div>`}
function brand(){return `<div class="brand"><div class="brandmark">G</div><span class="brandtext">gromazeef</span></div>`}
function navItem(v,ico,label){return `<button class="navitem ${state.view===v?"active":""}" data-view="${v}"><span class="ico">${ico}</span><span>${label}</span></button>`}
function postOwner(post){return post.profiles||post.profile||{}}
function postUrl(p){return p.media_url||p.file_url||p.image_url||p.video_url||""}
function isVideo(p){const t=(p.media_type||p.type||"").toLowerCase();return t.includes("video")||/\.(mp4|webm|mov)(\?|$)/i.test(postUrl(p))}
function normalizePost(p){return {...p,views_count:Number(p.views_count??p.views??0),caption:p.caption||p.description||"",created_at:p.created_at||new Date().toISOString()}}
async function safeQuery(table,query){try{const r=await query; if(r.error)throw r.error;return r.data||[]}catch(e){console.warn(table,e.message);return []}}
async function getProfile(id){if(!id)return null;const rows=await safeQuery("profiles",sb.from("profiles").select("*").eq("id",id).limit(1));return rows[0]||null}
async function loadMyProfile(){state.profile=await getProfile(state.user.id);if(!state.profile){const u=state.user;const username=(u.user_metadata?.username||u.email?.split("@")[0]||"creator").replace(/[^a-zA-Z0-9_.]/g,"").slice(0,24);try{const r=await sb.from("profiles").upsert({id:u.id,username,display_name:u.user_metadata?.display_name||username,bio:"",avatar_url:null},{onConflict:"id"}).select().single();if(!r.error)state.profile=r.data}catch(e){console.warn(e.message)}}}
async function profileById(id){if(id===state.user?.id)return state.profile;return getProfile(id)}
async function loadPostTable(){const rows=await safeQuery("posts",sb.from("posts").select("*,profiles(*)").order("created_at",{ascending:false}).limit(60));return rows.map(normalizePost)}
async function loadFeed(){state.feed=await loadPostTable();state.stories=await safeQuery("strips",sb.from("strips").select("*,profiles(*)").order("created_at",{ascending:false}).limit(50));}
async function loadFollowing(){state.following=await safeQuery("follows",sb.from("follows").select("*").eq("follower_id",state.user.id));}
async function loadNotifications(){state.notifications=await safeQuery("notifications",sb.from("notifications").select("*").eq("recipient_id",state.user.id).order("created_at",{ascending:false}).limit(80));state.unread=state.notifications.filter(n=>!n.is_read&&!n.read_at).length}
async function refreshAll(){await Promise.all([loadMyProfile(),loadFeed(),loadFollowing(),loadNotifications()]);render()}
function profileOf(p){return p.profiles||p.profile||{}}
function mediaMarkup(p){const u=postUrl(p);if(!u)return `<div class="placeholder"><div style="font-size:32px">◈</div><p>Media URL not available</p></div>`;return isVideo(p)?`<video src="${esc(u)}" controls playsinline preload="metadata"></video>`:`<img src="${esc(u)}" alt="${esc(p.caption||"Gromazeef post")}" loading="lazy">`}
function postCard(p){const owner=profileOf(p),mine=p.user_id===state.user?.id||p.owner_id===state.user?.id;return `<article class="panel post" data-post="${esc(p.id)}"><div class="posthead">${avatar(owner,"sm")}<div class="postmeta"><strong>${esc(owner.display_name||owner.username||"Gromazeef user")}</strong><span class="muted small">@${esc(owner.username||"creator")} · ${ago(p.created_at)}</span></div><div class="menuwrap"><button class="iconbtn" data-postmenu="${esc(p.id)}" aria-label="Post options">⋮</button></div></div><div class="postmedia">${mediaMarkup(p)}</div><div class="postactions"><button class="iconbtn" data-like="${esc(p.id)}" title="Like">♡</button><button class="iconbtn" data-comments="${esc(p.id)}" title="Comments">▢</button><button class="iconbtn" data-share="${esc(p.id)}" title="Share">↗</button><span class="spacer"></span><button class="iconbtn" data-save="${esc(p.id)}" title="Save">♧</button></div><div class="postbody"><strong>${fmt(p.likes_count||0)} likes</strong><p class="caption">${owner.username?`<b>@${esc(owner.username)}</b> `:""}${esc(p.caption)}</p><div class="muted small">${fmt(p.views_count)} views · ${fmt(p.comments_count||0)} comments</div></div></article>`}
function storyStrip(){const own=state.stories.filter(s=>(s.user_id||s.owner_id)===state.user?.id);const followedIds=state.following.map(f=>f.following_id||f.followed_id||f.followee_id);const others=state.stories.filter(s=>followedIds.includes(s.user_id||s.owner_id));const seen=new Set();const arr=[...own,...others].filter(s=>{const id=s.user_id||s.owner_id;if(seen.has(id))return false;seen.add(id);return true});return `<div class="panel storyrow"><div class="story add" data-action="addstory"><div class="storyring"><div>＋</div></div><div>Your Strip</div></div>${arr.map(s=>{const p=profileOf(s);return `<div class="story" data-story="${esc(s.id)}"><div class="storyring"><div>${p.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc(initials(p))}</div></div><div>${esc(p.username||"creator")}</div></div>`}).join("")}${arr.length===0?`<div class="muted small" style="align-self:center">Follow creators to see their strips here.</div>`:""}</div>`}
function homeView(){const followingIds=state.following.map(f=>f.following_id||f.followed_id||f.followee_id);let feed=state.feed.filter(p=>!p.user_id||p.user_id===state.user.id||followingIds.includes(p.user_id));if(!feed.length)feed=state.feed;return `${storyStrip()}<div class="sectionhead"><h2>Your feed</h2><button class="btn secondary" data-view="explore">Discover creators ↗</button></div><div class="feed">${feed.length?feed.map(postCard).join(""):`<div class="panel empty"><div class="big">✦</div><h3>Your feed starts here</h3><p>Follow creators or share your first Grom.</p><button class="btn primary" data-view="upload">Create a post</button></div>`}</div>`}
function getUserPosts(id){return state.feed.filter(p=>(p.user_id||p.owner_id)===id)}
function topThree(posts){return [...posts].sort((a,b)=>b.views_count-a.views_count).slice(0,3)}
function gridPosts(posts){if(!posts.length)return `<div class="empty" style="grid-column:1/-1"><div class="big">▧</div><b>Nothing here yet</b><p class="small">Content will appear here when it is published.</p></div>`;return `<div class="gridposts" style="grid-column:1/-1">${posts.map(p=>`<div class="gridtile" data-openpost="${esc(p.id)}">${postUrl(p)?(isVideo(p)?`<video src="${esc(postUrl(p))}" muted preload="metadata"></video>`:`<img src="${esc(postUrl(p))}" loading="lazy">`):`<div class="placeholder">◈</div>`}${isVideo(p)?`<span class="tileicon">▶</span>`:""}<span class="tileicon" style="right:auto;left:7px;top:auto;bottom:6px;font-size:12px">▶ ${fmt(p.views_count)}</span></div>`).join("")}</div>`}
async function loadTagged(id){return await safeQuery("post_tags",sb.from("post_tags").select("*,posts(*,profiles(*))").eq("tagged_user_id",id))}
async function loadReshares(id){return await safeQuery("reshares",sb.from("reshares").select("*,posts(*,profiles(*))").eq("user_id",id).order("created_at",{ascending:false}))}
function profileView(){const id=state.profileId||state.user.id;const p=id===state.user.id?state.profile:state.feed.map(x=>profileOf(x)).find(x=>x.id===id);if(!p)return `<div class="panel empty"><h3>Profile not found</h3><button class="btn secondary" data-view="home">Back home</button></div>`;const own=id===state.user.id;const posts=getUserPosts(id),popular=topThree(posts),tagged=[],reshares=[];return `<div class="panel profiletop"><div class="profilehero">${avatar(p,"lg")}<div class="profileinfo"><div class="profiletitle"><h2>${esc(p.username||"creator")}</h2>${own?`<div class="menuwrap"><button class="iconbtn" data-action="profilemenu">☰</button></div>`:""}</div><div class="stats"><button><b>${posts.length}</b><br><span class="muted small">Posts</span></button><button data-action="followers"><b>${fmt(p.followers_count||0)}</b><br><span class="muted small">Followers</span></button><button data-action="following"><b>${fmt(p.following_count||0)}</b><br><span class="muted small">Following</span></button></div><div><b>${esc(p.display_name||p.full_name||p.username||"")}</b></div><div class="bio">${esc(p.bio||"")}</div></div></div><div class="profilebuttons">${own?`<button class="btn secondary" data-action="editprofile">Edit profile</button>`:`<button class="btn primary" data-follow="${esc(id)}">${state.following.some(f=>(f.following_id||f.followed_id||f.followee_id)===id)?"Following":"Follow"}</button><button class="btn secondary" data-messageuser="${esc(id)}">Message</button>`}<button class="btn plain" data-action="shareprofile">Share profile</button></div></div><div class="sectionhead" style="margin:20px 3px 10px"><h3>Top 3 · Most viewed</h3><span class="muted small">Across GROMS & ZEEFS</span></div><div class="topthree">${popular.length?popular.map((p,i)=>`<div class="topcard" data-openpost="${esc(p.id)}">${postUrl(p)?(isVideo(p)?`<video src="${esc(postUrl(p))}" muted preload="metadata"></video>`:`<img src="${esc(postUrl(p))}" loading="lazy">`):"◈"}<span class="toprank">#${i+1}</span><span class="topviews">▶ ${fmt(p.views_count)}</span></div>`).join(""):`<div class="topcard"><span class="toprank">#1</span><span class="muted">Your best post</span></div><div class="topcard"><span class="toprank">#2</span><span class="muted">Coming soon</span></div><div class="topcard"><span class="toprank">#3</span><span class="muted">Coming soon</span></div>`}</div><div class="panel"><div class="tabs"><button class="tab ${state.tab==="groms"?"active":""}" data-profiletab="groms">▦ GROMS</button><button class="tab ${state.tab==="zeefs"?"active":""}" data-profiletab="zeefs">▶ ZEEFS</button><button class="tab ${state.tab==="reshare"?"active":""}" data-profiletab="reshare">↗ RESHARE</button><button class="tab ${state.tab==="growtag"?"active":""}" data-profiletab="growtag">⌗ GROWTAG</button></div><div class="gridposts">${profileTabContent(posts)}</div></div>`}
function profileTabContent(posts){let list=posts;if(state.tab==="zeefs")list=posts.filter(isVideo);if(state.tab==="groms")list=posts.filter(p=>!isVideo(p));if(state.tab==="reshare")return `<div class="empty" style="grid-column:1/-1"><div class="big">↗</div><b>Reshares</b><p class="small">Reshared content will appear here when the reshare table is connected.</p></div>`;if(state.tab==="growtag")return `<div class="empty" style="grid-column:1/-1"><div class="big">⌗</div><b>Tagged content</b><p class="small">Posts that tag this profile will appear here.</p></div>`;return gridPosts(list)}
function searchView(){return `<div class="panel panelpad"><div class="sectionhead"><h2>Discover</h2><span class="muted small">People and content</span></div><div class="searchbox" style="max-width:none;margin-bottom:16px"><span>⌕</span><input id="searchInput" placeholder="Search people, topics, GROMS or ZEEFS…" value="${esc(state.search)}"><button class="iconbtn" data-action="clearsearch">×</button></div><div id="searchResults">${searchResultsMarkup()}</div></div>`}
function searchResultsMarkup(){const q=state.search.trim().toLowerCase();if(!q)return `<div class="empty"><div class="big">⌕</div><b>What are you looking for?</b><p>Search creators and discover related content.</p><div class="tabs" style="justify-content:center"><span class="tab active">Creators</span><span class="tab">GROMS</span><span class="tab">ZEEFS</span></div></div>`;const users=state.searchUsers.filter(p=>(p.username||"").toLowerCase().includes(q)||(p.display_name||"").toLowerCase().includes(q));const posts=state.searchPosts.filter(p=>(p.caption||"").toLowerCase().includes(q));return `<h3>Creators</h3><div class="searchresults">${users.length?users.map(p=>`<div class="userresult" data-userprofile="${esc(p.id)}">${avatar(p,"sm")}<div class="grow"><b>${esc(p.display_name||p.username)}</b><div class="muted small">@${esc(p.username||"")}</div></div><button class="btn secondary" data-userprofile="${esc(p.id)}">View</button></div>`).join(""):`<p class="muted small">No matching creators.</p>`}</div><h3 style="margin-top:22px">Related GROMS & ZEEFS</h3><div class="gridposts">${gridPosts(posts)}</div>`}
async function doSearch(q){state.search=q;const [users,posts]=await Promise.all([safeQuery("profiles",sb.from("profiles").select("*").or(`username.ilike.%${q.replace(/[,%()]/g,"")}%,display_name.ilike.%${q.replace(/[,%()]/g,"")}%`).limit(30)),Promise.resolve(state.feed.filter(p=>(p.caption||"").toLowerCase().includes(q.toLowerCase())))]);state.searchUsers=users;state.searchPosts=posts;const el=$("#searchResults");if(el)el.innerHTML=searchResultsMarkup()}
function uploadView(){return `<div class="panel panelpad"><div class="sectionhead"><h2>Create</h2><span class="muted small">Share something good</span></div><div class="tabs"><button class="tab ${state.uploadKind!=="zeef"?"active":""}" data-kind="grom">▧ GROM · Photo</button><button class="tab ${state.uploadKind==="zeef"?"active":""}" data-kind="zeef">▶ ZEEF · Video</button><button class="tab" data-action="addstory">◉ STRIP · Story</button></div><form id="uploadForm" class="formgrid"><label class="filepick"><div style="font-size:28px">＋</div><b>Select a ${state.uploadKind==="zeef"?"video":"photo"}</b><p class="muted small">Choose media from your device</p><input id="mediaFile" type="file" accept="${state.uploadKind==="zeef"?"video/*":"image/*"}" required style="max-width:100%;margin-top:8px"></label><div id="previewbox"></div><div><label class="fieldlabel" for="captionInput">Caption</label><textarea id="captionInput" class="field" maxlength="2200" placeholder="Write a caption…"></textarea></div><div><label class="fieldlabel" for="tagsInput">Tag creators (usernames, separated by commas)</label><input id="tagsInput" class="field" placeholder="@creator1, @creator2"></div><div class="muted small">Your media is uploaded to the Gromazeef media bucket. Ensure your Supabase Storage policies allow authenticated uploads.</div><button class="btn primary" type="submit">Publish ${state.uploadKind==="zeef"?"ZEEF":"GROM"}</button></form></div>`}
function notificationsView(){return `<div class="panel"><div class="panelpad sectionhead"><h2>Activity</h2><button class="btn secondary" data-action="readall">Mark all read</button></div>${state.notifications.length?state.notifications.map(n=>`<div class="notifrow ${!n.is_read&&!n.read_at?"unread":""}" data-notification="${esc(n.id)}">${avatar(n.actor_profile||n.profiles||{},"sm")}<div style="flex:1"><b>${esc(n.title||n.actor_name||"Gromazeef activity")}</b><div class="muted small">${esc(n.body||n.message||n.type||"You have a new notification")}</div><div class="muted small">${ago(n.created_at)}</div></div>${!n.is_read&&!n.read_at?`<span class="dot"></span>`:""}</div>`).join(""):`<div class="empty"><div class="big">♧</div><h3>You're all caught up</h3><p>Likes, follows, comments and messages can appear here once notifications are wired to your database.</p></div>`}</div>`}
function exploreView(){const popular=[...state.feed].sort((a,b)=>b.views_count-a.views_count);return `<div class="sectionhead"><h2>Discover</h2><button class="btn secondary" data-view="search">Search people & content</button></div><div class="panel panelpad"><h3>Popular right now</h3><p class="muted small">Content is ranked using views currently available in your posts table.</p><div class="gridposts">${gridPosts(popular)}</div></div>`}
function dashboardView(){const posts=getUserPosts(state.user.id);const views=posts.reduce((s,p)=>s+p.views_count,0);const likes=posts.reduce((s,p)=>s+Number(p.likes_count||0),0);return `<div class="panel panelpad"><div class="sectionhead"><h2>Creator dashboard</h2><span class="muted small">Your account</span></div><div class="statgrid"><div class="statbox"><b>${fmt(views)}</b><span>Total views</span></div><div class="statbox"><b>${fmt(likes)}</b><span>Likes</span></div><div class="statbox"><b>${posts.length}</b><span>Published posts</span></div></div><h3 style="margin-top:24px">Your content</h3>${posts.length?posts.map(p=>`<div class="suggestion">${avatar(state.profile,"sm")}<div class="grow"><b>${esc((p.caption||"Untitled post").slice(0,50))}</b><div class="muted small">${fmt(p.views_count)} views · ${ago(p.created_at)}</div></div><button class="btn secondary" data-postmenu="${esc(p.id)}">Manage</button></div>`).join(""):`<div class="empty">Publish your first GROM or ZEEF to see performance.</div>`}</div>`}
function settingsView(){return `<div class="panel panelpad"><div class="sectionhead"><h2>Settings & support</h2></div><div class="settingslist"><button data-action="editprofile">Edit profile <span>›</span></button><button data-action="privacy">Privacy & safety <span>›</span></button><button data-action="blocked">Blocked accounts <span>›</span></button><button data-action="report">Report a problem <span>›</span></button><button data-action="help">Help & support <span>›</span></button><button data-action="about">About Gromazeef <span>›</span></button><button data-action="logout" style="color:var(--danger)">Log out <span>↗</span></button></div></div>`}
function chatsView(){return `<div class="panel chatlayout"><aside class="chatlist"><div class="sectionhead"><h3>Messages</h3><button class="iconbtn" data-action="newchat">＋</button></div><input id="chatSearch" class="field" placeholder="Search chats…">${state.chats.length?state.chats.map(c=>`<button class="chatperson ${state.activeChat===c.id?"active":""}" data-chat="${esc(c.id)}">${avatar(c.profile,"sm")}<span class="chatname">${esc(c.profile?.username||"User")}</span></button>`).join(""):`<div class="muted small" style="padding:12px 4px">Search a creator to start a private chat.</div>`}</aside><section class="chatwindow"><div class="posthead" style="border-bottom:1px solid var(--line)">${state.activeChat?avatar(state.chats.find(c=>c.id===state.activeChat)?.profile,"sm"):""}<div class="postmeta"><strong>${state.activeChat?esc(state.chats.find(c=>c.id===state.activeChat)?.profile?.username||"Conversation"):"Your Z-Chat"}</strong><span class="muted small">${state.activeChat?"Private conversation":"Choose a creator to message"}</span></div></div><div class="chatmessages" id="chatMessages">${state.messages.length?state.messages.map(m=>`<div class="bubble ${m.sender_id===state.user.id?"mine":""}">${esc(m.message_text||m.content||"")}<small>${ago(m.created_at)} ${m.sender_id===state.user.id?(m.is_read||m.read_at?"🔵 Seen":"✓ Sent"):""}</small></div>`).join(""):`<div class="empty"><div class="big">☏</div><p>Private messages appear here.</p></div>`}</div><form id="chatForm" class="chatcompose"><input class="field" id="chatMessage" maxlength="5000" placeholder="${state.activeChat?"Write a message…":"Choose a chat first"}" ${state.activeChat?"":"disabled"} required><button class="btn primary" ${state.activeChat?"":"disabled"}>Send</button></form></section></div>`}
function mainContent(){switch(state.view){case"profile":return profileView();case"search":return searchView();case"explore":return exploreView();case"upload":return uploadView();case"notifications":return notificationsView();case"chats":return chatsView();case"dashboard":return dashboardView();case"settings":return settingsView();default:return homeView()}}
function render(){if(!state.session){renderAuth();return}const p=state.profile||{};$("#app").innerHTML=`<header class="topbar"><div class="wrap topinner">${brand()}<div class="spacer"></div><button class="iconbtn" data-view="search" aria-label="Search">⌕</button><button class="iconbtn" data-view="notifications" aria-label="Notifications">♧${state.unread?`<span class="badge"></span>`:""}</button>${avatar(p,"sm")}<button class="iconbtn" data-view="profile" aria-label="Profile">⌄</button></div></header><div class="wrap layout"><aside class="sidebar"><div class="sideprofile">${avatar(p)}<div style="min-width:0"><b>${esc(p.display_name||p.username||"Your profile")}</b><div class="muted small">@${esc(p.username||"creator")}</div></div></div>${navItem("home","⌂","Home")}${navItem("explore","✦","Explore")}${navItem("search","⌕","Search")}${navItem("upload","＋","Create")}${navItem("chats","☏","Z-Chat")}${navItem("notifications","♧","Activity")}${navItem("profile","◎","Profile")}${navItem("dashboard","▥","Dashboard")}${navItem("settings","⚙","Settings")}<div class="footerhint">Gromazeef · Your space, your people<br>Be kind. Create freely.</div></aside><main id="main">${mainContent()}</main><aside class="rightcol"><div class="panel rightcard"><div class="sectionhead"><h3>Quick create</h3></div><p class="muted small">Share a photo or video with your community.</p><button class="btn primary" style="width:100%" data-view="upload">＋ Create post</button></div><div class="panel rightcard"><div class="sectionhead"><h3>Creator tools</h3></div><button class="navitem" data-view="dashboard">▥ Dashboard</button><button class="navitem" data-view="settings">⚙ Settings & support</button><button class="navitem" data-action="logout">↗ Log out</button></div></aside></div><nav class="bottomnav">${[["home","⌂","Home"],["explore","✦","Explore"],["upload","＋","Create"],["chats","☏","Chat"],["profile","◎","Profile"]].map(([v,i,l])=>`<button class="${state.view===v?"active":""}" data-view="${v}"><span>${i}</span>${l}</button>`).join("")}</nav>`}
function renderAuth(){const isLogin=state.authMode==="login";$("#app").innerHTML=`<div class="authscreen"><div class="panel authbox">${brand()}<h1>${isLogin?"Welcome back":"Join Gromazeef"}</h1><p class="muted">${isLogin?"Sign in to your community.":"Create your account and start sharing."}</p><form id="authForm" class="formgrid"><div><label class="fieldlabel">Email</label><input class="field" type="email" id="authEmail" autocomplete="email" required placeholder="you@example.com"></div><div><label class="fieldlabel">Password</label><input class="field" type="password" id="authPassword" autocomplete="${isLogin?"current-password":"new-password"}" minlength="6" required placeholder="At least 6 characters"></div>${!isLogin?`<div><label class="fieldlabel">Username</label><input class="field" id="authUsername" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_.]+" placeholder="your_username"></div><div><label class="fieldlabel">Display name</label><input class="field" id="authName" maxlength="60" placeholder="Your name"></div>`:""}<button class="btn primary" type="submit">${isLogin?"Sign in":"Create account"}</button></form><div class="authswitch muted">${isLogin?"New here?":"Already have an account?"} <button class="linkbtn" data-action="authswitch">${isLogin?"Create account":"Sign in"}</button></div><p class="small muted" style="margin-top:22px">By continuing, use Gromazeef respectfully and keep your account secure.</p></div></div>`}
function openModal(title,body){$("#modalroot").innerHTML=`<div class="modalback" data-closemodal><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2>${esc(title)}</h2><button class="iconbtn" data-closemodal>×</button></div>${body}</div></div>`}
function closeModal(){$("#modalroot").innerHTML=""}
async function editProfileModal(){const p=state.profile||{};openModal("Edit profile",`<form id="profileForm" class="formgrid"><div><label class="fieldlabel">Display name</label><input class="field" id="editName" maxlength="60" value="${esc(p.display_name||"")}"></div><div><label class="fieldlabel">Username</label><input class="field" id="editUsername" maxlength="24" pattern="[A-Za-z0-9_.]+" value="${esc(p.username||"")}" required></div><div><label class="fieldlabel">Bio</label><textarea class="field" id="editBio" maxlength="300">${esc(p.bio||"")}</textarea></div><div><label class="fieldlabel">Profile photo</label><input class="field" type="file" id="editAvatar" accept="image/*"></div><button class="btn primary">Save changes</button></form>`)}
function postMenuModal(id){const p=state.feed.find(p=>String(p.id)===String(id));if(!p)return;const mine=p.user_id===state.user.id||p.owner_id===state.user.id;openModal("Post options",`<div class="settingslist">${mine?`<button data-action="editcaption" data-id="${esc(id)}">Edit caption <span>✎</span></button><button data-action="deletepost" data-id="${esc(id)}" style="color:var(--danger)">Delete post <span>×</span></button>`:""}<button data-action="reshare" data-id="${esc(id)}">Reshare <span>↗</span></button><button data-action="copylink" data-id="${esc(id)}">Copy link <span>⤴</span></button><button data-action="reportpost" data-id="${esc(id)}">Report post <span>⚑</span></button></div>`)}
async function uploadMedia(file){const ext=(file.name.split(".").pop()||"bin").replace(/[^a-z0-9]/gi,"").toLowerCase();const path=`${state.user.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;const {data,error}=await sb.storage.from("gromazeef-media").upload(path,file,{upsert:false,contentType:file.type||undefined});if(error)throw error;const pub=sb.storage.from("gromazeef-media").getPublicUrl(data.path);return pub.data.publicUrl}
async function createPost(file,caption,kind,tags){const url=await uploadMedia(file);const row={user_id:state.user.id,caption,media_url:url,media_type:kind==="zeef"?"video":"image",created_at:new Date().toISOString()};const {data,error}=await sb.from("posts").insert(row).select().single();if(error)throw error;for(const raw of tags.split(",").map(s=>s.trim().replace(/^@/,"")).filter(Boolean)){const users=await safeQuery("profiles",sb.from("profiles").select("id").eq("username",raw).limit(1));if(users[0]){try{await sb.from("post_tags").insert({post_id:data.id,tagged_user_id:users[0].id,tagger_id:state.user.id})}catch(e){console.warn("Tags need post_tags table/policy",e.message)}}}toast("Published successfully!");state.view="profile";state.profileId=state.user.id;state.tab=kind==="zeef"?"zeefs":"groms";await refreshAll()}
async function toggleFollow(id){if(id===state.user.id)return;const existing=state.following.find(f=>(f.following_id||f.followed_id||f.followee_id)===id);if(existing){const col=existing.following_id?"following_id":existing.followed_id?"followed_id":"followee_id";const {error}=await sb.from("follows").delete().eq("follower_id",state.user.id).eq(col,id);if(error)throw error}else{const {error}=await sb.from("follows").insert({follower_id:state.user.id,following_id:id});if(error)throw error}await loadFollowing();toast(existing?"Unfollowed":"Following");render()}
async function loadChatList(){const rows=await safeQuery("messages",sb.from("messages").select("*").or(`sender_id.eq.${state.user.id},receiver_id.eq.${state.user.id}`).order("created_at",{ascending:false}).limit(200));const ids=[...new Set(rows.map(m=>m.sender_id===state.user.id?m.receiver_id:m.sender_id).filter(Boolean))];const profiles=ids.length?await safeQuery("profiles",sb.from("profiles").select("*").in("id",ids)):[];state.chats=ids.map(id=>({id,profile:profiles.find(p=>p.id===id)||{id,username:"User"}}));if(!state.activeChat&&state.chats.length)state.activeChat=state.chats[0].id}
async function loadMessages(){if(!state.activeChat)return;state.messages=await safeQuery("messages",sb.from("messages").select("*").or(`and(sender_id.eq.${state.user.id},receiver_id.eq.${state.activeChat}),and(sender_id.eq.${state.activeChat},receiver_id.eq.${state.user.id})`).order("created_at",{ascending:true}).limit(300));const unread=state.messages.filter(m=>m.sender_id===state.activeChat&&!m.is_read);for(const m of unread){try{await sb.from("messages").update({is_read:true,read_at:new Date().toISOString()}).eq("id",m.id).eq("receiver_id",state.user.id)}catch(e){}}}
async function openChatWith(id){state.view="chats";state.activeChat=id;await loadChatList();await loadMessages();render()}
async function sendMessage(text){if(!state.activeChat||!text.trim())return;const row={sender_id:state.user.id,receiver_id:state.activeChat,message_text:text.trim()};const {error}=await sb.from("messages").insert(row);if(error)throw error;await loadMessages();render()}
async function authSubmit(e){e.preventDefault();const email=$("#authEmail").value.trim(),password=$("#authPassword").value;try{if(state.authMode==="login"){const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;state.session=data.session;state.user=data.user;await refreshAll();toast("Welcome back!")}else{const username=$("#authUsername").value.trim(),display_name=$("#authName").value.trim()||username;const {data,error}=await sb.auth.signUp({email,password,options:{data:{username,display_name}}});if(error)throw error;if(data.session){state.session=data.session;state.user=data.user;await loadMyProfile();await refreshAll();toast("Account created!")}else{toast("Check your email to confirm signup, then sign in.") ;state.authMode="login";renderAuth()}}}catch(err){toast(err.message||"Authentication failed")}}
async function saveProfile(e){e.preventDefault();const username=$("#editUsername").value.trim();const row={id:state.user.id,username,display_name:$("#editName").value.trim()||username,bio:$("#editBio").value.trim()};const file=$("#editAvatar").files[0];try{if(file)row.avatar_url=await uploadMedia(file);const {data,error}=await sb.from("profiles").upsert(row,{onConflict:"id"}).select().single();if(error)throw error;state.profile=data;closeModal();render();toast("Profile updated")}catch(err){toast("Profile save failed: "+err.message)}}
async function likePost(id){try{const {error}=await sb.from("likes").insert({user_id:state.user.id,post_id:id});if(error&& !String(error.message).includes("duplicate"))throw error;toast("Liked");}catch(e){toast("Like setup needs checking: "+e.message)}}
async function savePost(id){try{const {error}=await sb.from("saved_posts").insert({user_id:state.user.id,post_id:id});if(error)throw error;toast("Saved privately")}catch(e){toast("Save feature needs saved_posts table: "+e.message)}}
async function addReshare(id){try{const {error}=await sb.from("reshares").insert({user_id:state.user.id,post_id:id});if(error)throw error;toast("Reshared")}catch(e){toast("Reshare needs reshares table: "+e.message)}}
async function readAll(){try{await sb.from("notifications").update({is_read:true,read_at:new Date().toISOString()}).eq("recipient_id",state.user.id);state.notifications=state.notifications.map(n=>({...n,is_read:true}));state.unread=0;render()}catch(e){toast("Notifications table/policy needs setup")}}
async function addStory(){openModal("Create a Strip",`<form id="storyForm" class="formgrid"><label class="filepick">Choose a photo or video<input id="storyFile" type="file" accept="image/*,video/*" required style="display:block;margin:12px auto"></label><label class="fieldlabel">Caption (optional)</label><input class="field" id="storyCaption" maxlength="300" placeholder="Add a thought…"><button class="btn primary">Share Strip</button><p class="muted small">Stories should expire after 24 hours; add an expires_at column and filter expired rows for full expiry behavior.</p></form>`)}
async function createStory(e){e.preventDefault();const file=$("#storyFile").files[0];if(!file)return;try{const url=await uploadMedia(file);const {error}=await sb.from("strips").insert({user_id:state.user.id,media_url:url,media_type:file.type.startsWith("video")?"video":"image",caption:$("#storyCaption").value,created_at:new Date().toISOString(),expires_at:new Date(Date.now()+86400000).toISOString()});if(error)throw error;closeModal();await loadFeed();render();toast("Strip shared")}catch(err){toast("Strip publish failed: "+err.message)}}
function showFollowers(mode){const ids=mode==="followers"?[]:state.following.map(f=>f.following_id||f.followed_id||f.followee_id);openModal(mode==="followers"?"Followers":"Following",`<div class="empty">This list will appear when the ${mode} query is connected to your current follows schema.</div>`)}
async function reportIssue(title="Report a problem"){openModal(title,`<form id="reportForm" class="formgrid"><label class="fieldlabel">What happened?</label><textarea class="field" id="reportText" required maxlength="2000" placeholder="Describe the issue…"></textarea><button class="btn primary">Submit report</button><p class="muted small">Reports require a secure reports table/policy to persist.</p></form>`)}
function actionHandler(action,el){switch(action){case"authswitch":state.authMode=state.authMode==="login"?"signup":"login";renderAuth();break;case"editprofile":editProfileModal();break;case"profilemenu":state.view="settings";render();break;case"logout":sb.auth.signOut().then(()=>{state.session=null;state.user=null;state.profile=null;state.view="home";renderAuth()});break;case"addstory":addStory();break;case"readall":readAll();break;case"clearsearch":state.search="";state.searchUsers=[];state.searchPosts=[];render();break;case"newchat":openModal("Start a chat",`<form id="newChatForm" class="formgrid"><label class="fieldlabel">Username</label><input id="newChatUsername" class="field" required placeholder="creator_username"><button class="btn primary">Open chat</button></form>`);break;case"shareprofile":navigator.clipboard?.writeText(location.href+"#profile-"+state.user.id);toast("Profile link copied if clipboard is available");break;case"followers":showFollowers("followers");break;case"following":showFollowers("following");break;case"privacy":openModal("Privacy & safety",`<div class="empty"><div class="big">🔒</div><b>Protect your space</b><p>Block/report controls are available on profiles and posts. Private-account enforcement requires a matching database policy and follow-request system.</p></div>`);break;case"blocked":openModal("Blocked accounts",`<div class="empty">Blocked accounts need a dedicated blocks table to be stored and enforced.</div>`);break;case"report":reportIssue();break;case"help":openModal("Help & support",`<p>For support, describe the issue using Report a Problem. Keep passwords and API keys private.</p><button class="btn primary" data-action="report">Report a problem</button>`);break;case"about":openModal("About Gromazeef",`<div class="brand">${brand()}</div><p>Your space, your people. Gromazeef is a creator-focused social platform.</p><p class="muted small">Phase 1 · Built with Supabase and a responsive web interface.</p>`);break;case"editcaption":{const p=state.feed.find(p=>String(p.id)===String(el.dataset.id));openModal("Edit caption",`<form id="captionForm" class="formgrid"><textarea class="field" id="newCaption" maxlength="2200">${esc(p?.caption||"")}</textarea><button class="btn primary">Save caption</button></form>`);break}case"deletepost":openModal("Delete this post?",`<p>This action cannot be undone.</p><button class="btn danger" data-confirmdelete="${esc(el.dataset.id)}">Delete post</button>`);break;case"reshare":addReshare(el.dataset.id);closeModal();break;case"copylink":navigator.clipboard?.writeText(location.href+"#post-"+el.dataset.id);toast("Link copied if clipboard is available");closeModal();break;case"reportpost":reportIssue("Report post");break;default:toast("This option is being prepared for the next feature pass.")}}
document.addEventListener("click",async e=>{const v=e.target.closest("[data-view]");if(v){state.view=v.dataset.view;if(state.view==="profile"){state.profileId=state.user.id;state.tab="groms"}if(state.view==="chats"){try{await loadChatList();await loadMessages()}catch(err){console.warn(err.message)}}if(state.view==="notifications")await loadNotifications();render();return}
const tab=e.target.closest("[data-profiletab]");if(tab){state.tab=tab.dataset.profiletab;render();return}
const kind=e.target.closest("[data-kind]");if(kind){state.uploadKind=kind.dataset.kind;render();return}
const act=e.target.closest("[data-action]");if(act){actionHandler(act.dataset.action,act);return}
const follow=e.target.closest("[data-follow]");if(follow){try{await toggleFollow(follow.dataset.follow)}catch(err){toast("Follow setup needs checking: "+err.message)}return}
const chat=e.target.closest("[data-chat]");if(chat){state.activeChat=chat.dataset.chat;await loadMessages();render();return}
const msguser=e.target.closest("[data-messageuser]");if(msguser){await openChatWith(msguser.dataset.messageuser);return}
const prof=e.target.closest("[data-userprofile]");if(prof){state.profileId=prof.dataset.userprofile;state.view="profile";state.tab="groms";render();return}
const pm=e.target.closest("[data-postmenu]");if(pm){postMenuModal(pm.dataset.postmenu);return}
const like=e.target.closest("[data-like]");if(like){await likePost(like.dataset.like);return}
const save=e.target.closest("[data-save]");if(save){await savePost(save.dataset.save);return}
const share=e.target.closest("[data-share]");if(share){try{if(navigator.share)await navigator.share({title:"Gromazeef",url:location.href+"#post-"+share.dataset.share});else{await navigator.clipboard.writeText(location.href+"#post-"+share.dataset.share);toast("Link copied")}}catch(err){}return}
const cm=e.target.closest("[data-comments]");if(cm){const p=state.feed.find(p=>String(p.id)===String(cm.dataset.comments));openModal("Comments",`<div id="commentlist" class="formgrid"><p class="muted small">Comments use the comments table. The column in your project is comment_text.</p><form id="commentForm" class="chatcompose"><input class="field" id="commentText" maxlength="1500" placeholder="Write a comment…" required><button class="btn primary">Send</button></form></div>`);return}
const op=e.target.closest("[data-openpost]");if(op){const p=state.feed.find(p=>String(p.id)===String(op.dataset.openpost));if(p){openModal("Post",postCard(p))}return}
const story=e.target.closest("[data-story]");if(story){const s=state.stories.find(s=>String(s.id)===String(story.dataset.story));if(s)openModal("Strip",`${s.media_url?((s.media_type||"").includes("video")?`<video src="${esc(s.media_url)}" controls autoplay style="width:100%;max-height:65vh"></video>`:`<img src="${esc(s.media_url)}" style="width:100%;max-height:65vh;object-fit:contain">`):"<p>Story media unavailable</p>"}<p>${esc(s.caption||"")}</p>`);return}
const conf=e.target.closest("[data-confirmdelete]");if(conf){try{const {error}=await sb.from("posts").delete().eq("id",conf.dataset.confirmdelete).eq("user_id",state.user.id);if(error)throw error;closeModal();await refreshAll();toast("Post deleted")}catch(err){toast("Delete failed: "+err.message)}return}
if(e.target.closest("[data-closemodal]")&&!e.target.closest(".modal"))closeModal();else if(e.target.closest("[data-closemodal]"))closeModal()
});
document.addEventListener("submit",async e=>{if(e.target.id==="authForm"){await authSubmit(e);return}
if(e.target.id==="profileForm"){await saveProfile(e);return}
if(e.target.id==="uploadForm"){e.preventDefault();const file=$("#mediaFile").files[0];if(!file)return;const kind=state.uploadKind||"grom";try{if(kind==="zeef"&&!file.type.startsWith("video/"))throw new Error("Choose a video file for a ZEEF.");if(kind!=="zeef"&&!file.type.startsWith("image/"))throw new Error("Choose an image for a GROM.");await createPost(file,$("#captionInput").value,kind,$("#tagsInput").value)}catch(err){toast(err.message||"Upload failed")}return}
if(e.target.id==="chatForm"){e.preventDefault();try{await sendMessage($("#chatMessage").value)}catch(err){toast("Message send failed: "+err.message)}return}
if(e.target.id==="newChatForm"){e.preventDefault();const q=$("#newChatUsername").value.trim().replace(/^@/,"");const users=await safeQuery("profiles",sb.from("profiles").select("*").eq("username",q).limit(1));if(!users[0]){toast("User not found");return}if(users[0].id===state.user.id){toast("That's your own profile");return}await openChatWith(users[0].id);closeModal();return}
if(e.target.id==="storyForm"){await createStory(e);return}
if(e.target.id==="captionForm"){e.preventDefault();const id=$(".modal [data-id]")?.dataset.id;toast("Caption edit needs post ID; reopen post options and retry");return}
if(e.target.id==="commentForm"){e.preventDefault();const post=$(".modal [data-post]")?.dataset.post;if(!post){toast("Open comments from the post card to attach the comment");return}try{const {error}=await sb.from("comments").insert({post_id:post,user_id:state.user.id,comment_text:$("#commentText").value.trim()});if(error)throw error;toast("Comment added");closeModal()}catch(err){toast("Comment failed: "+err.message)}return}
if(e.target.id==="reportForm"){e.preventDefault();try{const {error}=await sb.from("reports").insert({reporter_id:state.user.id,details:$("#reportText").value.trim(),created_at:new Date().toISOString()});if(error)throw error;closeModal();toast("Report submitted")}catch(err){toast("Report table is not configured yet: "+err.message)}return}
});
document.addEventListener("input",e=>{if(e.target.id==="searchInput"){clearTimeout(window.searchTimer);window.searchTimer=setTimeout(()=>doSearch(e.target.value),350)}if(e.target.id==="mediaFile"){const f=e.target.files[0];const p=$("#previewbox");if(f&&p){const u=URL.createObjectURL(f);p.innerHTML=f.type.startsWith("video/")?`<video src="${u}" controls style="width:100%;max-height:280px;border-radius:15px"></video>`:`<img src="${u}" style="width:100%;max-height:280px;object-fit:contain;border-radius:15px">`}}});
async function start(){if(!sb){$("#app").innerHTML="<p>Supabase library failed to load. Refresh and try again.</p>";return}const {data:{session}}=await sb.auth.getSession();if(session){state.session=session;state.user=session.user;await refreshAll()}else renderAuth();sb.auth.onAuthStateChange((_event,session)=>{setTimeout(async()=>{state.session=session;state.user=session?.user||null;if(session)await refreshAll();else renderAuth()},0)});try{sb.channel("gromazeef-live").on("postgres_changes",{event:"*",schema:"public",table:"messages"},async payload=>{if(state.user&&(payload.new?.sender_id===state.user.id||payload.new?.receiver_id===state.user.id)){if(state.view==="chats"){await loadChatList();await loadMessages();render()}else toast("New Z-Chat message")}}).subscribe()}catch(e){console.warn("Realtime unavailable",e.message)}}
start();
</script>
</body>
</html>
