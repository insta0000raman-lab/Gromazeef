function escapeHTML(value=""){
  return String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function safeURL(value){
  if(!value)return "";
  try{const url=new URL(value,location.href);return ["https:","http:","blob:"].includes(url.protocol)?url.href:"";}
  catch{return "";}
}
function getAvatar(profile=state.profile){
  return safeURL(profile?.avatar_url || profile?.avatar || DEFAULT_AVATAR) || DEFAULT_AVATAR;
}
function getDisplayName(profile={}){
  return profile.display_name || profile.full_name || profile.username || "Gromazeef User";
}
function getUsername(profile={}){
  return profile.username ? "@"+profile.username : "@user";
}
function formatCount(n=0){
  n=Number(n)||0;
  if(n>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,"")+"M";
  if(n>=1e3)return (n/1e3).toFixed(1).replace(/\.0$/,"")+"K";
  return String(n);
}
function timeAgo(value){
  if(!value)return "Just now";
  const seconds=Math.max(0,Math.floor((Date.now()-new Date(value).getTime())/1000));
  if(seconds<60)return "Just now";
  if(seconds<3600)return Math.floor(seconds/60)+"m";
  if(seconds<86400)return Math.floor(seconds/3600)+"h";
  if(seconds<604800)return Math.floor(seconds/86400)+"d";
  return new Date(value).toLocaleDateString();
}
function toast(message,type="success"){
  const container=$("#toast-container");
  if(!container)return;
  const item=document.createElement("div");
  item.className="toast "+(type==="error"?"error":"success");
  item.textContent=message;
  container.appendChild(item);
  setTimeout(()=>item.remove(),3800);
}

}

}

  const nav=navItems.map(item=>navButton(item)).join("");
  const mobile=["home","explore","create","zeefs","profile"].map(key=>navButton(navItems.find(x=>x[0]===key),true)).join("");
  $("#app").innerHTML=`
    <header class="app-header">
      <a class="brand" href="#" data-page="home"><span class="brand-mark">G</span><span>Gromazeef</span></a>

function attachPostEvents(root=$("#main-content")){
  $$("[data-like-post]",root).forEach(btn=>btn.onclick=()=>toggleLike(btn.dataset.likePost));
  $$("[data-save-post]",root).forEach(btn=>btn.onclick=()=>toggleSave(btn.dataset.savePost));

async function loadPosts({limit=25,userId=null,videoOnly=false,search=""}={}){
  let query=state.client.from("posts").select("*").order("created_at",{ascending:false}).limit(limit);
  if(userId)query=query.eq("user_id",userId);
  if(videoOnly)query=query.not("media_url","is",null);
  if(search)query=query.ilike("caption",`%${search.replace(/[%_]/g,"\\$&")}%`);
  const {data,error}=await query;
  if(error)throw error;
  const posts=data||[];
  const ownerIds=[...new Set(posts.map(getPostOwnerId).filter(Boolean))];
  if(ownerIds.length){
    const {data:profiles}=await state.client.from("profiles").select("*").in("id",ownerIds);
    const map=new Map((profiles||[]).map(p=>[p.id,p]));
    posts.forEach(p=>p.profiles=map.get(getPostOwnerId(p))||{});
  }
  return posts;
}
async function loadUserPostStates(posts){
  if(!currentUserId()||!posts.length)return;
  const ids=posts.map(p=>p.id);
  try{
    const [{data:likes},{data:saves}]=await Promise.all([
      state.client.from("likes").select("post_id").eq("user_id",currentUserId()).in("post_id",ids),
      state.client.from("saved_posts").select("post_id").eq("user_id",currentUserId()).in("post_id",ids)
    ]);
    (likes||[]).forEach(x=>state.likedPostIds.add(x.post_id));
    (saves||[]).forEach(x=>state.savedPostIds.add(x.post_id));
  }catch(error){console.warn("Post state query:",error.message);}
}

async function toggleLike(postId){
  if(!currentUserId())return toast("Pehle login karo","error");
  try{
    if(state.likedPostIds.has(postId)){
      const {error}=await state.client.from("likes").delete().eq("post_id",postId).eq("user_id",currentUserId());
      if(error)throw error;state.likedPostIds.delete(postId);toast("Like removed");
    }else{
      const {error}=await state.client.from("likes").insert({post_id:postId,user_id:currentUserId()});
      if(error)throw error;state.likedPostIds.add(postId);toast("Liked");
    }
    await renderPage();
  }catch(error){console.error(error);toast("Like update nahi hua: "+error.message,"error");}
}
async function toggleSave(postId){

async function renderCreate(kind="post"){
  const main=$("#main-content");
  const title=kind==="zeef"?"Create a ZEEF":kind==="grom"?"Upload a GROM":"Create a post";
  main.innerHTML=pageHeading(title,"Share something with your community")+`
    <section class="panel section-card">
      <form id="create-form">
        <div class="field"><label for="create-caption">Caption / description</label><textarea id="create-caption" name="caption" maxlength="2200" placeholder="Write something…"></textarea></div>
        <div class="field"><label for="create-file">Photo or video</label><input id="create-file" name="media" type="file" accept="image/*,video/*"></div>
        <div id="create-preview"></div>
        <div class="notice">Upload bucket expected: <strong>post-media</strong>. The bucket and Storage policies must exist in Supabase. ZEEFS/GROMS may use the same posts table until their dedicated schema is connected.</div>
        <button class="btn primary" type="submit"><i class="fa-solid fa-paper-plane"></i> Publish</button>
      </form>
    </section>`;
  const form=$("#create-form"),file=$("#create-file"),preview=$("#create-preview");
  file.addEventListener("change",()=>{
    const chosen=file.files?.[0];preview.innerHTML="";
    if(!chosen)return;
    const url=URL.createObjectURL(chosen);
    preview.innerHTML=chosen.type.startsWith("video/")?`<video src="${url}" controls style="max-width:100%;max-height:360px;border-radius:12px"></video>`:`<img src="${url}" alt="Preview" style="max-width:100%;max-height:360px;object-fit:contain;border-radius:12px">`;
  });
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    const button=form.querySelector("button[type=submit]");button.disabled=true;button.textContent="Publishing…";
    let uploadedURL=null;
    try{
      const caption=$("#create-caption").value.trim(),fileObj=file.files?.[0];
      if(!caption&&!fileObj)throw new Error("Caption ya media add karo.");
      let mediaType=null;
      if(fileObj){
        const max=100*1024*1024;if(fileObj.size>max)throw new Error("File 100 MB se chhoti honi chahiye.");
        const ext=(fileObj.name.split(".").pop()||"bin").replace(/[^a-zA-Z0-9]/g,"");
        const path=`${currentUserId()}/${Date.now()}-${crypto.randomUUID()}.${ext}`;
        const {error:uploadError}=await state.client.storage.from("post-media").upload(path,fileObj,{upsert:false,contentType:fileObj.type});
        if(uploadError)throw uploadError;
        const {data:publicData}=state.client.storage.from("post-media").getPublicUrl(path);
        uploadedURL=publicData?.publicUrl;mediaType=fileObj.type.startsWith("video/")?"video":"image";
      }
      const payload={user_id:currentUserId(),caption,media_url:uploadedURL,media_type:mediaType};
      const {error}=await state.client.from("posts").insert(payload);
      if(error)throw error;
      toast(kind==="zeef"?"ZEEF published!":kind==="grom"?"GROM published!":"Post published!");
      state.currentPage=kind==="zeef"?"zeefs":kind==="grom"?"groms":"home";await renderPage();
    }catch(error){console.error(error);toast("Publish nahi hua: "+error.message,"error");}
    finally{button.disabled=false;button.innerHTML='<i class="fa-solid fa-paper-plane"></i> Publish';}
  });
}

    if(postError)throw postError;
    const owners=[...new Set((posts||[]).map(getPostOwnerId).filter(Boolean))];
    if(owners.length){const {data:profiles}=await state.client.from("profiles").select("*").in("id",owners);const map=new Map((profiles||[]).map(p=>[p.id,p]));(posts||[]).forEach(p=>p.profiles=map.get(getPostOwnerId(p))||{});}
    await loadUserPostStates(posts||[]);
    $("#saved-feed").innerHTML=(posts||[]).length?posts.map(p=>postCard(p)).join(""):emptyState("fa-bookmark","Saved posts unavailable","The saved posts could not be found.");
    attachPostEvents($("#saved-feed"));
  }catch(error){$("#saved-feed").innerHTML=`<div class="error-box">Saved posts error: ${escapeHTML(error.message)}</div>`;}
}
async function renderPeopleList(mode="followers",userId=currentUserId()){
  const main=$("#main-content"),followers=mode==="followers";
  main.innerHTML=pageHeading(followers?"Followers":"Following","People in your community")+`<section class="panel section-card"><div id="people-list" class="search-results">Loading…</div></section>`;
  try{
    const field=followers?"follower_id":"following_id",filter=followers?"following_id":"follower_id";
    const {data,error}=await state.client.from("follows").select(field).eq(filter,userId);
    if(error)throw error;
    const ids=[...new Set((data||[]).map(x=>x[field]).filter(Boolean))];
    if(!ids.length){$("#people-list").innerHTML=emptyState("fa-users",followers?"No followers yet":"Not following anyone yet","As people connect, they will appear here.");return;}
    const {data:people,error:peopleError}=await state.client.from("profiles").select("*").in("id",ids);
    if(peopleError)throw peopleError;
    $("#people-list").innerHTML=(people||[]).map(p=>`<div class="search-result" data-person="${escapeHTML(p.id)}"><img class="avatar" src="${escapeHTML(getAvatar(p))}" alt=""><div class="person-info"><strong>${escapeHTML(getDisplayName(p))}</strong><span>${escapeHTML(getUsername(p))}</span></div><button class="btn" data-follow-user="${escapeHTML(p.id)}">Follow</button></div>`).join("");
    $$("[data-person]").forEach(el=>el.addEventListener("click",e=>{if(e.target.closest("[data-follow-user]"))return;state.viewingProfileId=el.dataset.person;navigate("profile");}));
    attachPostEvents(main);
  }catch(error){$("#people-list").innerHTML=`<div class="error-box">List error: ${escapeHTML(error.message)}</div>`;}
}
async function renderEditProfile(){
  const main=$("#main-content");
  const p=state.profile||{};
  main.innerHTML=pageHeading("Edit profile","Make your profile yours")+`<section class="panel section-card"><form id="edit-profile-form">
    <div class="field"><label>Username</label><input id="ep-username" required maxlength="30" value="${escapeHTML(p.username||"")}"></div>
    <div class="field"><label>Display name</label><input id="ep-name" maxlength="60" value="${escapeHTML(p.display_name||"")}"></div>
    <div class="field"><label>Bio</label><textarea id="ep-bio" maxlength="160">${escapeHTML(p.bio||"")}</textarea></div>
    <button class="btn primary">Save profile</button></form></section>`;
  $("#edit-profile-form").onsubmit=async e=>{
    e.preventDefault();
    const username=$("#ep-username").value.trim().toLowerCase().replace(/^@/,"");
    if(!/^[a-z0-9._]{3,30}$/.test(username)){toast("Username 3–30 characters: letters, numbers, dot, underscore.","error");return;}
    try{
      const {data:existing,error:checkError}=await state.client.from("profiles").select("id").eq("username",username).neq("id",currentUserId()).limit(1);
      if(checkError)throw checkError;if(existing?.length){toast("Username already taken","error");return;}
      const {data,error}=await state.client.from("profiles").update({username,display_name:$("#ep-name").value.trim(),bio:$("#ep-bio").value.trim()}).eq("id",currentUserId()).select().single();
      if(error)throw error;state.profile=data;toast("Profile updated");renderShell();await renderPage();
    }catch(error){toast("Profile update error: "+error.message,"error");}
  };
}
async function renderSettings(){
  $("#main-content").innerHTML=pageHeading("Settings","Manage your Gromazeef account")+`
    <section class="panel section-card"><h3>Account</h3><div class="person-row"><img class="avatar" src="${escapeHTML(getAvatar())}" alt=""><div class="person-info"><strong>${escapeHTML(getDisplayName())}</strong><span>${escapeHTML(state.user.email||"")}</span></div></div>
    <div class="divider"></div><button class="btn" id="settings-edit"><i class="fa-solid fa-pen"></i> Edit profile</button> <button class="btn danger" id="settings-logout"><i class="fa-solid fa-right-from-bracket"></i> Sign out</button>
    <div class="divider"></div><div class="notice">Account security: never share passwords or service-role keys. Profile visibility and storage access depend on Supabase RLS policies.</div></section>`;
  $("#settings-edit").onclick=()=>navigate("editProfile");
  $("#settings-logout").onclick=async()=>{const {error}=await state.client.auth.signOut();if(error)toast(error.message,"error");};
}
async function renderNotifications(){
  $("#main-content").innerHTML=pageHeading("Notifications","Updates from your community")+`<section class="panel section-card">${emptyState("fa-bell","Your notifications live here","The notifications table/schema needs to be mapped before real alerts can be shown.")}</section>`;
}
async function renderZChat(){
  const main=$("#main-content");
  main.innerHTML=pageHeading("Z-CHAT","Private conversations with your people")+`
    <section class="panel zchat-layout"><div class="chat-list"><form id="chat-search-form"><input class="searchbox" id="chat-search" placeholder="Find a person…"><button class="btn" style="margin-top:8px;width:100%">Search</button></form><div id="chat-people" class="search-results" style="margin-top:10px"></div></div>
    <div class="chat-window"><div id="chat-header"><strong>Select a person</strong><p class="muted small">Search users to open a conversation.</p></div><div id="chat-thread" style="display:grid;gap:8px;align-content:start;flex:1"></div>
    <form id="chat-send-form" class="chat-compose"><input class="searchbox" id="chat-message-input" placeholder="Write a message…" required><button class="btn primary">Send</button></form></div></section>
    <div class="notice">Z-CHAT UI is ready. Sending/loading real messages depends on the exact columns and Row Level Security policies of your existing <code>messages</code> table.</div>`;
  $("#chat-send-form").onsubmit=async e=>{
    e.preventDefault();
    if(!state.activeChatUserId)return toast("Pehle user search karke select karo.","error");
    const content=$("#chat-message-input").value.trim();if(!content)return;
    try{
      const {error}=await state.client.from("messages").insert({sender_id:currentUserId(),receiver_id:state.activeChatUserId,content});
      if(error)throw error;$("#chat-message-input").value="";toast("Message sent");await loadChatThread();
    }catch(error){toast("Message send nahi hua: "+error.message,"error");}
  };
  $("#chat-search-form").onsubmit=async e=>{
    e.preventDefault();const q=$("#chat-search").value.trim().replace(/[,%()]/g," ");
    try{
      const {data,error}=await state.client.from("profiles").select("*").or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).neq("id",currentUserId()).limit(15);
      if(error)throw error;
      $("#chat-people").innerHTML=(data||[]).map(p=>`<div class="search-result" data-chat-person="${escapeHTML(p.id)}"><img class="avatar sm" src="${escapeHTML(getAvatar(p))}" alt=""><div class="person-info"><strong>${escapeHTML(getDisplayName(p))}</strong><span>${escapeHTML(getUsername(p))}</span></div></div>`).join("")||`<div class="muted small">No people found.</div>`;
      $$("[data-chat-person]").forEach(el=>el.onclick=async()=>{state.activeChatUserId=el.dataset.chatPerson;const person=(data||[]).find(p=>p.id===state.activeChatUserId);$("#chat-header").innerHTML=`<strong>${escapeHTML(getDisplayName(person))}</strong><p class="muted small">${escapeHTML(getUsername(person))}</p>`;await loadChatThread();});
    }catch(error){$("#chat-people").innerHTML=`<div class="error-box">${escapeHTML(error.message)}</div>`;}
  };
  if(state.activeChatUserId)await loadChatThread();
}
async function loadChatThread(){
  const thread=$("#chat-thread");if(!thread||!state.activeChatUserId)return;
  thread.innerHTML=`<div class="muted small">Loading messages…</div>`;
  try{
    const {data,error}=await state.client.from("messages").select("*").or(`and(sender_id.eq.${currentUserId()},receiver_id.eq.${state.activeChatUserId}),and(sender_id.eq.${state.activeChatUserId},receiver_id.eq.${currentUserId()})`).order("created_at",{ascending:true}).limit(100);
    if(error)throw error;
    thread.innerHTML=(data||[]).map(m=>`<div class="chat-message ${m.sender_id===currentUserId()?"mine":""}">${escapeHTML(m.content||m.message||"")}</div>`).join("")||`<div class="empty"><p>No messages yet. Say hello!</p></div>`;
  }catch(error){thread.innerHTML=`<div class="error-box">Messages load nahi hue: ${escapeHTML(error.message)}<br>messages table columns may differ.</div>`;}
}
async function renderPage(){
  if(!state.user){renderAuth();return;}
  switch(state.currentPage){
    case "home":return renderHome();
    case "explore":return renderExplore();
    case "create":return renderCreate("post");
    case "zeefs":return renderMediaFeed("zeef");
    case "groms":return renderMediaFeed("grom");
    case "zchat":return renderZChat();
    case "profile":return renderProfile(state.viewingProfileId||currentUserId());
    case "saved":return renderSaved();
    case "settings":return renderSettings();
    case "editProfile":return renderEditProfile();
    case "followers":return renderPeopleList("followers",state.viewingProfileId||currentUserId());
    case "following":return renderPeopleList("following",state.viewingProfileId||currentUserId());
    case "notifications":return renderNotifications();
    default:state.currentPage="home";return renderHome();
  }
}
async function navigate(page){
  state.currentPage=page;
  if(page==="profile"&&!state.viewingProfileId)state.viewingProfileId=currentUserId();
  renderShell();
  await renderPage();
  $$(".nav-item,.mobile-nav button").forEach(n=>n.classList.toggle("active",n.dataset.page===page));
}
function renderAuth(){
  $("#app").innerHTML=`<div class="auth-screen"><section class="auth-visual"><div class="brand"><span class="brand-mark">G</span> Gromazeef</div><h1>Your world.<br>Your people.<br><span style="color:var(--accent)">Your universe.</span></h1><p>Connect through ZEEFS, GROMS, posts and Z-CHAT. Find your people and share the moments that matter.</p><div class="tag-cloud"><button>ZEEFS ⚡</button><button>GROMS 🎬</button><button>Z-CHAT 💬</button><button>GROWTAGS #</button></div></section>
    <section class="auth-box-wrap"><div class="panel auth-box"><div class="brand" style="margin-bottom:25px"><span class="brand-mark">G</span> Gromazeef</div><div id="auth-form-root"><h2>Welcome back</h2><p class="muted">Sign in to your universe.</p><form id="login-form"><div class="field"><label>Email</label><input id="login-email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="login-password" type="password" autocomplete="current-password" required placeholder="Your password"></div><button class="btn primary" style="width:100%">Sign in</button></form><div class="auth-switch">New here? <button id="show-signup">Create account</button></div><button class="btn" id="forgot-password" style="margin-top:15px;width:100%">Forgot password?</button></div></div></section></div>`;
  $("#show-signup").onclick=renderSignup;
  $("#login-form").onsubmit=async e=>{
    e.preventDefault();const button=e.submitter;button.disabled=true;button.textContent="Signing in…";
    try{const {error}=await state.client.auth.signInWithPassword({email:$("#login-email").value.trim(),password:$("#login-password").value});if(error)throw error;}
    catch(error){toast("Login failed: "+error.message,"error");}
    finally{button.disabled=false;button.textContent="Sign in";}
  };
  $("#forgot-password").onclick=async()=>{
    const email=$("#login-email").value.trim();if(!email)return toast("Pehle email likho.","error");
    const {error}=await state.client.auth.resetPasswordForEmail(email,{redirectTo:location.href});
    toast(error?error.message:"Password reset email requested",error?"error":"success");
  };
}
function renderSignup(){
  $("#auth-form-root").innerHTML=`<h2>Create account</h2><p class="muted">Join the Gromazeef community.</p><form id="signup-form"><div class="field"><label>Display name</label><input id="signup-name" maxlength="60" required placeholder="Your name"></div><div class="field"><label>Username</label><input id="signup-username" maxlength="30" pattern="[A-Za-z0-9._]{3,30}" required placeholder="yourname"></div><div class="field"><label>Email</label><input id="signup-email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="signup-password" type="password" minlength="6" required autocomplete="new-password" placeholder="At least 6 characters"></div><button class="btn primary" style="width:100%">Create account</button></form><div class="auth-switch">Already have an account? <button id="show-login">Sign in</button></div>`;
  $("#show-login").onclick=renderAuth;
  $("#signup-form").onsubmit=async e=>{
    e.preventDefault();const button=e.submitter;button.disabled=true;button.textContent="Creating…";
    const username=$("#signup-username").value.trim().toLowerCase().replace(/^@/,"");
    try{
      if(!/^[a-z0-9._]{3,30}$/.test(username))throw new Error("Username 3–30 characters ka hona chahiye.");
      const {data:existing,error:checkError}=await state.client.from("profiles").select("id").eq("username",username).limit(1);
      if(checkError)throw checkError;if(existing?.length)throw new Error("Username already taken.");
      const {data,error}=await state.client.auth.signUp({email:$("#signup-email").value.trim(),password:$("#signup-password").value,options:{data:{username,display_name:$("#signup-name").value.trim()}}});
      if(error)throw error;
      if(data.user&&!data.session)toast("Account created. Email verification complete karke login karo.");
      else toast("Account created!");
    }catch(error){toast("Signup failed: "+error.message,"error");}
    finally{button.disabled=false;button.textContent="Create account";}
  };
}
async function ensureProfile(){
  if(!state.user)return;
  const {data,error}=await state.client.from("profiles").select("*").eq("id",state.user.id).maybeSingle();
  if(error)throw error;
  if(data){state.profile=data;return data;}
  const meta=state.user.user_metadata||{};
  const suggested=(meta.username||state.user.email?.split("@")[0]||"member").toLowerCase().replace(/[^a-z0-9._]/g,"").slice(0,25)||"member";
  const payload={id:state.user.id,username:suggested,display_name:meta.display_name||suggested};
  const {data:created,error:insertError}=await state.client.from("profiles").insert(payload).select().single();
  if(insertError)throw insertError;
  state.profile=created;return created;
}
async function boot(){
  try{
    if(!window.supabase?.createClient)throw new Error("Supabase library load nahi hui. Internet check karo.");
    state.client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const {data,error}=await state.client.auth.getSession();if(error)throw error;
    state.user=data.session?.user||null;
    if(state.user){try{await ensureProfile();}catch(error){console.warn("Profile setup:",error.message);state.profile={id:state.user.id,username:state.user.email?.split("@")[0]||"member",display_name:state.user.email?.split("@")[0]||"Member"};}}
    renderShell();await renderPage();
    state.client.auth.onAuthStateChange((event,session)=>{
      if(["SIGNED_IN","SIGNED_OUT","TOKEN_REFRESHED","USER_UPDATED"].includes(event)){
        setTimeout(async()=>{
          state.user=session?.user||null;state.profile=null;state.viewingProfileId=null;state.currentPage="home";
          if(state.user){try{await ensureProfile();}catch(error){console.error(error);}}
          renderShell();await renderPage();
        },0);
      }
    });
  }catch(error){showFatal(error);}
}
document.addEventListener("DOMContentLoaded",boot);
</script>
</body>
</html>
